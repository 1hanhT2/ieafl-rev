                  <button type="button" class="day-tab t-small" role="tab" id="tab-${esc(d.id)}" aria-selected="${state.filters.day === d.id ? "true" : "false"}" tabindex="${state.filters.day === d.id ? "0" : "-1"}" data-day="${esc(d.id)}">${esc(d.shortLabel)}</button>
                `).join("")}
              </div>
              <div class="track-toggles-wrap" id="sched-track-toggles">
                ${DATA.tracks.map(t => {
                  const pressed = state.filters.tracks.includes(t.id);
                  return `<button type="button" class="chip-toggle t-small" data-track="${esc(t.id)}" aria-pressed="${pressed ? "true" : "false"}">
                    <svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="10" height="10" fill="${DATA.tokens.ink}"/><rect x="1" y="1" width="8" height="8" fill="${t.chipBg}"/></svg>
                    (${esc(t.label)})
                  </button>`;
                }).join("")}
              </div>
              <button type="button" class="chip-toggle t-small" id="sched-agenda-btn" aria-pressed="${state.filters.agendaOnly ? "true" : "false"}">(My study plan)</button>
              <div class="seg-group" role="group" aria-label="Study plan view">
                <button type="button" class="chip-toggle t-small" id="view-timeline-btn" aria-pressed="${state.filters.view === "timeline" ? "true" : "false"}">(Timeline)</button>
                <button type="button" class="chip-toggle t-small" id="view-table-btn" aria-pressed="${state.filters.view === "table" ? "true" : "false"}">(Table)</button>
              </div>
              <button type="button" class="btn-text t-micro u-anim" id="sched-ics-btn">(Download .ics)</button>
            </div>
          </div>
        </div>
        <div class="grid">
          <p class="col-full t-micro schedule-live-count" id="sched-count" aria-live="polite"></p>
          <div class="col-full" id="sched-body"></div>
        </div>
      </section>
    `;

    // Update scroll-padding-top for sticky controls
    const updateScrollPad = () => {
      const hh = window.innerWidth >= 768 ? 64 : 56;
      const ctrl = document.getElementById("sched-controls");
      const ch = ctrl ? ctrl.getBoundingClientRect().height : 60;
      document.documentElement.style.scrollPaddingTop = `${Math.round(hh + ch + 16)}px`;
    };
    updateScrollPad();
    window.addEventListener("resize", updateScrollPad, { passive: true });
    state.routeCleanup.push(() => {
      window.removeEventListener("resize", updateScrollPad);
      document.documentElement.style.scrollPaddingTop = "80px";
    });

    const dayTabs = Array.from(document.querySelectorAll("#sched-day-tabs .day-tab"));
    const trackBtns = Array.from(document.querySelectorAll("#sched-track-toggles .chip-toggle"));
    const agendaBtn = document.getElementById("sched-agenda-btn");
    const tlBtn = document.getElementById("view-timeline-btn");
    const tblBtn = document.getElementById("view-table-btn");
    const icsBtn = document.getElementById("sched-ics-btn");
    const countEl = document.getElementById("sched-count");
    const bodyEl = document.getElementById("sched-body");

    function getFilteredSessions() {
      const dayAll = sessionsByDay(state.filters.day);
      const filtered = dayAll.filter(s => {
        if (state.filters.tracks.length > 0 && !state.filters.tracks.includes(s.track)) return false;
        if (state.filters.agendaOnly && !state.agenda.includes(s.id)) return false;
        return true;
      });
      return { dayAll, filtered: filtered.sort((a, b) => timeToMin(a.start) - timeToMin(b.start)) };
    }

    function renderScheduleBody(animateEntrance) {
      const dayObj = dayById(state.filters.day);
      const { dayAll, filtered } = getFilteredSessions();
      const breaks = DATA.breaks.filter(b => b.day === state.filters.day);
      countEl.textContent = `${filtered.length} of ${dayAll.length} blocks shown`;

      if (filtered.length === 0) {
        const emptyIcon = (() => {
          let r = `<rect x="0" y="0" width="9" height="9" fill="none" stroke="${DATA.tokens.ink}" stroke-width="1"/>`;
          r += `<line x1="3" y1="0" x2="3" y2="9" stroke="${DATA.tokens.ink}" stroke-width="0.5"/>`;
          r += `<line x1="6" y1="0" x2="6" y2="9" stroke="${DATA.tokens.ink}" stroke-width="0.5"/>`;
          r += `<line x1="0" y1="3" x2="9" y2="3" stroke="${DATA.tokens.ink}" stroke-width="0.5"/>`;
          r += `<line x1="0" y1="6" x2="9" y2="6" stroke="${DATA.tokens.ink}" stroke-width="0.5"/>`;
          return `<svg width="45" height="45" viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
        })();
        const msg = state.filters.agendaOnly && state.agenda.length === 0
          ? "Your study plan is empty. Press + on any block to add it."
          : "Nothing in this stage with these filters.";
        bodyEl.innerHTML = `
          <div class="schedule-empty">
            ${emptyIcon}
            <p class="t-lead">${esc(msg)}</p>
            <button type="button" class="btn-text t-small u-anim" id="sched-clear-btn">(Clear filters)</button>
          </div>
        `;
        document.getElementById("sched-clear-btn").addEventListener("click", () => {
          state.filters.tracks = [];
          state.filters.agendaOnly = false;
          storageSet("ieafl.filters", state.filters);
          trackBtns.forEach(b => b.setAttribute("aria-pressed", "false"));
          agendaBtn.setAttribute("aria-pressed", "false");
          renderScheduleBody(false);
        });
        return;
      }

      if (state.filters.view === "table") {
        const items = [];
        filtered.forEach(s => items.push({ kind: "session", start: s.start, end: s.end, rec: s }));
        breaks.forEach(b => items.push({ kind: "break", start: b.start, end: b.end, rec: b }));
        items.sort((a, b) => timeToMin(a.start) - timeToMin(b.start));

        bodyEl.innerHTML = `
          <table class="data-table responsive-table">
            <caption class="t-micro">${esc(dayObj.fullLabel)}, ${items.length} items</caption>
            <thead>
              <tr>
                <th class="t-micro">Time</th>
                <th class="t-micro">Workspace</th>
                <th class="t-micro">Category</th>
                <th class="t-micro">Format</th>
                <th class="t-micro">Engines</th>
                <th class="t-micro">Skill</th>
                <th class="t-micro">Plan</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(it => {
                if (it.kind === "break") {
                  const b = it.rec;
                  const r = roomById(b.room);
                  return `<tr>
                    <td data-label="Time" class="t-small tnum">${fmtTime(b.start)}–${fmtTime(b.end)}</td>
                    <td data-label="Workspace" class="t-small">${esc(r.name)}</td>
                    <td data-label="Category" class="t-small">Checkpoint</td>
                    <td data-label="Format" class="t-small">${esc(b.title)}</td>
                    <td data-label="Engines" class="t-small">—</td>
                    <td data-label="Skill" class="t-small">—</td>
                    <td data-label="Plan" class="t-small">—</td>
                  </tr>`;
                }
                const s = it.rec;
                const r = roomById(s.room);
                const tr = trackById(s.track);
                const added = state.agenda.includes(s.id);
                const clash = hasClash(s);
                const spks = s.speakers.map(id => `<a class="u-anim" href="#/modules/${esc(id)}">${esc(speakerById(id).name)}</a>`).join(", ");
                return `<tr>
                  <td data-label="Time" class="t-small tnum">${fmtTime(s.start)}–${fmtTime(s.end)}</td>
                  <td data-label="Workspace" class="t-small">${esc(r.name)}</td>
                  <td data-label="Category" class="t-small">${esc(s.type)}</td>
                  <td data-label="Format" class="t-small fw-600"><a class="u-anim" href="#/formats/${esc(s.id)}">${esc(s.title)}</a>${clash ? ` <span class="clash-chip t-micro">Overlap</span>` : ""}</td>
                  <td data-label="Engines" class="t-small">${spks}</td>
                  <td data-label="Skill" class="t-small"><span class="track-chip track-chip-${esc(s.track)}">${esc(tr.label)}</span></td>
                  <td data-label="Plan" class="t-small">
                    <button type="button" class="tl-agenda-btn" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}" aria-label="${added ? "Remove" : "Add"} ${esc(s.title)} ${added ? "from" : "to"} my study plan">${svgPixelIcon(added ? "check" : "plus", 14)}</button>
                  </td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        `;
      } else if (window.innerWidth < 768) {
        // Mobile chronological list
        const items = [];
        filtered.forEach(s => items.push({ kind: "session", start: s.start, rec: s }));
        breaks.forEach(b => items.push({ kind: "break", start: b.start, rec: b }));
        items.sort((a, b) => timeToMin(a.start) - timeToMin(b.start));

        bodyEl.innerHTML = `<div class="schedule-mobile-list">
          ${items.map((it, idx) => {
            if (it.kind === "break") {
              const b = it.rec;
              const r = roomById(b.room);
              return `<div class="tl-break t-micro"><span>${fmtTime(b.start)}–${fmtTime(b.end)} · ${esc(b.title)}</span><span>${esc(r.name)}</span></div>`;
            }
            const s = it.rec;
            const r = roomById(s.room);
            const added = state.agenda.includes(s.id);
            const clash = hasClash(s);
            const spks = s.speakers.map(id => speakerById(id).name).join(", ");
            const stagger = animateEntrance && state.motionOn ? ` style="transition-delay:${Math.min(idx, 7) * 40}ms"` : "";
            return `<article class="tl-session${added ? " is-added" : ""}${clash ? " is-clash" : ""}" data-track="${esc(s.track)}" data-sid="${esc(s.id)}"${stagger}>
              <div class="tl-session-top">
                <div>
                  <div class="t-micro tnum">${fmtTime(s.start)}–${fmtTime(s.end)} · ${esc(s.type)} · ${esc(r.name)}</div>
                  <h2 class="t-small fw-600" style="margin-top:4px;">${esc(s.title)}</h2>
                  <div class="t-micro" style="margin-top:4px;">${esc(spks)}</div>
                  ${clash ? `<div style="margin-top:6px;"><span class="clash-chip t-micro">Overlap</span></div>` : ""}
                </div>
                <button type="button" class="tl-agenda-btn" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}" aria-label="${added ? "Remove" : "Add"} ${esc(s.title)} ${added ? "from" : "to"} my study plan">${svgPixelIcon(added ? "check" : "plus", 14)}</button>
              </div>
            </article>`;
          }).join("")}
        </div>`;
      } else {
        // Desktop / Tablet 15-min CSS grid timeline (09:00 to 21:00 = 48 rows)
        let hourMarks = "";
        for (let h = 9; h <= 21; h++) {
          const row = (h - 9) * 4 + 2;
          hourMarks += `<div class="tl-hour-line" style="grid-row:${row};"></div>`;
          hourMarks += `<div class="tl-hour-label t-micro tnum" style="grid-row:${row} / ${row + 2};">${String(h).padStart(2, "0")}.00</div>`;
        }
        const breakBlocks = breaks.map(b => {
          const rStart = Math.round((timeToMin(b.start) - 540) / 15) + 2;
          const rEnd = Math.round((timeToMin(b.end) - 540) / 15) + 2;
          const rm = roomById(b.room);
          return `<div class="tl-break t-micro" style="grid-row:${rStart} / ${rEnd};">
            <span>${fmtTime(b.start)}–${fmtTime(b.end)} · ${esc(b.title)}</span>
            <span>${esc(rm.name)}</span>
          </div>`;
        }).join("");

        const sessBlocks = filtered.map((s) => {
          const rStart = Math.round((timeToMin(s.start) - 540) / 15) + 2;
          const rEnd = Math.round((timeToMin(s.end) - 540) / 15) + 2;
          const col = ["listening", "speaking", "admin"].includes(s.room) || s.id === "f14" ? 3 : 2;
          const added = state.agenda.includes(s.id);
          const clash = hasClash(s);
          const spks = s.speakers.map(id => speakerById(id).name).join(", ");
          return `<article class="tl-session${added ? " is-added" : ""}${clash ? " is-clash" : ""}" data-track="${esc(s.track)}" data-sid="${esc(s.id)}" style="grid-column:${col};grid-row:${rStart} / ${rEnd};">
            <div class="tl-session-top">
              <div>
                <div class="t-micro tnum">${fmtTime(s.start)}–${fmtTime(s.end)} · ${esc(s.type)}</div>
                <h2 class="t-small fw-600" style="margin-top:2px;">${esc(s.title)}</h2>
                <div class="t-micro" style="margin-top:2px;">${esc(spks)}</div>
              </div>
              <button type="button" class="tl-agenda-btn" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}" aria-label="${added ? "Remove" : "Add"} ${esc(s.title)} ${added ? "from" : "to"} my study plan">${svgPixelIcon(added ? "check" : "plus", 14)}</button>
            </div>
            ${clash ? `<div><span class="clash-chip t-micro">Overlap</span></div>` : ""}
          </article>`;
        }).join("");

        bodyEl.innerHTML = `
          <div class="timeline-grid">
            <div class="tl-room-head t-micro" style="grid-column:1;">Time</div>
            <div class="tl-room-head t-micro" style="grid-column:2;">Core Players (Reading · Writing · Progress)</div>
            <div class="tl-room-head t-micro" style="grid-column:3;">Audio, Speaking & Admin Lab</div>
            ${hourMarks}
            ${breakBlocks}
            ${sessBlocks}
          </div>
        `;
      }

      // Wire study plan toggles and block navigation
      bodyEl.querySelectorAll("[data-ag]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          toggleAgenda(btn.dataset.ag);
          renderScheduleBody(false);
        });
      });
      bodyEl.querySelectorAll(".tl-session[data-sid]").forEach(card => {
        card.addEventListener("click", e => {
          if (e.target.closest("[data-ag]")) return;
          window.location.hash = `#/formats/${card.dataset.sid}`;
        });
        card.addEventListener("pointerenter", () => {
          if (card.scrollHeight > card.clientHeight + 2) {
            const s = sessionById(card.dataset.sid);
            if (s) showTip(card.getBoundingClientRect(), `${fmtTime(s.start)}–${fmtTime(s.end)} · ${s.title}`, false);
          }
        });
        card.addEventListener("pointerleave", hideTip);
      });
    }

    // Tab switching (click + keyboard roving tabindex)
    function selectDay(dayId, moveFocus) {
      state.filters.day = dayId;
      storageSet("ieafl.filters", state.filters);
      dayTabs.forEach(t => {
        const active = t.dataset.day === dayId;
        t.setAttribute("aria-selected", active ? "true" : "false");
        t.setAttribute("tabindex", active ? "0" : "-1");
        if (active && moveFocus) t.focus();
      });
      renderScheduleBody(true);
    }

    dayTabs.forEach((tab, idx) => {
      tab.addEventListener("click", () => selectDay(tab.dataset.day, false));
      tab.addEventListener("keydown", e => {
        let nextIdx = -1;
        if (e.key === "ArrowRight") nextIdx = (idx + 1) % dayTabs.length;
        else if (e.key === "ArrowLeft") nextIdx = (idx - 1 + dayTabs.length) % dayTabs.length;
        else if (e.key === "Home") nextIdx = 0;
        else if (e.key === "End") nextIdx = dayTabs.length - 1;
        if (nextIdx >= 0) {
          e.preventDefault();
          selectDay(dayTabs[nextIdx].dataset.day, true);
        }
      });
    });

    trackBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tid = btn.dataset.track;
        const i = state.filters.tracks.indexOf(tid);
        if (i === -1) state.filters.tracks.push(tid);
        else state.filters.tracks.splice(i, 1);
        btn.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        storageSet("ieafl.filters", state.filters);
        renderScheduleBody(false);
      });
    });

    agendaBtn.addEventListener("click", () => {
      state.filters.agendaOnly = !state.filters.agendaOnly;
      agendaBtn.setAttribute("aria-pressed", state.filters.agendaOnly ? "true" : "false");
      storageSet("ieafl.filters", state.filters);
      renderScheduleBody(false);
    });

    const setView = v => {
      state.filters.view = v;
      tlBtn.setAttribute("aria-pressed", v === "timeline" ? "true" : "false");
      tblBtn.setAttribute("aria-pressed", v === "table" ? "true" : "false");
      storageSet("ieafl.filters", state.filters);
      renderScheduleBody(false);
    };
    tlBtn.addEventListener("click", () => setView("timeline"));
    tblBtn.addEventListener("click", () => setView("table"));

    icsBtn.addEventListener("click", () => {
      const exportSessions = state.agenda.length > 0
        ? state.agenda.map(id => sessionById(id)).filter(Boolean)
        : getFilteredSessions().filtered;
      const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//ieafl//StudyPlan//EN"
      ];
      exportSessions.forEach(s => {
        const d = dayById(s.day);
        const rm = roomById(s.room);
        const ymd = d.date.replace(/-/g, "");
        const toUtc = hhmm => {
          const [hh, mm] = hhmm.split(":").map(Number);
          return String(hh).padStart(2, "0") + String(mm).padStart(2, "0") + "00Z";
        };
        lines.push("BEGIN:VEVENT");
        lines.push(`UID:${s.id}@ieafl.app`);
        lines.push(`DTSTAMP:20261121T000000Z`);
        lines.push(`DTSTART:${ymd}T${toUtc(s.start)}`);
        lines.push(`DTEND:${ymd}T${toUtc(s.end)}`);
        lines.push(`SUMMARY:ieafl — ${s.title}`);
        lines.push(`LOCATION:${rm.name} (${rm.nickname})`);
        lines.push(`DESCRIPTION:${s.abstract}`);
        lines.push("END:VEVENT");
      });
      lines.push("END:VCALENDAR");
      const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = "ieafl-study-plan.ics";
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    });

    const onResize = () => renderScheduleBody(false);
    window.addEventListener("resize", onResize, { passive: true });
    state.routeCleanup.push(() => window.removeEventListener("resize", onResize));

    // Interactive 12-Week IELTS Skill-Building Roadmap
    const roadmapHost = document.getElementById("study-roadmap");
    const MILESTONES = DATA.roadmapMilestones;
    const TOTAL_ROADMAP_STEPS = MILESTONES.reduce((sum, m) => sum + m.steps.length, 0);
    let lastDashOffset = null;

    function isStepDone(stepId) {
      return state.roadmap.completedSteps.includes(stepId);
    }

    function milestoneDoneCount(m) {
      return m.steps.filter(st => isStepDone(st.id)).length;
    }

    function toggleRoadmapStep(stepId) {
      const idx = state.roadmap.completedSteps.indexOf(stepId);
      if (idx === -1) state.roadmap.completedSteps.push(stepId);
      else state.roadmap.completedSteps.splice(idx, 1);
      storageSet("ieafl.roadmapSteps", state.roadmap.completedSteps);
      if (window.IEAFL_CLOUD && typeof window.IEAFL_CLOUD.syncRoadmapSteps === "function") {
        window.IEAFL_CLOUD.syncRoadmapSteps(state.roadmap.completedSteps).catch(() => {});
      }
    }

    function toggleMilestoneAll(m) {
      const allDone = milestoneDoneCount(m) === m.steps.length;
      if (allDone) {
        const ids = new Set(m.steps.map(st => st.id));
        state.roadmap.completedSteps = state.roadmap.completedSteps.filter(id => !ids.has(id));
      } else {
        m.steps.forEach(st => {
          if (!state.roadmap.completedSteps.includes(st.id)) {
            state.roadmap.completedSteps.push(st.id);
          }
        });
      }
      storageSet("ieafl.roadmapSteps", state.roadmap.completedSteps);
      if (window.IEAFL_CLOUD && typeof window.IEAFL_CLOUD.syncRoadmapSteps === "function") {
        window.IEAFL_CLOUD.syncRoadmapSteps(state.roadmap.completedSteps).catch(() => {});
      }
    }

    const onCloudRoadmapSync = e => {
      const prof = e && e.detail && e.detail.profile;
      if (prof && Array.isArray(prof.completedRoadmapSteps)) {
        state.roadmap.completedSteps = prof.completedRoadmapSteps.slice();
        storageSet("ieafl.roadmapSteps", state.roadmap.completedSteps);
        renderRoadmap(false, false);
      }
    };
    window.addEventListener("ieafl:cloud-update", onCloudRoadmapSync);
    state.routeCleanup.push(() => window.removeEventListener("ieafl:cloud-update", onCloudRoadmapSync));

    // Build stepped pixel-orthogonal SVG coordinates for all 6 milestones
    function buildRoadmapSvg(selectedIdx, skillFilter) {
      const W = 960;
      const H = 196;
      const padL = 74;
      const padR = 46;
      const topY = 30;
      const botY = 154;
      const minB = 5.0;
      const maxB = 9.0;
      const stepX = (W - padL - padR) / (MILESTONES.length - 1);

      const pts = MILESTONES.map((m, i) => ({
        x: Math.round(padL + i * stepX),
        y: Math.round(botY - ((m.bandVal - minB) / (maxB - minB)) * (botY - topY)),
        m,
        i
      }));

      // Create stepped right-angle path between milestone nodes
      function makeSteppedPath(list) {
        if (list.length === 0) return "";
        let d = `M ${list[0].x} ${list[0].y}`;
        for (let i = 1; i < list.length; i++) {
          const prev = list[i - 1];
          const curr = list[i];
          const midX = Math.round((prev.x + curr.x) / 2);
          d += ` L ${midX} ${prev.y} L ${midX} ${curr.y} L ${curr.x} ${curr.y}`;
        }
        return d;
      }

      function steppedLength(list) {
        let len = 0;
        for (let i = 1; i < list.length; i++) {
          const prev = list[i - 1];
          const curr = list[i];
          len += Math.abs(curr.x - prev.x) + Math.abs(curr.y - prev.y);
        }
        return len;
      }

      const fullPath = makeSteppedPath(pts);
      const totalLen = steppedLength(pts);
      const activePts = pts.slice(0, selectedIdx + 1);
      const activeLen = steppedLength(activePts);
      const targetDashOffset = Math.max(0, totalLen - activeLen);
      const startDashOffset = (state.motionOn && lastDashOffset !== null) ? lastDashOffset : targetDashOffset;

      const bandGuides = [5.5, 6.5, 7.5, 8.5].map(b => {
        const y = Math.round(botY - ((b - minB) / (maxB - minB)) * (botY - topY));
        return `
          <line class="roadmap-grid-line" x1="${padL - 12}" y1="${y}" x2="${W - padR + 14}" y2="${y}"/>
          <text class="roadmap-grid-label" x="${padL - 18}" y="${y + 4}" text-anchor="end">B${b.toFixed(1)}</text>
        `;
      }).join("");

      const activeSegmentPath = activePts.length > 1 ? makeSteppedPath(activePts) : "";

      const nodesSvg = pts.map(({ x, y, m, i }) => {
        const isSel = i === selectedIdx;
        const doneCount = milestoneDoneCount(m);
        const isDone = doneCount === m.steps.length;
        const matchesSkill = skillFilter === "all" || m.skills.includes(skillFilter);
        const opacity = matchesSkill ? "1" : "0.35";
        const fill = isSel ? DATA.tokens.sodium : isDone ? DATA.tokens.mint : DATA.tokens.paper;
        const stroke = DATA.tokens.ink;
        const size = isSel ? 18 : 14;
        const half = size / 2;

        return `
          <g class="roadmap-svg-node" data-rm-node="${esc(m.id)}" opacity="${opacity}" role="button" tabindex="-1" aria-label="Select ${esc(m.code)}: ${esc(m.title)} (${esc(m.band)})">
            <line x1="${x}" y1="${y + half}" x2="${x}" y2="${botY + 12}" stroke="rgba(10,10,10,0.16)" stroke-width="1" stroke-dasharray="2 3"/>
            ${isSel ? `<rect class="roadmap-node-ring" x="${x - 13}" y="${y - 13}" width="26" height="26" fill="none" stroke="${DATA.tokens.ink}" stroke-width="1.5"/>` : ""}
            <rect x="${x - half}" y="${y - half}" width="${size}" height="${size}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
            ${isDone ? `<path d="M ${x - 4} ${y} L ${x - 1} ${y + 3} L ${x + 4} ${y - 3}" fill="none" stroke="${DATA.tokens.ink}" stroke-width="2" stroke-linecap="square"/>` : (isSel ? `<rect x="${x - 3}" y="${y - 3}" width="6" height="6" fill="${DATA.tokens.ink}"/>` : "")}
            <text class="roadmap-grid-label" x="${x}" y="${botY + 28}" text-anchor="middle" font-weight="${isSel ? "700" : "500"}">${esc(m.code)} · ${esc(m.band)}</text>
          </g>
        `;
      }).join("");

      return {
        targetDashOffset,
        svg: `
          <svg class="roadmap-svg" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" role="img" aria-label="Stepped band progression trajectory from Band 5.5 to Band 8.5+ across six IELTS milestones">
            ${bandGuides}
            <path class="roadmap-path-bg" d="${fullPath}"/>
            <path class="roadmap-path-active" id="rm-active-path" d="${fullPath}" stroke-dasharray="${totalLen}" stroke-dashoffset="${startDashOffset}"/>
            ${activeSegmentPath ? `<path class="roadmap-path-pulse" d="${activeSegmentPath}"/>` : ""}
            ${nodesSvg}
          </svg>
        `
      };
    }

    function renderRoadmap(focusMilestoneBtn, animatePanel = true) {
      const selIdx = Math.max(0, MILESTONES.findIndex(m => m.id === state.roadmap.selectedId));
      const activeM = MILESTONES[selIdx];
      const skillFilter = state.roadmap.skillFilter;
      const totalDoneSteps = state.roadmap.completedSteps.length;
      const totalDoneMilestones = MILESTONES.filter(m => milestoneDoneCount(m) === m.steps.length).length;
      const progressRatio = TOTAL_ROADMAP_STEPS > 0 ? totalDoneSteps / TOTAL_ROADMAP_STEPS : 0;
      const activeDoneCount = milestoneDoneCount(activeM);
      const activeAllDone = activeDoneCount === activeM.steps.length;
      const svgResult = buildRoadmapSvg(selIdx, skillFilter);

      const skillFilters = [
        { id: "all", label: "All skills", color: null },
        ...DATA.tracks.map(t => ({ id: t.id, label: t.label, color: t.chipBg }))
      ];

      roadmapHost.innerHTML = `
        <div class="roadmap-header">
          <div class="roadmap-header-left">
            <p class="t-micro">(Skill-Building Roadmap · 12 Weeks)</p>
            <h2 class="t-lead">Interactive IELTS Band Progression</h2>
            <p class="t-micro tnum" aria-live="polite">
              ${totalDoneSteps} / ${TOTAL_ROADMAP_STEPS} skill steps · ${totalDoneMilestones} / ${MILESTONES.length} milestones complete · Click any milestone node to inspect drills
            </p>
          </div>
          <div class="roadmap-toolbar">
            <div class="track-toggles-wrap" role="group" aria-label="Highlight skill on roadmap">
              ${skillFilters.map(sf => `
                <button type="button" class="chip-toggle t-micro" data-rm-skill="${esc(sf.id)}" aria-pressed="${skillFilter === sf.id ? "true" : "false"}">
                  ${sf.color ? `<svg width="9" height="9" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="10" height="10" fill="${DATA.tokens.ink}"/><rect x="1" y="1" width="8" height="8" fill="${sf.color}"/></svg>` : ""}
                  (${esc(sf.label)})
                </button>
              `).join("")}
            </div>
            <div class="seg-group" role="group" aria-label="Step through milestones">
              <button type="button" class="chip-toggle t-micro" id="rm-prev-btn" ${selIdx === 0 ? "disabled" : ""}>(Prev)</button>
              <button type="button" class="chip-toggle t-micro" id="rm-next-btn" ${selIdx === MILESTONES.length - 1 ? "disabled" : ""}>(Next)</button>
            </div>
          </div>
        </div>

        <div class="roadmap-stage">
          <div class="roadmap-canvas-wrap">
            ${svgResult.svg}
          </div>

          <div class="roadmap-nodes-grid" role="tablist" aria-label="IELTS roadmap milestones">
            ${MILESTONES.map((m, i) => {
              const isSel = i === selIdx;
              const done = milestoneDoneCount(m);
              const isComplete = done === m.steps.length;
              const matchesSkill = skillFilter === "all" || m.skills.includes(skillFilter);
              return `
                <button type="button"
                  class="roadmap-node-btn${isComplete ? " is-complete" : ""}${matchesSkill ? "" : " is-dimmed"}"
                  role="tab"
                  id="rm-tab-${esc(m.id)}"
                  aria-selected="${isSel ? "true" : "false"}"
                  aria-controls="rm-panel-${esc(m.id)}"
                  tabindex="${isSel ? "0" : "-1"}"
                  data-rm-select="${esc(m.id)}">
                  <div>
                    <div class="roadmap-node-top t-micro tnum">
                      <span>${esc(m.code)} · ${esc(m.weeks)}</span>
                      <span>${isComplete ? "Done" : `${done}/${m.steps.length}`}</span>
                    </div>
                    <div class="t-small fw-600" style="margin-top:6px;">${esc(m.title)}</div>
                  </div>
                  <div>
                    <div class="t-micro tnum">${esc(m.band)}</div>
                    <div class="roadmap-skill-bar" aria-hidden="true">
                      ${m.skills.map(sk => {
                        const tr = trackById(sk);
                        return `<span class="roadmap-skill-pip" style="background-color:${tr ? tr.chipBg : DATA.tokens.ink}"></span>`;
                      }).join("")}
                    </div>
                  </div>
                </button>
              `;
            }).join("")}
          </div>

          <div class="roadmap-progress-bar" role="progressbar" aria-label="Roadmap skill step completion" aria-valuemin="0" aria-valuemax="${TOTAL_ROADMAP_STEPS}" aria-valuenow="${totalDoneSteps}">
            <div class="roadmap-progress-fill" style="transform:scaleX(${progressRatio.toFixed(4)})"></div>
          </div>

          <div class="roadmap-detail${animatePanel ? " is-entering" : ""}" id="rm-panel-${esc(activeM.id)}" role="tabpanel" aria-labelledby="rm-tab-${esc(activeM.id)}">
            <div class="roadmap-detail-head">
              <div class="roadmap-detail-title-wrap">
                <p class="t-micro tnum">${esc(activeM.code)} · ${esc(activeM.weeks)} · ${esc(activeM.stageLabel)} · Target ${esc(activeM.band)}</p>
                <h3 class="t-h2" style="margin-top:6px;">${esc(activeM.title)}</h3>
                <p class="t-small" style="margin-top:8px;">${esc(activeM.summary)}</p>
              </div>
              <div class="roadmap-detail-actions">
                <button type="button" class="chip-toggle t-micro" id="rm-sync-stage-btn" data-sync-stage="${esc(activeM.stageId)}">(Sync schedule to ${esc(activeM.stageLabel.split(" — ")[0])})</button>
                <button type="button" class="chip-toggle t-micro" id="rm-complete-all-btn" aria-pressed="${activeAllDone ? "true" : "false"}">
                  ${svgPixelIcon(activeAllDone ? "check" : "plus", 12)}
                  (${activeAllDone ? "Milestone completed" : "Mark milestone complete"})
                </button>
              </div>
            </div>

            <div class="roadmap-steps-grid">
              ${activeM.steps.map((st, idx) => {
                const tr = trackById(st.skill);
                const done = isStepDone(st.id);
                const matchesSkill = skillFilter === "all" || st.skill === skillFilter;
                const delayStyle = animatePanel && state.motionOn ? ` style="animation-delay:${idx * 35}ms"` : "";
                return `
                  <article class="roadmap-step-card${done ? " is-done" : ""}${matchesSkill ? "" : " is-dimmed"}"${delayStyle}>
                    <div>
                      <div class="roadmap-step-top">
                        <div class="roadmap-step-meta t-micro tnum">
                          ${svgSectionPixelIcon(st.skill, tr ? tr.chipBg : DATA.tokens.ink, "roadmap-step-icon")}
                          <span class="fw-600">${esc(tr ? tr.label : st.skill)}</span>
                          <span aria-hidden="true">·</span>
                          <span>Step 0${idx + 1}</span>
                          <span aria-hidden="true">·</span>
                          <span>${esc(st.duration)}</span>
                          <span aria-hidden="true">·</span>
                          <span>${esc(st.target)}</span>
                        </div>
                        <button type="button" class="roadmap-step-check" data-rm-step="${esc(st.id)}" aria-pressed="${done ? "true" : "false"}" aria-label="${done ? "Mark incomplete" : "Mark complete"}: ${esc(st.title)}">
                          ${svgPixelIcon(done ? "check" : "plus", 14)}
                        </button>
                      </div>
                      <h4 class="t-small fw-600" style="margin-top:10px;">${esc(st.title)}</h4>
                      <p class="t-small" style="margin-top:6px;">${esc(st.detail)}</p>
                    </div>
                    <div class="roadmap-step-foot t-micro">
                      <a class="u-anim" href="#/formats/${esc(st.formatId)}">(${esc(st.formatLabel)})</a>
                      <span class="tnum">${done ? "Completed" : "Planned"}</span>
                    </div>
                  </article>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;

      // Smoothly animate SVG stepped stroke-dashoffset from previous milestone to current
      const activePathEl = document.getElementById("rm-active-path");
      if (activePathEl && state.motionOn && lastDashOffset !== null && lastDashOffset !== svgResult.targetDashOffset) {
        window.requestAnimationFrame(() => {
          activePathEl.style.strokeDashoffset = String(svgResult.targetDashOffset);
        });
      }
      lastDashOffset = svgResult.targetDashOffset;

      // Bind milestone selection (grid buttons + SVG nodes + Prev/Next + keyboard arrows)
      const selectMilestone = (id, moveFocus) => {
        if (!MILESTONES.some(m => m.id === id)) return;
        state.roadmap.selectedId = id;
        renderRoadmap(moveFocus, true);
      };

      roadmapHost.querySelectorAll("[data-rm-select]").forEach((btn, idx) => {
        btn.addEventListener("click", () => selectMilestone(btn.dataset.rmSelect, false));
        btn.addEventListener("keydown", e => {
          let nextIdx = -1;
          if (e.key === "ArrowRight") nextIdx = (idx + 1) % MILESTONES.length;
          else if (e.key === "ArrowLeft") nextIdx = (idx - 1 + MILESTONES.length) % MILESTONES.length;
          else if (e.key === "Home") nextIdx = 0;
          else if (e.key === "End") nextIdx = MILESTONES.length - 1;
          if (nextIdx >= 0) {
            e.preventDefault();
            selectMilestone(MILESTONES[nextIdx].id, true);
          }
        });
      });

      roadmapHost.querySelectorAll("[data-rm-node]").forEach(node => {
        node.addEventListener("click", () => selectMilestone(node.dataset.rmNode, false));
      });

      const prevBtn = document.getElementById("rm-prev-btn");
      const nextBtn = document.getElementById("rm-next-btn");
      if (prevBtn) prevBtn.addEventListener("click", () => { if (selIdx > 0) selectMilestone(MILESTONES[selIdx - 1].id, false); });
      if (nextBtn) nextBtn.addEventListener("click", () => { if (selIdx < MILESTONES.length - 1) selectMilestone(MILESTONES[selIdx + 1].id, false); });

      roadmapHost.querySelectorAll("[data-rm-skill]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.roadmap.skillFilter = btn.dataset.rmSkill;
          renderRoadmap(false, false);
        });
      });

      roadmapHost.querySelectorAll("[data-rm-step]").forEach(btn => {
        btn.addEventListener("click", () => {
          toggleRoadmapStep(btn.dataset.rmStep);
          renderRoadmap(false, false);
        });
      });

      const completeAllBtn = document.getElementById("rm-complete-all-btn");
      if (completeAllBtn) {
        completeAllBtn.addEventListener("click", () => {
          toggleMilestoneAll(activeM);
          renderRoadmap(false, false);
        });
      }

      const syncStageBtn = document.getElementById("rm-sync-stage-btn");
      if (syncStageBtn) {
        syncStageBtn.addEventListener("click", () => {
          const targetDay = syncStageBtn.dataset.syncStage;
          if (skillFilter !== "all") {
            state.filters.tracks = [skillFilter];
            trackBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.track === skillFilter ? "true" : "false"));
          } else {
            state.filters.tracks = [];
            trackBtns.forEach(b => b.setAttribute("aria-pressed", "false"));
          }
          selectDay(targetDay, false);
          const ctrlEl = document.getElementById("sched-controls");
          if (ctrlEl) ctrlEl.scrollIntoView({ behavior: state.motionOn ? "smooth" : "auto", block: "start" });
        });
      }

      if (focusMilestoneBtn) {
        const focusEl = document.getElementById(`rm-tab-${activeM.id}`);
        if (focusEl) focusEl.focus();
      }
      updateScrollPad();
    }

    renderRoadmap(false, true);
    renderScheduleBody(true);
  }

  // Route 3: Modules Index (#/modules)
  function renderSpeakers(main) {
    document.title = "Modules" + DATA.copy.siteTitleSuffix;
    main.innerHTML = `
      <section class="sub-sec" data-surface="sodium" data-pager="Modules">
        <div class="grid">
          <p class="col-1-3 t-micro">(Modules)</p>
          <div class="col-5-12">
            <h1 class="t-h1" tabindex="-1">${esc(DATA.copy.speakersTitle)}</h1>
            <p class="t-body" style="margin-top:16px;">${esc(DATA.copy.speakersLeadPage)}</p>
            <div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
              <div class="track-toggles-wrap" id="spk-track-toggles">
                ${DATA.tracks.map(t => {
                  const pressed = state.speakersFilter.tracks.includes(t.id);
                  return `<button type="button" class="chip-toggle t-small" data-track="${esc(t.id)}" aria-pressed="${pressed ? "true" : "false"}">
                    <svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="10" height="10" fill="${DATA.tokens.ink}"/><rect x="1" y="1" width="8" height="8" fill="${t.chipBg}"/></svg>
                    (${esc(t.label)})
                  </button>`;
                }).join("")}
              </div>
              <div class="seg-group" role="group" aria-label="Sort modules">
                <button type="button" class="chip-toggle t-small" id="spk-sort-az" aria-pressed="${state.speakersFilter.sort === "az" ? "true" : "false"}">(A–Z)</button>
                <button type="button" class="chip-toggle t-small" id="spk-sort-day" aria-pressed="${state.speakersFilter.sort === "day" ? "true" : "false"}">(By stage)</button>
              </div>
            </div>
          </div>
          <div class="col-full" id="spk-grid-wrap"></div>
        </div>
      </section>
    `;

    const gridWrap = document.getElementById("spk-grid-wrap");
    const trackBtns = Array.from(document.querySelectorAll("#spk-track-toggles .chip-toggle"));
    const azBtn = document.getElementById("spk-sort-az");
    const dayBtn = document.getElementById("spk-sort-day");

    function firstSessionOrder(sp) {
      const list = sessionsBySpeaker(sp.id).slice().sort((a, b) => {
        if (a.day !== b.day) return a.day.localeCompare(b.day);
        return timeToMin(a.start) - timeToMin(b.start);
      });
      const first = list[0];
      if (!first) return 999999;
      return Number(first.day[1]) * 10000 + timeToMin(first.start);
    }

    function drawList(skipFade) {
      let list = DATA.speakers.filter(sp =>
        state.speakersFilter.tracks.length === 0 || state.speakersFilter.tracks.includes(sp.track)
      );
      if (state.speakersFilter.sort === "az") {
        list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
      } else {
        list = list.slice().sort((a, b) => firstSessionOrder(a) - firstSessionOrder(b));
      }

      if (list.length === 0) {
        gridWrap.innerHTML = `<p class="t-lead" style="margin-top:48px;">No modules in this skill.</p>`;
        return;
      }

      const doRender = () => {
        gridWrap.innerHTML = `<div class="speakers-index-grid">
          ${list.map(sp => {
            const tr = trackById(sp.track);
            const sess = sessionsBySpeaker(sp.id);
            return `<figure class="speaker-card" data-spcard="${esc(sp.id)}">
              <a class="speaker-card-link" href="#/modules/${esc(sp.id)}">
                <canvas class="portrait-canvas" data-spid="${esc(sp.id)}" role="img" aria-label="Pixel emblem for ${esc(sp.name)}"></canvas>
              </a>
              <figcaption class="speaker-card-figcap">
                <h2 class="t-lead speaker-card-name"><a class="u-anim" href="#/modules/${esc(sp.id)}">${esc(sp.name)}</a></h2>
                <p class="t-small speaker-card-role">${esc(sp.role)}, ${esc(sp.org)}</p>
                <p class="t-micro" style="margin-top:4px;">${esc(sp.city)} · <span class="track-chip track-chip-${esc(sp.track)}">${esc(tr.label)}</span></p>
                <ul style="margin-top:8px;display:flex;flex-direction:column;gap:4px;">
                  ${sess.map(s => `<li class="t-micro"><a class="u-anim" href="#/formats/${esc(s.id)}">${esc(s.title)}</a></li>`).join("")}
                </ul>
              </figcaption>
            </figure>`;
          }).join("")}
        </div>`;

        list.forEach(sp => {
          const canvas = gridWrap.querySelector(`canvas[data-spid="${sp.id}"]`);
          if (canvas) initPortraitCanvas(canvas, sp, { skipAssemble: !skipFade });
        });
      };

      const existing = Array.from(gridWrap.querySelectorAll(".speaker-card"));
      if (!skipFade && state.motionOn && existing.length > 0) {
        const keepIds = new Set(list.map(s => s.id));
        const leaving = existing.filter(el => !keepIds.has(el.dataset.spcard));
        if (leaving.length > 0) {
          leaving.forEach(el => el.classList.add("is-leaving"));
          window.setTimeout(doRender, 160);
          return;
        }
      }
      doRender();
    }

    trackBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tid = btn.dataset.track;
        const i = state.speakersFilter.tracks.indexOf(tid);
        if (i === -1) state.speakersFilter.tracks.push(tid);
        else state.speakersFilter.tracks.splice(i, 1);
        btn.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        drawList(false);
      });
    });

    azBtn.addEventListener("click", () => {
      state.speakersFilter.sort = "az";
      azBtn.setAttribute("aria-pressed", "true");
      dayBtn.setAttribute("aria-pressed", "false");

  // Route 5: Official IELTS Exam Format (#/formats and #/formats/<id>)
  function renderTalks(main, formatId) {

      f07: "r08", f08: "l03", f09: "w03", f10: "w03", f11: "s01", f12: "s03",
      f13: "l01", f14: "r04", f15: "s02", f16: "l05", f17: "w01", f18: "s02"
    };
    const resolvedId = formatId ? (examFormatById(formatId) ? formatId : SESSION_TO_FORMAT[formatId]) : null;
    if (resolvedId && examFormatById(resolvedId)) {
      const targetFmt = examFormatById(resolvedId);
      state.talksFilter.openId = resolvedId;
      if (state.talksFilter.tracks.length > 0 && !state.talksFilter.tracks.includes(targetFmt.track)) {
        state.talksFilter.tracks = [];

      if (state.talksFilter.types.length > 0 && !state.talksFilter.types.includes(targetFmt.module)) {
        state.talksFilter.types = [];

      if (state.talksFilter.query) {

    const MODULE_FILTERS = ["Academic & GT", "Academic", "General Training", "NEC (HSGQG)", "Digital SAT", "HSG Tiếng Anh", "Olympic 30/4"];
    state.talksFilter.types = state.talksFilter.types.filter(t => MODULE_FILTERS.includes(t));

    main.innerHTML = `
      <section class="sub-sec" data-surface="paper" data-pager="Exam Format">
        <div class="grid">
          <p class="col-1-3 t-micro">(Exam format)</p>
          <div class="col-5-12">

          </div>

            ${DATA.examOverview.map(sec => {
              const active = state.talksFilter.tracks.length === 1 && state.talksFilter.tracks[0] === sec.track;
              const count = examFormatsByTrack(sec.track).length;

              return `
                <button type="button" class="exam-overview-card" data-ov-track="${esc(sec.track)}" aria-pressed="${active ? "true" : "false"}">
                  <div>
                    <div class="exam-overview-head">
                      <span class="exam-overview-title-row">
                        ${svgSectionPixelIcon(sec.track, sec.color, "exam-overview-icon")}
                        <span class="t-lead">${esc(sec.title)}</span>
                      </span>
                      <span class="track-chip track-chip-${esc(sec.track)} t-micro tnum">${count} ${unit}</span>
                    </div>
                    <div class="exam-overview-meta" style="margin-top:12px;">
                      <span class="t-small fw-600 tnum">${esc(sec.timing)}</span>

                    <ul class="exam-overview-parts t-micro" style="margin-top:12px;">

            }).join("")}
          </div>
          <div class="col-full talks-controls">

                <input class="text-input" type="search" id="talks-search" placeholder="Try: TFNG, headings, map, cue card, essay" value="${esc(state.talksFilter.query)}">
              </div>

                ${MODULE_FILTERS.map(mod => {
                  const pressed = state.talksFilter.types.includes(mod);

              <div class="track-toggles-wrap" id="talks-track-toggles">
                ${DATA.tracks.map(t => {

                    <svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="10" height="10" fill="${DATA.tokens.ink}"/><rect x="1" y="1" width="8" height="8" fill="${t.chipBg}"/></svg>

    const searchInput = document.getElementById("talks-search");
    const typeBtns = Array.from(document.querySelectorAll("#talks-type-toggles .chip-toggle"));
    const trackBtns = Array.from(document.querySelectorAll("#talks-track-toggles .chip-toggle"));
    const ovCards = Array.from(document.querySelectorAll("#exam-overview-grid .exam-overview-card"));
    const countEl = document.getElementById("talks-count");
    const wrapEl = document.getElementById("talks-table-wrap");

    function syncOverviewCards() {
      ovCards.forEach(c => {
        const active = state.talksFilter.tracks.length === 1 && state.talksFilter.tracks[0] === c.dataset.ovTrack;
        c.setAttribute("aria-pressed", active ? "true" : "false");
      });
      trackBtns.forEach(b => {
        b.setAttribute("aria-pressed", state.talksFilter.tracks.includes(b.dataset.track) ? "true" : "false");
      });
    }

    function highlightText(text, query) {
      if (!query) return esc(text);
      const normQ = normText(query.trim());
      if (!normQ) return esc(text);
      let out = "";
      let pos = 0;
      const rawChars = Array.from(text);
      const normChars = rawChars.map(c => normText(c));
      const flatNorm = normChars.join("");
      let idx = flatNorm.indexOf(normQ);
      if (idx === -1) return esc(text);
      const mapStart = [];
      for (let i = 0; i < rawChars.length; i++) {
        for (let k = 0; k < normChars[i].length; k++) mapStart.push(i);
      }
      mapStart.push(rawChars.length);
      while (idx !== -1) {
        const rawS = mapStart[idx];
        const rawE = mapStart[idx + normQ.length];
        out += esc(rawChars.slice(pos, rawS).join(""));
        out += `<mark>${esc(rawChars.slice(rawS, rawE).join(""))}</mark>`;
        pos = rawE;
        idx = flatNorm.indexOf(normQ, idx + normQ.length);
      }
      out += esc(rawChars.slice(pos).join(""));
      return out;
    }

    function renderTable() {
      syncOverviewCards();
      const q = normText(state.talksFilter.query.trim());
      let list = DATA.examFormats.filter(item => {
        if (state.talksFilter.types.length > 0 && !state.talksFilter.types.includes(item.module)) return false;
        if (state.talksFilter.tracks.length > 0 && !state.talksFilter.tracks.includes(item.track)) return false;
        if (q) {
          const hay = normText(`${item.code} ${item.title} ${item.description} ${item.tests} ${item.rules} ${item.section} ${item.module}`);
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const dir = state.talksFilter.sortDir === "asc" ? 1 : -1;
      const col = state.talksFilter.sortCol;
      const skillOrder = { listening: 1, reading: 2, writing: 3, speaking: 4 };
      list.sort((a, b) => {
        if (col === "title") return a.title.localeCompare(b.title) * dir;
        if (col === "day") {
          const diff = (skillOrder[a.track] || 9) - (skillOrder[b.track] || 9);
          return (diff !== 0 ? diff : a.code.localeCompare(b.code)) * dir;
        }
        return a.code.localeCompare(b.code) * dir;
      });

      countEl.textContent = `${list.length} of ${DATA.examFormats.length} official IELTS task types`;

      if (list.length === 0) {
        wrapEl.innerHTML = `
          <div class="schedule-empty">
            <p class="t-lead">No official IELTS task type matches “${esc(state.talksFilter.query)}”.</p>
            <button type="button" class="btn-text t-small u-anim" id="talks-clear-btn">(Clear filters)</button>
          </div>
        `;
        document.getElementById("talks-clear-btn").addEventListener("click", () => {
          state.talksFilter.query = "";
          state.talksFilter.types = [];
          state.talksFilter.tracks = [];
          searchInput.value = "";
          typeBtns.forEach(b => b.setAttribute("aria-pressed", "false"));
          renderTable();
        });
        return;
      }

      const sortCap = col === "id" ? "code" : col === "title" ? "task type" : "exam order";
      const triSvg = activeCol => {
        if (state.talksFilter.sortCol !== activeCol) return "";
        const icon = state.talksFilter.sortDir === "asc" ? "tri-up" : "tri-down";
        return `<svg width="10" height="6" viewBox="0 0 5 3" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${
          icon === "tri-up"
            ? `<rect x="2" y="0" width="1" height="1"/><rect x="1" y="1" width="3" height="1"/><rect x="0" y="2" width="5" height="1"/>`
            : `<rect x="0" y="0" width="5" height="1"/><rect x="1" y="1" width="3" height="1"/><rect x="2" y="2" width="1" height="1"/>`
        }</svg>`;
      };
      const ariaSort = activeCol => state.talksFilter.sortCol !== activeCol ? "none" : (state.talksFilter.sortDir === "asc" ? "ascending" : "descending");

      wrapEl.innerHTML = `
        <table class="data-table responsive-table talks-table">
          <caption class="t-micro">Official IELTS task types, sorted by ${sortCap}</caption>
          <thead>
            <tr>
              <th class="t-micro" aria-sort="${ariaSort("id")}"><button type="button" class="sort-btn t-micro" data-sort="id">Code ${triSvg("id")}</button></th>
              <th class="t-micro" aria-sort="${ariaSort("title")}"><button type="button" class="sort-btn t-micro" data-sort="title">Official Task Type ${triSvg("title")}</button></th>
              <th class="t-micro" aria-sort="${ariaSort("day")}"><button type="button" class="sort-btn t-micro" data-sort="day">Skill ${triSvg("day")}</button></th>
              <th class="t-micro">Module</th>
              <th class="t-micro">Section &amp; Timing</th>
              <th class="t-micro">Scoring</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(item => {
              const tr = trackById(item.track);
              const isOpen = state.talksFilter.openId === item.id;
              return `
                <tr class="talk-row" id="talk-row-${esc(item.id)}" data-track="${esc(item.track)}">
                  <td data-label="Code" class="t-small tnum">${esc(item.code)}</td>
                  <td data-label="Official Task Type" class="t-small fw-600">
                    <button type="button" class="btn-text t-small fw-600 u-anim" data-disc="${esc(item.id)}" aria-expanded="${isOpen ? "true" : "false"}" aria-controls="expand-${esc(item.id)}">${highlightText(item.title, state.talksFilter.query)}</button>
                  </td>
                  <td data-label="Skill" class="t-small"><span class="track-chip track-chip-${esc(item.track)}">${esc(tr.label)}</span></td>
                  <td data-label="Module" class="t-small">${esc(item.module)}</td>
                  <td data-label="Section &amp; Timing" class="t-small tnum">${esc(item.section)}</td>
                  <td data-label="Scoring" class="t-small tnum">${esc(item.scoring)}</td>
                </tr>
                ${isOpen ? `
                  <tr class="talk-expand-row" id="expand-${esc(item.id)}">
                    <td colspan="6">
                      <p class="t-body">${highlightText(item.description, state.talksFilter.query)}</p>
                      <div class="exam-format-detail-grid">
                        <div>
                          <p class="t-micro">(What it tests)</p>
                          <p class="t-small" style="margin-top:6px;">${highlightText(item.tests, state.talksFilter.query)}</p>
                        </div>
                        <div>
                          <p class="t-micro">(Official exam rules &amp; traps)</p>
                          <p class="t-small" style="margin-top:6px;">${highlightText(item.rules, state.talksFilter.query)}</p>
                        </div>
                      </div>
                      <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;">
                        <a class="btn-text t-micro u-anim" href="#/schedule">(Rehearse in Study Plan)</a>
                        <a class="btn-text t-micro u-anim" href="#/workspace">(Inspect ${esc(tr.label)} workspace)</a>
                      </div>
                    </td>
                  </tr>
                ` : ""}
              `;
            }).join("")}
          </tbody>
        </table>
      `;

      wrapEl.querySelectorAll("[data-sort]").forEach(btn => {
        btn.addEventListener("click", () => {
          const c = btn.dataset.sort;
          if (state.talksFilter.sortCol === c) {
            state.talksFilter.sortDir = state.talksFilter.sortDir === "asc" ? "desc" : "asc";
          } else {
            state.talksFilter.sortCol = c;
            state.talksFilter.sortDir = "asc";
          }
          renderTable();
        });
      });

      wrapEl.querySelectorAll("[data-disc]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.disc;
          state.talksFilter.openId = state.talksFilter.openId === id ? null : id;
          renderTable();
          const newBtn = wrapEl.querySelector(`[data-disc="${id}"]`);
          if (newBtn) newBtn.focus();
        });
      });
    }

    ovCards.forEach(card => {
      card.addEventListener("click", () => {
        const tid = card.dataset.ovTrack;
        if (state.talksFilter.tracks.length === 1 && state.talksFilter.tracks[0] === tid) {
          state.talksFilter.tracks = [];
        } else {
          state.talksFilter.tracks = [tid];
        }
        renderTable();
      });
    });

    searchInput.addEventListener("input", () => {
      state.talksFilter.query = searchInput.value;
      renderTable();
    });

    typeBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tp = btn.dataset.type;
        const i = state.talksFilter.types.indexOf(tp);
        if (i === -1) state.talksFilter.types.push(tp);
        else state.talksFilter.types.splice(i, 1);
        btn.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        renderTable();
      });
    });

    trackBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tid = btn.dataset.track;
        const i = state.talksFilter.tracks.indexOf(tid);
        if (i === -1) state.talksFilter.tracks.push(tid);
        else state.talksFilter.tracks.splice(i, 1);
        renderTable();
      });
    });

    renderTable();

    if (resolvedId) {
      const targetRow = document.getElementById(`talk-row-${resolvedId}`);
      if (targetRow) {
        window.requestAnimationFrame(() => {
          const top = targetRow.getBoundingClientRect().top + window.scrollY - 120;
          window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
        });
      }
    }
  }

  // Route 6: Interactive Exam Workspace (#/workspace and #/workspace/<tab>?exam=...&section=...&test=...)
  function renderVenue(main, tabParam, queryOpts) {
    document.title = "Workspace" + DATA.copy.siteTitleSuffix;
    const mountInteractive = () => {
      if (window.IEAFL_WORKSPACE && typeof window.IEAFL_WORKSPACE.mount === "function") {
        window.IEAFL_WORKSPACE.mount(main, tabParam || "reading", queryOpts || undefined);
        state.routeCleanup.push(() => {
          if (window.IEAFL_WORKSPACE) window.IEAFL_WORKSPACE.unmount();
        });
        return true;
      }
      return false;
    };

    if (!mountInteractive()) {
      main.innerHTML = `
        <section class="sub-sec ws-shell" data-surface="paper" data-pager="Workspace">
          <div class="grid">
            <div class="col-full">
              <p class="t-micro">(Interactive IELTS Workspace)</p>
              <h1 class="t-h1" tabindex="-1" style="margin-top:6px;">Loading Workspace…</h1>
            </div>
          </div>
        </section>
      `;
      const onReady = () => {
        if (mountInteractive()) {
          window.removeEventListener("ieafl:cloud-update", onReady);
        }
      };
      window.addEventListener("ieafl:cloud-update", onReady);
      state.routeCleanup.push(() => window.removeEventListener("ieafl:cloud-update", onReady));
    }
  }
