<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ieafl — Multi-Exam English &amp; SAT Practice Platform</title>
<meta name="description" content="Self-study practice platform for IELTS, NEC (HSGQG Tiếng Anh), Digital SAT (R&amp;W + Math), HSG Tiếng Anh, and Olympic 30/4 Tiếng Anh HCM with rubric scoring and monthly band forecasting.">
<meta property="og:title" content="ieafl — Multi-Exam English &amp; SAT Practice Platform">
<meta property="og:description" content="Rehearse IELTS, NEC (HSGQG), Digital SAT, HSG Tiếng Anh, and Olympic 30/4 under real exam clocks with Google-synced monthly band forecasting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --sodium: #F3ACF0;
  --ink: #0A0A0A;
  --paper: #FFFFFF;
  --blue: #2370E8;
  --pink: #D873B3;
  --green: #2BA676;
  --lavender: #A98BF7;
  --coral: #FF5A5A;
  --mint: #22C98A;

  --s1: 4px;
  --s2: 8px;
  --s3: 16px;
  --s4: 24px;
  --s5: 32px;
  --s6: 48px;
  --s7: 64px;
  --s8: 96px;
  --s9: 128px;
  --s10: 160px;

  --cols: 4;
  --gutter: 10px;
  --margin: 16px;
  --sec-pad: 64px;
  --header-h: 56px;

  --bg: var(--sodium);
  --fg: var(--ink);
  --focus: var(--ink);
  --rule-color: var(--ink);
  --rule: 1px solid var(--rule-color);
  --rule-strong: 2px solid var(--rule-color);
  --poster-u: 10px;
  --hover-bg: #1b2b34;
  --tw-teal-1: #9BE2E2;
  --tw-teal-2: #79c2c4;
  --tw-teal-3: #5fb3b3;
  --tw-teal-4: #1A8384;
  --tw-spacing: 8px;
  --tw-spacing-sm: 6px;
  --tw-transition: .25s;
}

@media (min-width: 390px) {
  :root {
    --gutter: 12px;
  }
}

@media (min-width: 768px) {
  :root {
    --cols: 8;
    --gutter: 12px;
    --margin: 20px;
    --sec-pad: 80px;
    --header-h: 64px;
  }
}

@media (min-width: 1024px) {
  :root {
    --cols: 12;
    --gutter: 16px;
    --margin: 24px;
    --sec-pad: 96px;
  }
}

@media (min-width: 1440px) {
  :root {
    --margin: 28px;
    --sec-pad: 128px;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
  border-radius: 0;
}

html {
  font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  font-size: 16px;
  background-color: var(--sodium);
  color: var(--ink);
  scroll-padding-top: 80px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

@media (prefers-reduced-motion: no-preference) {
  html.motion-on {
    scroll-behavior: smooth;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

html.menu-open {
  overflow: hidden;
}

body {
  margin: 0;
  padding: 0;
  padding-top: var(--header-h);
  background-color: var(--bg);
  color: var(--fg);
  font-weight: 400;
  line-height: 1.45;
  overflow-wrap: break-word;
}

h1, h2, h3, h4, p, ul, ol, dl, dt, dd, figure, figcaption, blockquote {
  margin: 0;
  padding: 0;
}

ul, ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, select {
  font-family: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  border-radius: 0;
}

button {
  cursor: pointer;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

:focus:not(:focus-visible) {
  outline: none;
}

/* Surfaces */
[data-surface="sodium"] {
  --bg: var(--sodium);
  --fg: var(--ink);
  --focus: var(--ink);
  --rule-color: var(--ink);
  --rule: 1px solid var(--ink);
  --rule-strong: 2px solid var(--ink);
  background-color: var(--sodium);
  color: var(--ink);
}

[data-surface="paper"] {
  --bg: var(--paper);
  --fg: var(--ink);
  --focus: var(--ink);
  --rule-color: var(--ink);
  --rule: 1px solid var(--ink);
  --rule-strong: 2px solid var(--ink);
  background-color: var(--paper);
  color: var(--ink);
}

[data-surface="ink"] {
  --bg: var(--ink);
  --fg: var(--sodium);
  --focus: var(--sodium);
  --rule-color: var(--sodium);
  --rule: 1px solid var(--sodium);
  --rule-strong: 2px solid var(--sodium);
  background-color: var(--ink);
  color: var(--sodium);
}

/* Typography scale */
.t-micro {
  font-size: clamp(0.75rem, 0.72rem + 0.1vw, 0.8125rem);
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.t-small {
  font-size: clamp(0.875rem, 0.83rem + 0.2vw, 0.9375rem);
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -0.005em;
}

.t-body {
  font-size: clamp(1rem, 0.94rem + 0.25vw, 1.125rem);
  font-weight: 400;
  line-height: 1.45;
  letter-spacing: -0.005em;
  max-width: 62ch;
}

.t-lead {
  font-size: clamp(1.25rem, 0.95rem + 0.95vw, 1.625rem);
  font-weight: 500;
  line-height: 1.04;
  letter-spacing: -0.02em;
}

.t-h2 {
  font-size: clamp(1.625rem, 1rem + 2vw, 2.375rem);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.02em;
}

.t-h1 {
  font-size: clamp(2.5rem, 1.3rem + 3.8vw, 4.5rem);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.035em;
}

.tnum {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.t-paper {
  color: var(--paper);
}

.t-sodium {
  color: var(--sodium);
}

.t-ink {
  color: var(--ink);
}

.fw-600 {
  font-weight: 600;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Skip link */
.skip-link {
  position: fixed;
  top: 8px;
  left: var(--margin);
  z-index: 200;
  background-color: var(--ink);
  color: var(--sodium);
  padding: 0 var(--s3);
  height: 44px;
  display: inline-flex;
  align-items: center;
  font-size: 0.875rem;
  font-weight: 600;
  transform: translateY(-200%);
}

.skip-link:focus {
  transform: translateY(0);
  outline: 3px solid var(--sodium);
  outline-offset: 3px;
}

/* 12-col grid */
.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  column-gap: var(--gutter);
  padding-inline: var(--margin);
  width: 100%;
}

.sec {
  padding-block: var(--sec-pad);
}

.sub-sec {
  padding-top: var(--s6);
  padding-bottom: var(--sec-pad);
}

@media (min-width: 1024px) {
  .sub-sec {
    padding-top: var(--s7);
  }
}

.col-full { grid-column: 1 / -1; }
.col-1-3 { grid-column: 1 / -1; }
.col-1-4 { grid-column: 1 / -1; }
.col-1-5 { grid-column: 1 / -1; }
.col-1-6 { grid-column: 1 / -1; }
.col-1-8 { grid-column: 1 / -1; }
.col-5-8 { grid-column: 1 / -1; }
.col-5-12 { grid-column: 1 / -1; }
.col-7-12 { grid-column: 1 / -1; }
.col-8-12 { grid-column: 1 / -1; }
.col-9-12 { grid-column: 1 / -1; }

@media (min-width: 768px) {
  .col-1-3 { grid-column: 1 / 4; }
  .col-1-4 { grid-column: 1 / 5; }
  .col-1-5 { grid-column: 1 / 5; }
  .col-1-8 { grid-column: 1 / -1; }
  .col-5-8 { grid-column: 1 / 5; }
  .col-5-12 { grid-column: 1 / -1; }
  .col-7-12 { grid-column: 5 / 9; }
  .col-8-12 { grid-column: 1 / -1; }
  .col-9-12 { grid-column: 5 / 9; }
}

@media (min-width: 1024px) {
  .col-1-3 { grid-column: 1 / 4; }
  .col-1-4 { grid-column: 1 / 5; }
  .col-1-5 { grid-column: 1 / 6; }
  .col-1-6 { grid-column: 1 / 7; }
  .col-1-8 { grid-column: 1 / 9; }
  .col-5-8 { grid-column: 5 / 9; }
  .col-5-12 { grid-column: 5 / 13; }
  .col-7-12 { grid-column: 7 / 13; }
  .col-8-12 { grid-column: 8 / 13; }
  .col-9-12 { grid-column: 9 / 13; }
}

/* Header */
.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--header-h);
  z-index: 50;
  display: flex;
  align-items: center;
}

.header-grid {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
}

.logo-link {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  min-width: 24px;
  padding: 6px 0;
}

.logo-svg {
  display: block;
  width: 117px;
  height: 21.6px;
}

@media (min-width: 768px) {
  .logo-svg {
    width: 146.25px;
    height: 27px;
  }
}

.main-nav {
  display: none;
}

.header-actions-desktop {
  display: none;
}

.menu-btn-wrap {
  margin-left: auto;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.menu-btn {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--s2);
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
}

@media (min-width: 1024px) {
  .main-nav {
    display: flex;
    align-items: center;
    gap: clamp(12px, 1.8vw, 28px);
    margin-left: auto;
    margin-right: clamp(12px, 2vw, 32px);
    flex-wrap: nowrap;
    min-width: 0;
  }
  .header-actions-desktop {
    display: flex;
    align-items: center;
    gap: clamp(12px, 1.6vw, 24px);
    flex-shrink: 0;
    white-space: nowrap;
  }
  #auth-btn-desktop {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .menu-btn-wrap {
    display: none;
  }
}

.nav-link {
  position: relative;
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 6px 4px;
  white-space: nowrap;
}

.nav-link[aria-current="page"] {
  background-color: var(--ink);
  color: var(--sodium);
  padding: 2px 4px;
}

[data-surface="ink"] .nav-link[aria-current="page"] {
  background-color: var(--sodium);
  color: var(--ink);
}

/* Text buttons and animated underline */
.btn-text {
  position: relative;
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  min-width: 24px;
  padding: 4px 0;
  text-align: left;
}

.u-anim::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 1px;
  height: 1px;
  background-color: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
}

html.motion-on .u-anim:hover::after,
html.motion-on .u-anim:focus-visible::after {
  transform: scaleX(1);
  transition: transform 180ms steps(6);
}

html:not(.motion-on) .u-anim:hover::after,
html:not(.motion-on) .u-anim:focus-visible::after {
  transform: scaleX(1);
}

.nav-link[aria-current="page"]::after {
  display: none;
}

/* Primary button — Twitch isometric extrusion hover */
.btn-primary {
  --tw-s: var(--tw-spacing);
  --tw-shadow: var(--hover-bg);
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  padding: 0 12px;
  background-color: var(--ink);
  color: var(--sodium);
  font-weight: 600;
  overflow: visible;
  border: 0;
  white-space: nowrap;
  transform: translate(0, 0);
  box-shadow: 0 0 0 0 var(--tw-shadow);
}

.btn-primary.btn-sm {
  --tw-s: var(--tw-spacing-sm);
  height: 40px;
  padding: 0 10px;
}

[data-surface="ink"] .btn-primary {
  background-color: var(--sodium);
  color: var(--ink);
  --tw-shadow: var(--sodium);
}

.ws-pause-card .btn-primary,
.ws-stage-transition-card .btn-primary {
  --tw-shadow: var(--sodium);
}

.btn-primary::before,
.btn-primary::after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  border-style: solid;
  transform: scale(0);
  pointer-events: none;
  z-index: 1;
}

.btn-primary::before {
  border-width: 0 0 var(--tw-s) var(--tw-s);
  border-color: transparent transparent var(--tw-shadow) transparent;
  left: calc(-1 * var(--tw-s));
  top: 0;
  transform-origin: top right;
}

.btn-primary::after {
  border-width: var(--tw-s) var(--tw-s) 0 0;
  border-color: var(--tw-shadow) transparent transparent transparent;
  bottom: calc(-1 * var(--tw-s));
  right: 0;
  transform-origin: top right;
}

html.motion-on .btn-primary {
  transition: transform var(--tw-transition) cubic-bezier(0.16, 1, 0.3, 1),
              box-shadow var(--tw-transition) cubic-bezier(0.16, 1, 0.3, 1),
              background-color var(--tw-transition) ease,
              color var(--tw-transition) ease;
}

html.motion-on .btn-primary::before,
html.motion-on .btn-primary::after {
  transition: transform var(--tw-transition) cubic-bezier(0.16, 1, 0.3, 1);
}

.btn-primary > span {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px 10px;
  line-height: 1.1;
  background-color: transparent;
}

.btn-primary.btn-sm > span {
  padding: 4px 8px;
}

html.motion-on .btn-primary > span {
  transition: background-color var(--tw-transition) ease,
              color var(--tw-transition) ease;
}

.btn-primary:not([aria-disabled="true"]):not(:disabled):hover,
.btn-primary:not([aria-disabled="true"]):not(:disabled):focus-visible {
  z-index: 5;
  background-color: var(--tw-teal-4);
  background-image: linear-gradient(
    to right,
    var(--tw-teal-1),
    25%,
    var(--tw-teal-2) 0,
    50%,
    var(--tw-teal-3) 0,
    75%,
    var(--tw-teal-4) 0
  );
  color: var(--tw-teal-1);
  transform: translate(var(--tw-s), calc(-1 * var(--tw-s)));
  box-shadow: calc(-1 * var(--tw-s)) var(--tw-s) 0 0 var(--tw-shadow);
}

.btn-primary:not([aria-disabled="true"]):not(:disabled):hover::before,
.btn-primary:not([aria-disabled="true"]):not(:disabled):hover::after,
.btn-primary:not([aria-disabled="true"]):not(:disabled):focus-visible::before,
.btn-primary:not([aria-disabled="true"]):not(:disabled):focus-visible::after {
  transform: scale(1);
}

.btn-primary:not([aria-disabled="true"]):not(:disabled):hover > span,
.btn-primary:not([aria-disabled="true"]):not(:disabled):focus-visible > span {
  background-color: var(--hover-bg);
  color: var(--tw-teal-1);
}

.btn-primary:not([aria-disabled="true"]):not(:disabled):active {
  transform: translate(calc(var(--tw-s) * 0.5), calc(-0.5 * var(--tw-s)));
  box-shadow: calc(-0.5 * var(--tw-s)) calc(0.5 * var(--tw-s)) 0 0 var(--tw-shadow);
}

.btn-primary:not([aria-disabled="true"]):not(:disabled):active::before,
.btn-primary:not([aria-disabled="true"]):not(:disabled):active::after {
  transform: scale(0.5);
}

.btn-primary[aria-disabled="true"],
.btn-primary:disabled,
.btn-stepper[aria-disabled="true"] {
  background-color: transparent;
  background-image: none;
  color: var(--ink);
  border: 1px solid var(--ink);
  cursor: not-allowed;
  opacity: 0.65;
  transform: none;
  box-shadow: none;
}

.btn-primary[aria-disabled="true"]::before,
.btn-primary[aria-disabled="true"]::after,
.btn-primary:disabled::before,
.btn-primary:disabled::after {
  display: none;
}

[data-surface="ink"] .btn-primary[aria-disabled="true"],
[data-surface="ink"] .btn-primary:disabled {
  color: var(--sodium);
  border-color: var(--sodium);
}

.btn-strike {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* Toggle chips */
.chip-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--ink);
  background-color: transparent;
  color: var(--ink);
  font-weight: 500;
  white-space: nowrap;
}

[data-surface="ink"] .chip-toggle {
  border-color: var(--sodium);
  color: var(--sodium);
}

@media (pointer: coarse) {
  .chip-toggle, .btn-text, .nav-link, .menu-btn, .pager-btn {
    min-height: 44px;
    min-width: 44px;
  }
  .chip-toggle {
    height: 44px;
  }
}

.chip-toggle[aria-pressed="true"] {
  background-color: var(--ink);
  color: var(--paper);
}

[data-surface="sodium"] .chip-toggle[aria-pressed="true"] {
  color: var(--sodium);
}

[data-surface="ink"] .chip-toggle[aria-pressed="true"] {
  background-color: var(--sodium);
  color: var(--ink);
}

.chip-toggle[data-track="reading"][aria-pressed="true"] {
  background-color: var(--pink);
  color: var(--ink);
  border-color: var(--ink);
}

.chip-toggle[data-track="listening"][aria-pressed="true"] {
  background-color: var(--green);
  color: var(--ink);
  border-color: var(--ink);
}

.chip-toggle[data-track="writing"][aria-pressed="true"] {
  background-color: var(--lavender);
  color: var(--ink);
  border-color: var(--ink);
}

.chip-toggle[data-track="speaking"][aria-pressed="true"] {
  background-color: var(--blue);
  color: var(--paper);
  border-color: var(--ink);
}

.seg-group {
  display: inline-flex;
}

.seg-group > .chip-toggle + .chip-toggle {
  margin-left: -1px;
}

/* Track chips (static badges) */
.track-chip {
  display: inline-block;
  padding: 1px 6px;
  font-weight: 600;
  vertical-align: baseline;
}

.track-chip-reading { background-color: var(--pink); color: var(--ink); }
.track-chip-listening { background-color: var(--green); color: var(--ink); }
.track-chip-writing { background-color: var(--lavender); color: var(--ink); }
.track-chip-speaking { background-color: var(--blue); color: var(--paper); }

.clash-chip {
  display: inline-block;
  padding: 2px 6px;
  background-color: var(--coral);
  color: var(--ink);
  font-weight: 600;
}

/* Mobile menu overlay */
.menu-overlay {
  position: fixed;
  inset: 0;
  z-index: 90;
  background-color: var(--sodium);
  color: var(--ink);
  display: none;
  flex-direction: column;
  padding-bottom: var(--s6);
  overflow-y: auto;
}

.menu-overlay.is-open {
  display: flex;
}

.menu-overlay-top {
  height: var(--header-h);
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.menu-overlay-links {
  margin-top: var(--s5);
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}

.menu-overlay-links a {
  display: inline-block;
  padding: var(--s1) 0;
  align-self: flex-start;
}

.menu-overlay-links a[aria-current="page"] {
  background-color: var(--ink);
  color: var(--sodium);
  padding: var(--s1) var(--s2);
}

.menu-overlay-footer {
  margin-top: auto;
  padding-top: var(--s6);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s4);
}

/* Global pixel overlays */
#trail-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 30;
}

#wipe-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 120;
  display: none;
}

#wipe-canvas.is-active {
  display: block;
}

/* Shared tooltip */
#tip {
  position: fixed;
  z-index: 100;
  background-color: var(--paper);
  color: var(--ink);
  border: 1px solid var(--ink);
  padding: 4px 8px;
  pointer-events: none;
  display: none;
  max-width: 260px;
}

#tip.is-visible {
  display: block;
}

/* Section pager & top button */
.pager-wrap {
  position: fixed;
  left: var(--margin);
  bottom: var(--s3);
  z-index: 40;
}

.pager-wrap.is-hidden {
  display: none;
}

.pager-btn {
  padding: 4px 6px;
  background-color: transparent;
  border: 1px solid transparent;
  min-height: 24px;
  min-width: 24px;
}

.pager-wrap[data-surface="ink"] {
  color: var(--sodium);
  --focus: var(--sodium);
}

.pager-wrap[data-surface="sodium"],
.pager-wrap[data-surface="paper"] {
  color: var(--ink);
  --focus: var(--ink);
}

.pager-popover {
  position: absolute;
  left: 0;
  bottom: calc(100% + 8px);
  background-color: var(--paper);
  color: var(--ink);
  border: 1px solid var(--ink);
  padding: var(--s2);
  min-width: 200px;
  display: none;
}

.pager-popover.is-open {
  display: block;
}

.pager-popover button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 6px 8px;
  min-height: 32px;
}

.pager-popover button:hover,
.pager-popover button[aria-current="true"] {
  background-color: var(--ink);
  color: var(--sodium);
}

.top-btn {
  position: fixed;
  right: var(--margin);
  bottom: var(--s3);
  z-index: 40;
  padding: 4px 6px;
  display: none;
  min-height: 24px;
  min-width: 24px;
}

.top-btn.is-visible {
  display: inline-flex;
  align-items: center;
}

.top-btn[data-surface="ink"] {
  color: var(--sodium);
  --focus: var(--sodium);
}

.top-btn[data-surface="sodium"],
.top-btn[data-surface="paper"] {
  color: var(--ink);
  --focus: var(--ink);
}

/* Reveal animations */
@keyframes revealTextClip {
  from { clip-path: inset(0 100% 0 0); }
  to { clip-path: inset(0 0 0 0); }
}

.reveal-text.is-pending {
  opacity: 0;
}

.reveal-text.is-shown {
  opacity: 1;
  animation: revealTextClip 320ms steps(8) both;
}

.reveal-block.is-pending {
  opacity: 0;
  transform: translateY(8px);
}

.reveal-block.is-shown {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 240ms steps(4), transform 240ms steps(4);
}

@media (min-width: 768px) {

  .hero-top-about { grid-column: 4 / 6; }

@media (min-width: 1024px) {

.hero-canvas {

.hero-caption {

@media (min-width: 1024px) {

.split-line {

@media (min-width: 768px) {

#tracks-grid .track-card-desc {

@media (min-width: 1024px) {

.roadmap-canvas-wrap {
  position: relative;
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: var(--s2);
  border-bottom: var(--rule);
  margin-bottom: var(--s3);
}

.roadmap-svg {
  display: block;
  width: 100%;
  min-width: 640px;
  height: auto;
}

.roadmap-grid-line {
  stroke: rgba(10, 10, 10, 0.14);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}

.roadmap-grid-label {
  fill: var(--ink);
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.roadmap-path-bg {
  fill: none;
  stroke: rgba(10, 10, 10, 0.22);
  stroke-width: 3;
  stroke-dasharray: 6 6;
}

.roadmap-path-active {
  fill: none;
  stroke: var(--ink);
  stroke-width: 4;
  transition: stroke-dashoffset 420ms cubic-bezier(0.16, 1, 0.3, 1);
}

.roadmap-path-pulse {
  fill: none;
  stroke: var(--sodium);
  stroke-width: 2;
  stroke-dasharray: 10 22;
  animation: roadmapFlow 1.6s linear infinite;
}

@keyframes roadmapFlow {
  from { stroke-dashoffset: 32; }
  to { stroke-dashoffset: 0; }
}

.roadmap-svg-node {
  cursor: pointer;
}

.roadmap-node-ring {
  transform-box: fill-box;
  transform-origin: center;
  animation: roadmapPing 1.9s cubic-bezier(0.16, 1, 0.3, 1) infinite;
}

@keyframes roadmapPing {
  0% { transform: scale(1); opacity: 0.9; }
  75% { transform: scale(1.7); opacity: 0; }
  100% { transform: scale(1.7); opacity: 0; }
}

html:not(.motion-on) .roadmap-path-pulse,
html:not(.motion-on) .roadmap-node-ring {
  animation: none;
}

.roadmap-nodes-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s2);
}

@media (min-width: 640px) {
  .roadmap-nodes-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .roadmap-nodes-grid {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
}

.roadmap-node-btn {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
  min-height: 112px;
  padding: 12px;
  border: 1px solid var(--ink);
  background-color: var(--paper);
  color: var(--ink);
  gap: 8px;
  transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), background-color 140ms ease, color 140ms ease, opacity 160ms ease;
}

.roadmap-node-btn:hover {
  transform: translateY(-2px);
  background-color: var(--sodium);
}

.roadmap-node-btn[aria-selected="true"] {
  background-color: var(--ink);
  color: var(--paper);
  transform: translateY(-2px);
}

.roadmap-node-btn.is-complete:not([aria-selected="true"]) {
  background-color: #EBFAF3;
}

.roadmap-node-btn.is-dimmed {
  opacity: 0.45;
}

.roadmap-node-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.roadmap-skill-bar {
  display: flex;
  gap: 3px;
  margin-top: 2px;
}

.roadmap-skill-pip {
  width: 12px;
  height: 4px;
  border: 1px solid currentColor;
}

.roadmap-detail {
  margin-top: var(--s4);
  border-top: var(--rule-strong);
  padding-top: var(--s4);
}

.roadmap-detail.is-entering {
  animation: roadmapPanelIn 180ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

.roadmap-detail.is-entering .roadmap-step-card {
  animation: roadmapPanelIn 200ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes roadmapPanelIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

html:not(.motion-on) .roadmap-detail,
html:not(.motion-on) .roadmap-detail .roadmap-step-card {
  animation: none;
}

.roadmap-detail-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s3);
  padding-bottom: var(--s3);
  border-bottom: var(--rule);
}

.roadmap-detail-title-wrap {
  max-width: 66ch;
}

.roadmap-detail-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
}

.roadmap-steps-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s3);
  margin-top: var(--s3);
}

@media (min-width: 768px) {
  .roadmap-steps-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.roadmap-step-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  padding: var(--s3);
  border: 1px solid var(--ink);
  background-color: var(--paper);
  color: var(--ink);
  transition: opacity 160ms ease, background-color 140ms ease;
}

.roadmap-step-card.is-done {
  background-color: #F3FDF8;
}

.roadmap-step-card.is-dimmed {
  opacity: 0.4;
}

.roadmap-step-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s2);
}

.roadmap-step-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}

.roadmap-step-icon {
  display: block;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.roadmap-step-check {
  width: 36px;
  height: 36px;
  min-width: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--ink);
  background-color: var(--paper);
  color: var(--ink);
  flex-shrink: 0;
  transition: background-color 140ms ease;
}

.roadmap-step-check:hover {
  background-color: var(--sodium);
}

.roadmap-step-check[aria-pressed="true"] {
  background-color: var(--mint);
  color: var(--ink);
}

.roadmap-step-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  padding-top: 8px;
  border-top: 1px solid rgba(10, 10, 10, 0.2);
}

.roadmap-progress-bar {
  width: 100%;
  height: 8px;
  border: 1px solid var(--ink);
  background-color: var(--paper);
  margin-top: var(--s3);
  overflow: hidden;
}

.roadmap-progress-fill {
  height: 100%;
  background-color: var(--mint);
  transition: transform 280ms cubic-bezier(0.16, 1, 0.3, 1);
  transform-origin: left center;
}

/* Tables */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: var(--s4);
}

.data-table caption {
  text-align: left;
  padding-bottom: var(--s2);
}

.data-table th {
  text-align: left;
  padding: 12px 8px;
  border-bottom: var(--rule-strong);
  font-weight: 600;
  vertical-align: bottom;
}

.data-table td {
  padding: 12px 8px;
  border-bottom: var(--rule);
  vertical-align: top;
}

.data-table th.num, .data-table td.num {
  text-align: right;
}

.talk-row:hover td {
  background-color: var(--hover-bg, transparent);
  color: var(--hover-fg, var(--ink));
}

.talk-row[data-track="reading"]:hover td { --hover-bg: var(--pink); --hover-fg: var(--ink); }
.talk-row[data-track="listening"]:hover td { --hover-bg: var(--green); --hover-fg: var(--ink); }
.talk-row[data-track="writing"]:hover td { --hover-bg: var(--lavender); --hover-fg: var(--ink); }
.talk-row[data-track="speaking"]:hover td { --hover-bg: var(--blue); --hover-fg: var(--paper); }

.talk-expand-row td {
  padding: var(--s4) var(--s3);
  border-bottom: var(--rule-strong);
  background-color: var(--paper);
}

@media (max-width: 1023px) and (min-width: 768px) {
  .talks-table .col-speakers {
    display: none;
  }
}

@media (max-width: 767px) {
  .responsive-table,
  .responsive-table tbody,
  .responsive-table tr,
  .responsive-table td {
    display: block;
    width: 100%;
  }
  .responsive-table thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .responsive-table tr {
    border-bottom: var(--rule-strong);
    padding-block: var(--s2);
  }
  .responsive-table td {
    border-bottom: 0;
    padding: 6px 0;
  }
  .responsive-table td::before {
    content: attr(data-label);
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .responsive-table td.num {
    text-align: left;
  }
}

.sort-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  font-weight: 600;
}

.talks-controls {
  margin-top: var(--s5);
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}

.talks-search-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--s3);
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: var(--s1);
}

.text-input, .select-input {
  height: 44px;
  padding: 0 12px;
  border: 1px solid var(--ink);
  background-color: var(--paper);
  color: var(--ink);
  font-size: 1rem;
}

[data-surface="ink"] .text-input {
  border-color: var(--sodium);
  background-color: var(--ink);
  color: var(--sodium);
}

mark {
  background-color: var(--sodium);
  color: var(--ink);
  font-weight: 600;
  padding: 0 2px;
}

/* Official IELTS Exam Overview Grid (#/formats) */
.exam-overview-grid {
  margin-top: var(--s6);
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s3);
}

@media (min-width: 768px) {
  .exam-overview-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1200px) {
  .exam-overview-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

.exam-overview-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
  padding: var(--s4);
  border: var(--rule-strong);
  background-color: var(--paper);
  color: var(--ink);
  gap: var(--s3);
  transition: background-color 140ms ease, color 140ms ease;
}

.exam-overview-card:hover {
  background-color: var(--sodium);
}

.exam-overview-card[aria-pressed="true"] {
  background-color: var(--ink);
  color: var(--paper);
}

.exam-overview-card[aria-pressed="true"] .exam-overview-parts li::before {
  background-color: var(--sodium);
}

.exam-overview-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
}

.exam-overview-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.exam-overview-icon {
  display: block;
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.exam-overview-meta {
  padding-top: var(--s2);
  border-top: 1px solid currentColor;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.exam-overview-parts {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.exam-overview-parts li {
  padding-left: 12px;
  position: relative;
}

.exam-overview-parts li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.55em;
  width: 5px;
  height: 5px;
  background-color: var(--ink);
}

.exam-format-detail-grid {
  margin-top: var(--s3);
  padding-top: var(--s3);
  border-top: var(--rule);
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s3);
}

@media (min-width: 768px) {
  .exam-format-detail-grid {
    grid-template-columns: 1fr 1fr;
  }
}

/* Speaker detail */
.scrubber-wrap {
  margin-top: var(--s3);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}

.scrubber-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.scrubber-input {
  width: 100%;
  accent-color: var(--ink);
  height: 32px;
}

.speaker-sessions-list {
  margin-top: var(--s5);
  border-top: var(--rule);
}

.speaker-session-item {
  padding-block: var(--s4);
  border-bottom: var(--rule);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}

.speaker-prev-next {
  margin-top: var(--s7);
  padding-top: var(--s4);
  border-top: var(--rule);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: var(--s3);
}

/* Venue */
.venue-grid {
  margin-top: var(--s6);
  row-gap: var(--s5);
}

.venue-svg {
  display: block;
  width: 100%;
  height: auto;
}

.venue-room-shape {
  cursor: pointer;
}

.venue-room-list {
  display: flex;
  flex-direction: column;
  border-top: var(--rule);
}

.venue-room-btn {
  width: 100%;
  text-align: left;
  padding: 12px 8px;
  border-bottom: var(--rule);
  min-height: 44px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--s2);
}

.venue-room-btn[aria-pressed="true"] {
  background-color: var(--ink);
  color: var(--sodium);
}

.venue-details {
  margin-top: var(--s4);
  padding: var(--s3);
  border: var(--rule);
}

.venue-info-cols {
  margin-top: var(--s7);
  row-gap: var(--s5);
}

.access-list {
  margin-top: var(--s3);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}

.access-list li {
  padding-left: var(--s3);
  position: relative;
}

.access-list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.55em;
  width: 6px;
  height: 6px;
  background-color: var(--ink);
}

/* Passes */
.tier-list {
  margin-top: var(--s6);
  border-bottom: var(--rule);
}

.tier-row {
  border-top: var(--rule);
  padding-block: var(--s4);
  align-items: center;
  row-gap: var(--s3);
}

.tier-name-col { grid-column: 1 / -1; }
.tier-inc-col { grid-column: 1 / -1; }
.tier-price-col { grid-column: 1 / 3; }
.tier-step-col { grid-column: 3 / 5; justify-self: end; }

@media (min-width: 768px) and (max-width: 1023px) {
  .tier-name-col { grid-column: 1 / 6; }
  .tier-price-col { grid-column: 6 / 9; text-align: right; }
  .tier-inc-col { grid-column: 1 / 9; }
  .tier-step-col { grid-column: 1 / 9; justify-self: start; }
}

@media (min-width: 1024px) {
  .tier-name-col { grid-column: 1 / 5; }
  .tier-inc-col { grid-column: 5 / 9; }
  .tier-price-col { grid-column: 9 / 11; text-align: right; }
  .tier-step-col { grid-column: 11 / 13; justify-self: end; }
}

.stepper {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
}

.btn-stepper {
  position: relative;
  width: 44px;
  height: 44px;
  border: 1px solid var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: transparent;
}

.stepper-val {
  min-width: 24px;
  text-align: center;
  font-weight: 600;
}

.day-select-wrap {
  margin-top: var(--s3);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
}

.error-chip {
  background-color: var(--coral);
  color: var(--ink);
  padding: 4px 8px;
  font-weight: 600;
}

.passes-total-row {
  margin-top: var(--s5);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
}

.faq-sec {
  margin-top: var(--s8);
}

.faq-list {
  margin-top: var(--s4);
  border-bottom: var(--rule);
}

.faq-item {
  border-top: var(--rule);
}

.faq-summary {
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  cursor: pointer;
  list-style: none;
  padding-block: var(--s3);
}

.faq-summary::-webkit-details-marker {
  display: none;
}

.faq-icon-minus {
  display: none;
}

details[open] .faq-icon-plus {
  display: none;
}

details[open] .faq-icon-minus {
  display: block;
}

.faq-answer {
  padding-bottom: var(--s4);
}

/* Native dialog */
dialog.raster-dialog {
  background-color: var(--paper);
  color: var(--ink);
  border: 2px solid var(--ink);
  padding: var(--s5);
  max-width: 520px;
  width: calc(100% - 32px);
}

dialog.raster-dialog::backdrop {
  background-color: var(--ink);
  opacity: 0.85;
}

/* Badge maker */
.badge-layout {
  margin-top: var(--s5);
  row-gap: var(--s5);
}

.badge-editor-canvas {
  display: block;
  width: 100%;
  max-width: 640px;
  aspect-ratio: 1 / 1;
  cursor: crosshair;
  touch-action: none;
  border: 1px solid var(--sodium);
}

.badge-status {
  margin-top: var(--s2);
  min-height: 20px;
}

.palette-group {
  margin-top: var(--s4);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}

.palette-swatch {
  width: 44px;
  height: 44px;
  border: 1px solid var(--sodium);
  position: relative;
}

.palette-swatch[aria-checked="true"] {
  outline: 3px solid var(--sodium);
  outline-offset: 2px;
}

.badge-tools {
  margin-top: var(--s4);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}

.badge-preview-svg {
  display: block;
  width: 100%;
  max-width: 480px;
  height: auto;
  aspect-ratio: 2 / 3;
  border: 1px solid var(--sodium);
}

.badge-name-field {
  margin-top: var(--s4);
  max-width: 480px;
}

.badge-dl-wrap {
  margin-top: var(--s4);
}

/* Footer */
.site-footer {
  padding-top: var(--s8);
}

.footer-logo-svg {
  display: block;
  width: 100%;
  height: auto;
}

.footer-cols {
  margin-top: var(--s6);
  row-gap: var(--s5);
}

.footer-block {
  grid-column: 1 / -1;
}

@media (min-width: 768px) {
  .footer-block {
    grid-column: span 4;
  }
}

@media (min-width: 1024px) {
  .footer-block {
    grid-column: span 3;
  }
}

.footer-block-head {
  margin-bottom: var(--s2);
}

.footer-nav-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.footer-bottom {
  margin-top: var(--s7);
  padding-bottom: var(--s5);
  row-gap: var(--s3);
  align-items: end;
}

.footer-honesty {
  grid-column: 1 / -1;
}

.footer-ver {
  grid-column: 1 / -1;
}

@media (min-width: 1024px) {
  .footer-honesty {
    grid-column: 1 / 9;
  }
  .footer-ver {
    grid-column: 10 / 13;
    text-align: right;
  }
}

.footer-staircase {
  display: block;
  width: 100%;
  height: 8px;
}

/* 404 */
.notfound-bitmap {
  display: block;
  max-width: 100%;
  height: auto;
  margin-bottom: var(--s5);
}

/* Interactive IELTS Workspace & Google Auth */
.ws-shell {
  padding-top: var(--s5);
}

.ws-top-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--s3);
}

.ws-auth-bar {
  margin-top: var(--s4);
  padding: 14px var(--s3);
  border: var(--rule-strong);
  background-color: var(--sodium);
  color: var(--ink);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
}

.ws-auth-bar.is-signed-in {
  background-color: #EBFAF3;
}

.ws-auth-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.ws-auth-right {
  display: flex;
  align-items: center;
  gap: var(--s2);
}

.ws-avatar {
  width: 38px;
  height: 38px;
  border: 2px solid var(--ink);
  object-fit: cover;
  display: block;
  flex-shrink: 0;
}

.ws-avatar-fallback {
  width: 38px;
  height: 38px;
  border: 2px solid var(--ink);
  background-color: var(--paper);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.ws-google-btn {
  --tw-s: var(--tw-spacing);
  --tw-shadow: var(--hover-bg);
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 12px;
  border: 0;
  background-color: var(--paper);
  color: var(--ink);
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  overflow: visible;
  transform: translate(0, 0);
  box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 0 var(--tw-shadow);
}

.ws-google-btn::before,
.ws-google-btn::after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  border-style: solid;
  transform: scale(0);
  pointer-events: none;
  z-index: 1;
}

.ws-google-btn::before {
  border-width: 0 0 var(--tw-s) var(--tw-s);
  border-color: transparent transparent var(--tw-shadow) transparent;
  left: calc(-1 * var(--tw-s));
  top: 0;
  transform-origin: top right;
}

.ws-google-btn::after {
  border-width: var(--tw-s) var(--tw-s) 0 0;
  border-color: var(--tw-shadow) transparent transparent transparent;
  bottom: calc(-1 * var(--tw-s));
  right: 0;
  transform-origin: top right;
}

html.motion-on .ws-google-btn {
  transition: transform var(--tw-transition) cubic-bezier(0.16, 1, 0.3, 1),
              box-shadow var(--tw-transition) cubic-bezier(0.16, 1, 0.3, 1),
              background-color var(--tw-transition) ease,
              color var(--tw-transition) ease;
}

html.motion-on .ws-google-btn::before,
html.motion-on .ws-google-btn::after {
  transition: transform var(--tw-transition) cubic-bezier(0.16, 1, 0.3, 1);
}

.ws-google-btn > svg {
  position: relative;
  z-index: 2;
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  padding: 2px;
  background-color: var(--paper);
}

.ws-google-btn > span {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  line-height: 1.1;
  background-color: transparent;
}

html.motion-on .ws-google-btn > span {
  transition: background-color var(--tw-transition) ease,
              color var(--tw-transition) ease;
}

.ws-google-btn:hover:not(:disabled),
.ws-google-btn:focus-visible:not(:disabled) {
  z-index: 5;
  background-color: var(--tw-teal-4);
  background-image: linear-gradient(
    to right,
    var(--tw-teal-1),
    25%,
    var(--tw-teal-2) 0,
    50%,
    var(--tw-teal-3) 0,
    75%,
    var(--tw-teal-4) 0
  );
  color: var(--tw-teal-1);
  transform: translate(var(--tw-s), calc(-1 * var(--tw-s)));
  box-shadow: inset 0 0 0 2px var(--tw-shadow), calc(-1 * var(--tw-s)) var(--tw-s) 0 0 var(--tw-shadow);
}

.ws-google-btn:hover:not(:disabled)::before,
.ws-google-btn:hover:not(:disabled)::after,
.ws-google-btn:focus-visible:not(:disabled)::before,
.ws-google-btn:focus-visible:not(:disabled)::after {
  transform: scale(1);
}

.ws-google-btn:hover:not(:disabled) > span,
.ws-google-btn:focus-visible:not(:disabled) > span {
  background-color: var(--hover-bg);
  color: var(--tw-teal-1);
}

.ws-google-btn:active:not(:disabled) {
  transform: translate(calc(var(--tw-s) * 0.5), calc(-0.5 * var(--tw-s)));
  box-shadow: inset 0 0 0 2px var(--tw-shadow), calc(-0.5 * var(--tw-s)) calc(0.5 * var(--tw-s)) 0 0 var(--tw-shadow);
}

.ws-google-btn:active:not(:disabled)::before,
.ws-google-btn:active:not(:disabled)::after {
  transform: scale(0.5);
}

.ws-google-btn:disabled {
  opacity: 0.6;
  cursor: wait;
  transform: none;
  box-shadow: inset 0 0 0 2px var(--ink);
}

.ws-google-btn:disabled::before,
.ws-google-btn:disabled::after {
  display: none;
}

.ws-notice {

.ws-notice.is-ok {

}

.ws-notice.is-err {

}

.ws-tabs {

.ws-tab-btn {

.ws-tab-btn[aria-selected="true"] {

.ws-body {

.ws-toolbar {

.ws-toolbar-group {

.ws-hl-swatch.hl-yellow,

.ws-hl-swatch.hl-pink,

.ws-hl-swatch.hl-mint,
mark.ws-hl-mint {

.ws-hl-swatch[aria-pressed="true"] {

.ws-result-banner {

.ws-reading-split {

.ws-listening-grid {

  gap: var(--s3);

}

@media (min-width: 1024px) {

.ws-pane {

.ws-passage-body {

.ws-para-tag {

.ws-q-head {

.ws-questions-list {

.ws-q-card {

.ws-q-card.is-correct {

}

.ws-q-card.is-wrong {

}

.ws-q-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
}

.ws-options {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.ws-opt-row {
  display: flex;
  align-items: center;

  gap: 8px;
}

.ws-opt-row.is-crossed .ws-opt-label span {

.ws-opt-label {

.ws-opt-label input {

.ws-strike-btn {

}

.ws-solution-box {

.ws-palette {

.ws-palette-nums {

.ws-pal-btn {

.ws-pal-btn.is-answered {

.ws-pal-btn.is-flagged {

.ws-pal-btn.is-correct {

}

.ws-pal-btn.is-wrong {

}

.ws-pal-btn.is-current {

/* Listening Deck */
.ws-audio-deck {
  margin-top: var(--s3);

}

.ws-audio-top {

  align-items: flex-start;

.ws-audio-bar-wrap {

}

.ws-audio-meta {

.ws-transcript-list {

.ws-cue-row {
  padding: 8px;

}

.ws-cue-row.is-live {

.ws-locked-transcript {

.ws-chart-legend span {

}

.ws-chart-legend i {

}

.ws-textarea {
  width: 100%;
  margin-top: var(--s3);
  padding: 12px;

.ws-rubric-panel {
  margin-top: var(--s4);

.ws-rubric-head {

.ws-rubric-grid {

  gap: var(--s2);
}

@media (min-width: 768px) {

  }
}

.ws-rubric-cell {

}

/* Speaking Examiner */
.ws-examiner-stage {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3);
  border: var(--rule-strong);
  background-color: var(--sodium);
}

.ws-examiner-avatar {
  width: 84px;
  height: 84px;
  border: 2px solid var(--ink);
  flex-shrink: 0;
  display: block;
}

.ws-examiner-stage.is-talking .ws-mouth {
  transform-box: fill-box;
  transform-origin: center;
  animation: wsLipSync 220ms steps(2, end) infinite;
}

.ws-examiner-stage .ws-eye {
  transform-box: fill-box;
  transform-origin: center;
  animation: wsBlink 4.2s infinite;
}

@keyframes wsLipSync {
  0% { transform: scaleY(0.45); }
  50% { transform: scaleY(1.25); }
  100% { transform: scaleY(0.6); }
}

@keyframes wsBlink {
  0%, 94%, 100% { transform: scaleY(1); }
  97% { transform: scaleY(0.15); }
}

html:not(.motion-on) .ws-examiner-stage .ws-mouth,
html:not(.motion-on) .ws-examiner-stage .ws-eye {
  animation: none;
}

.ws-examiner-prompt-card {
  margin-top: var(--s3);
  padding: var(--s3);
  border: 1px solid var(--ink);
}

.ws-cue-card {
  margin-top: var(--s3);
  padding: var(--s3);
  border: 1px solid var(--ink);
  background-color: #FFFDF0;
}

.ws-turn-pills {

  flex-wrap: wrap;

  }
}

.ws-kpi-card {

  border: var(--rule-strong);
  background-color: var(--paper);

  flex-direction: column;
}

.ws-skill-bars {

  gap: 14px;
}

.ws-skill-bar-head {

}

.ws-bar-track {

.ws-form-grid {

/* Inline Pixel Brand Wordmark */

}
.inline-logo-svg {
  display: inline-block;
  height: 0.78em;
  width: auto;
  vertical-align: -0.05em;
  flex-shrink: 0;
}

/* Hero Exam Cards Deck */
.hero-exam-deck {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 10px;
  margin-top: var(--s4);

}
.hero-exam-card:hover,
.hero-exam-card:focus-visible {

  box-shadow: 4px 4px 0 var(--ink);
  outline: none;
}
.hero-exam-card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
}
.hero-exam-scale {
  font-size: 0.6875rem;
  font-weight: 700;
  padding: 1px 5px;
  background-color: var(--ink);
  color: var(--paper);
  white-space: nowrap;
}
.hero-exam-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}
.hero-exam-tag {
  font-size: 0.6875rem;
  font-weight: 600;
  padding: 1px 5px;
  border: 1px solid var(--ink);
  background-color: rgba(10, 10, 10, 0.04);
  line-height: 1.3;
}
.hero-exam-tag.is-absent {
  border-style: dashed;
  opacity: 0.72;
  text-decoration: line-through;
}
.hero-exam-tag.is-accent {
  background-color: var(--exam-accent, var(--sodium));
  color: var(--ink);
}

/* Hero Subtext Keyword Highlights */
.hero-kw {
  display: inline-block;
  padding: 0 6px;
  font-weight: 700;
  border: 1.5px solid var(--ink);
  line-height: 1.25;
  color: var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
}
.hero-kw-pink { background-color: #FFFFFF; border-color: var(--ink); }
.hero-kw-green { background-color: #2BA676; color: #0A0A0A; }
.hero-kw-lavender { background-color: #A98BF7; color: #0A0A0A; }
.hero-kw-blue { background-color: #2370E8; color: #FFFFFF; }
.hero-kw-ink { background-color: #0A0A0A; color: #F3ACF0; }
.hero-kw-coral { background-color: #FF5A5A; color: #0A0A0A; }

/* Multi-Exam Module Matrix */
.exam-matrix-wrap {
  grid-column: 1 / -1;
  margin-top: var(--s5);
  overflow-x: auto;
  border: 1.5px solid var(--sodium);
}
[data-surface="paper"] .exam-matrix-wrap {
  border-color: var(--ink);
}
.exam-matrix-table {

.exam-matrix-table th,
.exam-matrix-table td {

.matrix-badge-yes { background-color: #2BA676; color: #0A0A0A; border-color: #0A0A0A; }
.matrix-badge-special { background-color: #A98BF7; color: #0A0A0A; border-color: #0A0A0A; }
.matrix-badge-math { background-color: #2370E8; color: #FFFFFF; border-color: #0A0A0A; }
.matrix-badge-no { opacity: 0.55; border-style: dashed; }

/* User Profile & Monthly Band Forecast Dashboard */
.profile-grid {
  display: grid;

/* ===== Global IEAFL Gemini Study Agent + Right-Click Selection Menu ===== */
.agent-pixel-icon {
  display: block;
  flex-shrink: 0;

}
.agent-fab {
  --tw-s: var(--tw-spacing-sm);
  --tw-shadow: var(--hover-bg);
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 950;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--ink);
  color: var(--sodium);
  border: 0;
  padding: 8px 12px 8px 10px;
  cursor: pointer;
  overflow: visible;
  transform: translate(0, 0);
  box-shadow: inset 0 0 0 1px var(--ink), 0 0 0 0 var(--tw-shadow);
}
.agent-fab::before,
.agent-fab::after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  border-style: solid;
  transform: scale(0);
  pointer-events: none;
  z-index: 1;
}
.agent-fab::before {
  border-width: 0 0 var(--tw-s) var(--tw-s);
  border-color: transparent transparent var(--tw-shadow) transparent;
  left: calc(-1 * var(--tw-s));
  top: 0;
  transform-origin: top right;
}
.agent-fab::after {
  border-width: var(--tw-s) var(--tw-s) 0 0;
  border-color: var(--tw-shadow) transparent transparent transparent;
  bottom: calc(-1 * var(--tw-s));
  right: 0;
  transform-origin: top right;
}
html.motion-on .agent-fab {
  transition: transform var(--tw-transition) cubic-bezier(0.16, 1, 0.3, 1),
              box-shadow var(--tw-transition) cubic-bezier(0.16, 1, 0.3, 1),
              background-color var(--tw-transition) ease,
              color var(--tw-transition) ease;
}
html.motion-on .agent-fab::before,
html.motion-on .agent-fab::after {
  transition: transform var(--tw-transition) cubic-bezier(0.16, 1, 0.3, 1);
}
.agent-fab:hover,
.agent-fab:focus-visible {
  background-color: var(--tw-teal-4);
  background-image: linear-gradient(
    to right,
    var(--tw-teal-1),
    25%,
    var(--tw-teal-2) 0,
    50%,
    var(--tw-teal-3) 0,
    75%,
    var(--tw-teal-4) 0
  );
  color: var(--tw-teal-1);
  transform: translate(var(--tw-s), calc(-1 * var(--tw-s)));
  box-shadow: inset 0 0 0 1px var(--tw-shadow), calc(-1 * var(--tw-s)) var(--tw-s) 0 0 var(--tw-shadow);
}
.agent-fab:hover::before,
.agent-fab:hover::after,
.agent-fab:focus-visible::before,
.agent-fab:focus-visible::after {
  transform: scale(1);
}
.agent-fab:active {
  transform: translate(calc(var(--tw-s) * 0.5), calc(-0.5 * var(--tw-s)));
  box-shadow: inset 0 0 0 1px var(--tw-shadow), calc(-0.5 * var(--tw-s)) calc(0.5 * var(--tw-s)) 0 0 var(--tw-shadow);
}
.agent-fab:active::before,
.agent-fab:active::after {
  transform: scale(0.5);
}

<script>
"use strict";

function buildModulePixelGrid(kind) {
  const g = Array.from({ length: 32 }, () => new Array(32).fill(0));
  const rect = (x, y, w, h, c) => {
    for (let yy = Math.max(0, y); yy < Math.min(32, y + h); yy++) {
      for (let xx = Math.max(0, x); xx < Math.min(32, x + w); xx++) {
        g[yy][xx] = c;
      }
    }
  };
  const frame = (x, y, w, h, c) => {
    rect(x, y, w, 1, c);
    rect(x, y + h - 1, w, 1, c);
    rect(x, y, 1, h, c);
    rect(x + w - 1, y, 1, h, c);
  };
  const disc = (cx, cy, r, c) => {
    for (let y = 0; y < 32; y++) {
      for (let x = 0; x < 32; x++) {
        if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= r * r) g[y][x] = c;
      }
    }
  };

  if (kind === "split-pane-reader") {
    rect(3, 4, 26, 24, 1);
    frame(3, 4, 26, 24, 2);
    rect(15, 4, 2, 24, 2);
    rect(5, 7, 8, 2, 3);
    rect(5, 11, 8, 1, 2);
    rect(5, 14, 7, 2, 3);
    rect(5, 18, 8, 1, 2);
    rect(5, 21, 6, 1, 2);
    rect(19, 7, 3, 3, 2);
    rect(20, 8, 1, 1, 3);
    rect(23, 8, 4, 1, 2);
    rect(19, 13, 3, 3, 2);
    rect(23, 14, 4, 1, 2);
    rect(19, 19, 3, 3, 2);
    rect(20, 20, 1, 1, 3);
    rect(23, 20, 4, 1, 2);
  } else if (kind === "highlighter-crossout") {
    rect(4, 5, 24, 22, 1);
    frame(4, 5, 24, 22, 2);
    rect(7, 9, 18, 3, 3);
    rect(8, 10, 14, 1, 2);
    rect(7, 15, 18, 1, 2);
    rect(7, 19, 12, 1, 2);
    for (let i = 0; i < 10; i++) {
      rect(16 + i, 24 - i, 2, 2, 2);
      rect(17 + i, 23 - i, 1, 1, 3);
    }
    rect(6, 22, 9, 2, 2);
  } else if (kind === "sectioned-audio") {
    disc(16, 13, 10, 2);
    disc(16, 13, 8, 0);
    rect(5, 13, 22, 16, 0);
    rect(6, 13, 4, 9, 1);
    frame(6, 13, 4, 9, 2);
    rect(22, 13, 4, 9, 1);
    frame(22, 13, 4, 9, 2);
    rect(11, 19, 2, 7, 1);
    rect(14, 15, 2, 11, 3);
    rect(17, 17, 2, 9, 1);
    rect(20, 20, 2, 6, 3);
    rect(11, 27, 11, 2, 2);
  } else if (kind === "question-palette") {
    rect(4, 4, 24, 24, 2);
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const idx = r * 4 + c;
        const fill = idx === 5 ? 3 : (idx < 10 ? 1 : 0);
        rect(6 + c * 5, 6 + r * 5, 4, 4, fill);
      }
    }
    rect(23, 5, 4, 4, 3);
    rect(24, 6, 2, 2, 2);
  } else if (kind === "writing-studio") {
    rect(3, 5, 26, 22, 1);
    frame(3, 5, 26, 22, 2);
    rect(6, 15, 3, 7, 2);
    rect(10, 11, 3, 11, 3);
    rect(14, 8, 3, 14, 2);
    rect(19, 8, 7, 1, 2);
    rect(19, 11, 7, 1, 2);
    rect(19, 14, 6, 1, 2);
    rect(19, 17, 7, 1, 2);
    rect(6, 24, 20, 2, 2);
    rect(7, 24, 12, 2, 3);
  } else if (kind === "rubric-scorer") {
    for (let i = 0; i < 6; i++) {
      const h = 4 + i * 3;
      rect(4 + i * 4, 28 - h, 3, h, i === 5 ? 3 : 1);
      frame(4 + i * 4, 28 - h, 3, h, 2);
    }
    rect(6, 5, 9, 9, 2);
    rect(7, 6, 7, 7, 3);
    rect(8, 9, 1, 2, 2);
    rect(9, 10, 1, 2, 2);
    rect(10, 9, 1, 2, 2);
    rect(11, 8, 1, 2, 2);
    rect(12, 7, 1, 2, 2);
  } else if (kind === "vrm-examiner") {
    disc(16, 13, 8, 2);
    disc(16, 14, 6, 1);
    rect(11, 8, 10, 3, 2);
    rect(12, 13, 2, 2, 2);
    rect(18, 13, 2, 2, 2);
    rect(12, 13, 1, 1, 3);
    rect(18, 13, 1, 1, 3);
    rect(14, 17, 4, 2, 2);
    rect(15, 18, 2, 1, 3);
    rect(8, 22, 16, 7, 1);
    frame(8, 22, 16, 7, 2);
    rect(14, 22, 4, 4, 3);
    rect(25, 11, 2, 2, 3);
    rect(27, 10, 2, 4, 2);
    rect(25, 16, 2, 2, 3);
  } else if (kind === "speech-fallback") {
    rect(7, 6, 6, 11, 1);
    frame(7, 6, 6, 11, 2);
    rect(9, 8, 2, 7, 3);
    rect(5, 15, 10, 2, 2);
    rect(9, 17, 2, 7, 2);
    rect(6, 24, 8, 2, 2);
    rect(16, 8, 12, 12, 3);
    frame(16, 8, 12, 12, 2);
    rect(18, 11, 8, 1, 2);
    rect(18, 14, 6, 1, 2);
    rect(18, 17, 7, 1, 2);
    rect(18, 20, 3, 3, 2);
  } else if (kind === "readiness-tracker") {
    rect(4, 4, 24, 24, 1);
    frame(4, 4, 24, 24, 2);
    for (let x = 6; x < 26; x += 3) rect(x, 10, 2, 1, 3);
    const pts = [[6, 23], [10, 20], [14, 18], [18, 14], [22, 11], [25, 8]];
    for (let i = 0; i < pts.length; i++) {
      rect(pts[i][0], pts[i][1], 3, 3, 2);
      if (i === pts.length - 1) rect(pts[i][0] + 1, pts[i][1] + 1, 1, 1, 3);
    }
    rect(6, 25, 20, 1, 2);
  } else {
    rect(5, 5, 22, 6, 1);
    frame(5, 5, 22, 6, 2);
    rect(8, 7, 4, 2, 3);
    rect(5, 13, 22, 6, 1);
    frame(5, 13, 22, 6, 2);
    rect(8, 15, 4, 2, 3);
    rect(5, 21, 22, 6, 1);
    frame(5, 21, 22, 6, 2);
    rect(8, 23, 4, 2, 3);

  // Helpers
  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function normText(str) {
    return String(str).normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
  }

  function fmtTime(hhmm) {
    return String(hhmm).replace(":", ".");
  }

  function timeToMin(hhmm) {
    const parts = hhmm.split(":");
    return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
  }

  function storageGet(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  function storageSet(key, val) {
    try {
      window.localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {
      // Ignore storage errors on file:// or private mode
    }
  }

  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function makeRng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function cubicBezier(x1, y1, x2, y2) {
    return function (t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      let lo = 0, hi = 1, u = t;
      for (let i = 0; i < 12; i++) {
        u = (lo + hi) * 0.5;
        const mu = 1 - u;
        const x = 3 * mu * mu * u * x1 + 3 * mu * u * u * x2 + u * u * u;
        if (x < t) lo = u;
        else hi = u;
      }
      const mu = 1 - u;
      return 3 * mu * mu * u * y1 + 3 * mu * u * u * y2 + u * u * u;
    };
  }

  const easeMorph = cubicBezier(0.7, 0, 0.3, 1);
  const easeAssemble = cubicBezier(0.2, 0, 0, 1);

  const trackById = id => DATA.tracks.find(t => t.id === id);

    const rng = makeRng(hashStr(speakerId));

    const rows = [];
    for (let y = 0; y < 32; y++) {
      let row = "";
      for (let x = 0; x < 32; x++) {
        if (x === 0 || x === 31 || y === 0 || y === 31) {
          row += "0";
          continue;
        }
        let ch = "0";
        const sh = ((x - 16) / 14) ** 2 + ((y - 34) / 9) ** 2;
        if (sh <= 1) ch = "1";
        const hd = (x - 16) ** 2 + (y - 14) ** 2;
        if (hd <= 49) {

        if ((x === 13 && y === 14) || (x === 19 && y === 14)) ch = "2";
        if ((x === 13 && y === 13) || (x === 19 && y === 13)) ch = "3";
        if (y === 18 && x >= 14 && x <= 18) ch = "2";

    if (!state.agenda.includes(session.id)) return false;
    const sStart = timeToMin(session.start);

      if (!o || o.day !== session.day) return false;

  // Shared rAF scheduler
  const motion = (() => {
    const subs = new Set();
    let rafId = 0;

    function tick(now) {
      rafId = 0;
      if (document.visibilityState === "hidden" || subs.size === 0) return;
      for (const fn of Array.from(subs)) {
        try {
          fn(now);
        } catch (e) {
          subs.delete(fn);
        }
      }
      if (subs.size > 0 && document.visibilityState !== "hidden") {
        rafId = window.requestAnimationFrame(tick);
      }
    }

    function ensure() {
      if (!rafId && subs.size > 0 && document.visibilityState !== "hidden") {
        rafId = window.requestAnimationFrame(tick);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        if (rafId) {
          window.cancelAnimationFrame(rafId);
          rafId = 0;
        }
      } else {
        ensure();
      }
    });

    return {
      add(fn) {
        subs.add(fn);
        ensure();
      },
      remove(fn) {
        subs.delete(fn);
        if (subs.size === 0 && rafId) {
          window.cancelAnimationFrame(rafId);
          rafId = 0;
        }
      }
    };
  })();

  function layoutGlyphLines(lines, gapRows, useBold) {
    const gap = gapRows || 2;

    const cells = [];
    let rowOffset = 0;
    for (let l = 0; l < lines.length; l++) {

      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        const g = set[ch] || set[" "];
        const w = g[0].length;
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < w; c++) {
            if (g[r][c] === "#") {
              cells.push({ x: colOffset + c, y: rowOffset + r });
            }
          }
        }
        colOffset += w + (i < str.length - 1 ? 1 : 0);
      }
      if (colOffset > maxCols) maxCols = colOffset;
      rowOffset += 9 + (l < lines.length - 1 ? gap : 0);
    }
    return { cols: maxCols, rows: rowOffset, cells };
  }

  function svgBitmapText(str, cellH, fill, opts) {
    const o = opts || {};

    const vbW = layout.cols * 5;
    const vbH = layout.rows * 4;
    const color = fill || "currentColor";
    let rects = "";

      const rowMap = new Map();
      for (let i = 0; i < layout.cells.length; i++) {
        const cell = layout.cells[i];
        if (!rowMap.has(cell.y)) rowMap.set(cell.y, []);
        rowMap.get(cell.y).push(cell.x);
      }
      rowMap.forEach((xs, y) => {
        xs.sort((a, b) => a - b);
        let start = xs[0], prev = xs[0];
        for (let k = 1; k <= xs.length; k++) {
          if (k < xs.length && xs[k] === prev + 1) {

    return `<svg class="btn-strike" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="100" x2="100" y2="0" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>`;
  }

  // Tooltip controller
  const tipEl = document.getElementById("tip");
  let tipTimer = 0;

  function positionTip(rect) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    tipEl.classList.add("is-visible");
    const tw = tipEl.offsetWidth;
    const th = tipEl.offsetHeight;
    let left = rect.right + 8;
    let top = rect.top - th - 8;
    if (left + tw > vw - 8) left = Math.max(8, rect.left - tw - 8);
    if (top < 8) top = Math.min(vh - th - 8, rect.bottom + 8);
    tipEl.style.left = `${Math.round(left)}px`;
    tipEl.style.top = `${Math.round(top)}px`;
  }

  function showTip(rect, text, immediate) {
    window.clearTimeout(tipTimer);
    if (!text) return;
    const run = () => {
      tipEl.textContent = text;
      positionTip(rect);
    };
    if (immediate) run();
    else tipTimer = window.setTimeout(run, 120);
  }

  function hideTip() {
    window.clearTimeout(tipTimer);
    tipEl.classList.remove("is-visible");
  }

  // Pixel wipe overlay
  const wipeCanvas = document.getElementById("wipe-canvas");
  let wipeActive = false;

  function playWipe(onFull) {
    if (!state.motionOn || wipeActive) {
      if (onFull) onFull();
      return;
    }
    const ctx = wipeCanvas.getContext("2d");
    if (!ctx) {
      if (onFull) onFull();
      return;
    }
    wipeActive = true;
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    wipeCanvas.width = Math.round(w * dpr);
    wipeCanvas.height = Math.round(h * dpr);
    wipeCanvas.classList.add("is-active");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cell = w >= 768 ? 48 : 32;
    const cols = Math.ceil(w / cell);
    const rows = Math.ceil(h / cell);
    const maxDiag = cols + rows - 2 || 1;
    const start = performance.now();
    let swapped = false;

    function step(now) {
      const elapsed = now - start;
      ctx.clearRect(0, 0, w, h);
      if (elapsed < 260) {
        const prog = elapsed / 260;
        const limit = prog * (maxDiag + 1);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (c + r <= limit) {
              ctx.fillStyle = TRACK_COLORS[(c + r) % 4];
              ctx.fillRect(c * cell, r * cell, cell, cell);
            }
          }
        }
      } else {
        if (!swapped) {
          swapped = true;
          if (onFull) onFull();
        }
        const prog = Math.min(1, (elapsed - 260) / 260);
        const limit = prog * (maxDiag + 1);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (c + r > limit) {
              ctx.fillStyle = TRACK_COLORS[(c + r) % 4];
              ctx.fillRect(c * cell, r * cell, cell, cell);
            }
          }
        }
        if (prog >= 1) {
          wipeCanvas.classList.remove("is-active");
          wipeActive = false;
          motion.remove(step);
          return;
        }
      }
    }
    motion.add(step);
  }

  // Pixel trail (pointer: fine, sodium & paper surfaces)
  const trailCanvas = document.getElementById("trail-canvas");
  let trailCells = [];
  let trailRunning = false;
  let trailColorIdx = 0;
  let lastTrailCellKey = "";

  function sizeTrailCanvas() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    trailCanvas.width = Math.round(w * dpr);
    trailCanvas.height = Math.round(h * dpr);
    const ctx = trailCanvas.getContext("2d");
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function tickTrail(now) {
    const ctx = trailCanvas.getContext("2d");
    if (!ctx) {
      trailRunning = false;
      motion.remove(tickTrail);
      return;
    }
    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    if (!state.motionOn) {
      trailCells = [];
      trailRunning = false;
      motion.remove(tickTrail);
      return;
    }
    const alive = [];
    for (let i = 0; i < trailCells.length; i++) {
      const c = trailCells[i];
      const age = now - c.born;
      if (age >= 420) continue;
      alive.push(c);
      ctx.fillStyle = c.color;
      if (age < 140) {
        ctx.fillRect(c.gx * 16, c.gy * 16, 16, 16);
      } else if (age < 280) {
        ctx.fillRect(c.gx * 16 + 4, c.gy * 16 + 4, 8, 8);
      } else {
        ctx.fillRect(c.gx * 16 + 6, c.gy * 16 + 6, 4, 4);
      }
    }
    trailCells = alive;
    if (trailCells.length === 0) {
      trailRunning = false;
      motion.remove(tickTrail);
    }
  }

  function initTrail() {
    if (!window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;
    sizeTrailCanvas();
    window.addEventListener("resize", sizeTrailCanvas, { passive: true });
    window.addEventListener("pointermove", e => {
      if (!state.motionOn || document.documentElement.classList.contains("menu-open")) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const surfEl = el && el.closest ? el.closest("[data-surface]") : null;
      const surf = surfEl ? surfEl.getAttribute("data-surface") : "sodium";
      if (surf === "ink") return;
      const gx = Math.floor(e.clientX / 16);
      const gy = Math.floor(e.clientY / 16);
      const key = `${gx},${gy}`;
      if (key === lastTrailCellKey) return;
      lastTrailCellKey = key;
      const color = TRAIL_COLORS[trailColorIdx % TRAIL_COLORS.length];
      trailColorIdx++;
      trailCells.push({ gx, gy, born: performance.now(), color });
      if (trailCells.length > 14) trailCells.shift();
      if (!trailRunning) {
        trailRunning = true;
        motion.add(tickTrail);
      }
    }, { passive: true });
  }
