          <div class="col-8-12">
            <figure>
              <svg class="badge-preview-svg" id="badge-preview" viewBox="0 0 320 480" shape-rendering="crispEdges" role="img" aria-label="Goal card for ${esc(state.badge.name)}"></svg>
              <figcaption class="t-micro" style="margin-top:8px;">(Preview: 320 × 480 printable SVG goal card.)</figcaption>
            </figure>
            <div class="field-group badge-name-field">
              <label class="t-micro" for="badge-name-input">Name &amp; target band</label>
              <input class="text-input" type="text" id="badge-name-input" maxlength="18" value="${esc(state.badge.name)}">
            </div>
            <div class="badge-dl-wrap">
              <button type="button" class="btn-primary t-small" id="badge-dl-btn"><span>(Download SVG)</span></button>
            </div>
          </div>
        </div>
      </section>
    `;

    const canvas = document.getElementById("badge-canvas");
    const statusEl = document.getElementById("badge-status");
    const previewSvg = document.getElementById("badge-preview");
    const nameInput = document.getElementById("badge-name-input");
    const paletteBtns = Array.from(document.querySelectorAll("#badge-palette .palette-swatch"));
    const toolBtns = Array.from(document.querySelectorAll("#badge-tools [data-tool]"));

    let grid = state.badge.grid.split("");
    const history = [];
    let currentColor = "3"; // blue
    let mode = "pen"; // pen | erase | fill
    let mirror = false;
    let keyR = 0, keyC = 0;
    let canvasFocused = false;
    let painting = false;
    let paintModeOverride = null;

    function pushHistory() {
      history.push(grid.join(""));
      if (history.length > 20) history.shift();
    }

    function saveGrid() {
      state.badge.grid = grid.join("");
      storageSet("ieafl.badge", state.badge);
    }

    function drawEditor() {
      const rect = canvas.getBoundingClientRect();
      const maxPx = Math.min(rect.width || 320, 640);
      const cell = Math.max(12, Math.floor(maxPx / 16));
      const size = cell * 16;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(size * dpr)) {
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
      }
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = DATA.tokens.ink;
      ctx.fillRect(0, 0, size, size);

      for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 16; c++) {
          const palId = grid[r * 16 + c];
          const palObj = BADGE_PALETTE[Number(palId)] || BADGE_PALETTE[1];
          ctx.fillStyle = palObj.hex;
          ctx.fillRect(c * cell + 1, r * cell + 1, cell - 1, cell - 1);
        }
      }

      if (canvasFocused) {
        ctx.strokeStyle = DATA.tokens.sodium;
        ctx.lineWidth = 2;
        ctx.strokeRect(keyC * cell + 2, keyR * cell + 2, cell - 4, cell - 4);
      }
    }

    function updateStatus() {
      const palId = grid[keyR * 16 + keyC];
      const palObj = BADGE_PALETTE[Number(palId)] || BADGE_PALETTE[1];
      statusEl.textContent = `Row ${keyR + 1}, column ${keyC + 1}, ${palObj.name}.`;
    }

    function drawPreview() {
      const logoLayout = layoutGlyphLines([DATA.meta.name], 2);
      let logoRects = "";
      const lCellH = 2.4;
      const lCellW = lCellH * 1.25;
      const lx0 = 16;
      const ly0 = Math.round((48 - 9 * lCellH) / 2);
      for (let i = 0; i < logoLayout.cells.length; i++) {
        const cell = logoLayout.cells[i];
        logoRects += `<rect x="${(lx0 + cell.x * lCellW).toFixed(2)}" y="${(ly0 + cell.y * lCellH).toFixed(2)}" width="${lCellW}" height="${lCellH}" fill="${DATA.tokens.sodium}"/>`;
      }

      const spriteSize = 16 * 15;
      const sx0 = (320 - spriteSize) / 2;
      const sy0 = 68;
      let spriteRects = "";
      for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 16; c++) {
          const palId = grid[r * 16 + c];
          const palObj = BADGE_PALETTE[Number(palId)] || BADGE_PALETTE[1];
          spriteRects += `<rect x="${sx0 + c * 15}" y="${sy0 + r * 15}" width="15" height="15" fill="${palObj.hex}"/>`;
        }
      }

      let stripRects = "";
      for (let row = 0; row < 2; row++) {
        for (let i = 0; i < 16; i++) {
          stripRects += `<rect x="${i * 20}" y="${432 + row * 24}" width="20" height="24" fill="${TRAIL_COLORS[(i + row * 3) % TRAIL_COLORS.length]}"/>`;
        }
      }

      const badgeName = state.badge.name || "Band 8.0 Goal";
      previewSvg.setAttribute("aria-label", `Goal card for ${badgeName}`);
      previewSvg.innerHTML = `
        <rect x="0" y="0" width="320" height="480" fill="${DATA.tokens.sodium}"/>
        <rect x="0" y="0" width="320" height="48" fill="${DATA.tokens.ink}"/>
        ${logoRects}
        ${spriteRects}
        <text x="16" y="356" font-family="Inter Tight, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="${DATA.tokens.ink}">${esc(badgeName)}</text>
        <text x="16" y="388" font-family="Inter Tight, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="${DATA.tokens.ink}">4 SKILLS · CD-IELTS · ieafl</text>
        ${stripRects}
      `;
    }

    function paintAt(r, c, colorId) {
      if (r < 0 || r >= 16 || c < 0 || c >= 16) return;
      grid[r * 16 + c] = colorId;
      if (mirror) {
        grid[r * 16 + (15 - c)] = colorId;
      }
    }

    function floodFill(r, c, newCol) {
      const target = grid[r * 16 + c];
      if (target === newCol) return;
      const queue = [[r, c]];
      const seen = new Set();
      while (queue.length > 0) {
        const [cr, cc] = queue.shift();
        const k = cr * 16 + cc;
        if (cr < 0 || cr >= 16 || cc < 0 || cc >= 16 || seen.has(k) || grid[k] !== target) continue;
        seen.add(k);
        grid[k] = newCol;
        queue.push([cr - 1, cc], [cr + 1, cc], [cr, cc - 1], [cr, cc + 1]);
      }
    }

    function coordsFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const c = Math.min(15, Math.max(0, Math.floor(((e.clientX - rect.left) / rect.width) * 16)));
      const r = Math.min(15, Math.max(0, Math.floor(((e.clientY - rect.top) / rect.height) * 16)));
      return { r, c };
    }

    canvas.addEventListener("contextmenu", e => e.preventDefault());
    canvas.addEventListener("pointerdown", e => {
      e.preventDefault();
      canvas.focus();
      const { r, c } = coordsFromEvent(e);
      keyR = r; keyC = c;
      pushHistory();
      if (e.button === 2) {
        painting = true;
        paintModeOverride = "1";
        paintAt(r, c, "1");
      } else if (mode === "fill") {
        floodFill(r, c, currentColor);
      } else {
        painting = true;
        paintModeOverride = mode === "erase" ? "1" : currentColor;
        paintAt(r, c, paintModeOverride);
      }
      if (canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    canvas.addEventListener("pointermove", e => {
      if (!painting) return;
      const { r, c } = coordsFromEvent(e);
      keyR = r; keyC = c;
      paintAt(r, c, paintModeOverride);
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    const stopPaint = () => {
      painting = false;
      paintModeOverride = null;
    };
    canvas.addEventListener("pointerup", stopPaint);
    canvas.addEventListener("pointercancel", stopPaint);

    canvas.addEventListener("focus", () => {
      canvasFocused = true;
      drawEditor();
      updateStatus();
    });
    canvas.addEventListener("blur", () => {
      canvasFocused = false;
      drawEditor();
    });

    canvas.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") { keyC = Math.min(15, keyC + 1); }
      else if (e.key === "ArrowLeft") { keyC = Math.max(0, keyC - 1); }
      else if (e.key === "ArrowDown") { keyR = Math.min(15, keyR + 1); }
      else if (e.key === "ArrowUp") { keyR = Math.max(0, keyR - 1); }
      else if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        pushHistory();
        if (mode === "fill") floodFill(keyR, keyC, currentColor);
        else paintAt(keyR, keyC, mode === "erase" ? "1" : currentColor);
        saveGrid();
        drawPreview();
      } else if (e.key === "Delete" || e.key === "Backspace") {
        e.preventDefault();
        pushHistory();
        paintAt(keyR, keyC, "1");
        saveGrid();
        drawPreview();
      } else if (e.key >= "1" && e.key <= "9") {
        selectColor(String(Number(e.key) - 1));
      } else {
        return;
      }
      e.preventDefault();
      drawEditor();
      updateStatus();
    });

    function selectColor(colId) {
      currentColor = colId;
      paletteBtns.forEach(b => b.setAttribute("aria-checked", b.dataset.col === colId ? "true" : "false"));
    }

    paletteBtns.forEach((btn, idx) => {
      btn.addEventListener("click", () => selectColor(btn.dataset.col));
      btn.addEventListener("keydown", e => {
        let next = -1;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (idx + 1) % paletteBtns.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (idx - 1 + paletteBtns.length) % paletteBtns.length;
        if (next >= 0) {
          e.preventDefault();
          selectColor(paletteBtns[next].dataset.col);
          paletteBtns[next].focus();
        }
      });
    });

    toolBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const t = btn.dataset.tool;
        if (t === "mirror") {
          mirror = !mirror;
          btn.setAttribute("aria-pressed", mirror ? "true" : "false");
          return;
        }
        mode = t;
        toolBtns.forEach(b => {
          if (b.dataset.tool !== "mirror") {
            b.setAttribute("aria-pressed", b.dataset.tool === mode ? "true" : "false");
          }
        });
      });
    });

    document.getElementById("badge-random").addEventListener("click", () => {
      pushHistory();
      const rng = makeRng(Date.now());
      const accent = String(3 + Math.floor(rng() * 6));
      const g = new Array(256).fill("1");
      for (let r = 2; r <= 13; r++) {
        for (let c = 0; c < 8; c++) {
          if (rng() < 0.42) {
            g[r * 16 + c] = accent;
            g[r * 16 + (15 - c)] = accent;
          }
        }
      }
      const eyeC = 3 + Math.floor(rng() * 4);
      g[6 * 16 + eyeC] = "0";
      g[6 * 16 + (15 - eyeC)] = "0";
      grid = g;
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    document.getElementById("badge-clear").addEventListener("click", () => {
      pushHistory();
      grid = new Array(256).fill("1");
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    const doUndo = () => {
      if (history.length === 0) return;
      grid = history.pop().split("");
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    };
    document.getElementById("badge-undo").addEventListener("click", doUndo);

    const onKeyUndo = e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        doUndo();
      }
    };
    document.addEventListener("keydown", onKeyUndo);

    nameInput.addEventListener("input", () => {
      state.badge.name = nameInput.value.slice(0, 18);
      storageSet("ieafl.badge", state.badge);
      drawPreview();
    });

    document.getElementById("badge-dl-btn").addEventListener("click", () => {
      const ser = new XMLSerializer();
      const clone = previewSvg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", "320");
      clone.setAttribute("height", "480");
      const svgText = `<?xml version="1.0" encoding="UTF-8"?>\n` + ser.serializeToString(clone);
      const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = "ieafl-goal-card.svg";
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    });

    const ro = new ResizeObserver(drawEditor);
    ro.observe(canvas);
    state.routeCleanup.push(() => {
      ro.disconnect();
      document.removeEventListener("keydown", onKeyUndo);
    });

    drawEditor();
    drawPreview();
    updateStatus();
  }

  // Route 8: User Profile & Per-Exam Score Forecast Dashboard (#/profile)
  function renderProfile(main) {
    document.title = "User Profile & Exam Readiness" + DATA.copy.siteTitleSuffix;
    let activeFocusExam = storageGet("ieafl.focusExam", "ielts");
    let showAllAttempts = false;
    let statusMsg = "";

    function renderTrajectorySvg(fc) {
      const cfg = fc.config;
      const W = 520;
      const H = 190;
      const padL = 48;
      const padR = 24;
      const padT = 20;
      const padB = 34;
      const minV = cfg.chartMin;
      const maxV = cfg.chartMax;
      const yFor = v => padT + ((maxV - Math.max(minV, Math.min(maxV, v))) / Math.max(1, maxV - minV)) * (H - padT - padB);
      const xFor = i => padL + (i / Math.max(1, fc.weeks.length - 1)) * (W - padL - padR);

      const targetY = Math.round(yFor(fc.target));
      let gridLines = "";
      cfg.chartTicks.forEach(tick => {
        const y = Math.round(yFor(tick));
        gridLines += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="rgba(243,172,240,0.18)" stroke-width="1"/>`;
        gridLines += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10" fill="#F3ACF0" font-weight="600">${esc(cfg.formatShort(tick))}</text>`;
      });

      if (!fc.hasData) {
        return `
          <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" shape-rendering="crispEdges" role="img" aria-label="${esc(cfg.short)} target trajectory awaiting baseline attempt">
            ${gridLines}
            <line x1="${padL}" y1="${targetY}" x2="${W - padR}" y2="${targetY}" stroke="#F3ACF0" stroke-width="2" stroke-dasharray="6 4"/>
            <text x="${W - padR}" y="${Math.max(14, targetY - 6)}" text-anchor="end" font-size="10" fill="#F3ACF0" font-weight="700">GOAL ${esc(cfg.formatShort(fc.target))}</text>
            <rect x="${padL + 24}" y="${Math.round(H / 2 - 18)}" width="${W - padL - padR - 48}" height="36" fill="rgba(10,10,10,0.85)" stroke="rgba(243,172,240,0.45)" stroke-width="1"/>
            <text x="${Math.round((padL + W - padR) / 2)}" y="${Math.round(H / 2 + 4)}" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Log your first ${esc(cfg.short)} mock to plot a ${esc(cfg.scaleRangeLabel)} curve</text>
          </svg>
        `;
      }

      const pts = fc.weeks.map((w, i) => ({ x: Math.round(xFor(i)), y: Math.round(yFor(w.val)), ...w }));
      const polyPoints = pts.map(p => `${p.x},${p.y}`).join(" ");
      const areaPoints = `${pts[0].x},${H - padB} ${polyPoints} ${pts[pts.length - 1].x},${H - padB}`;

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" shape-rendering="crispEdges" role="img" aria-label="Monthly ${esc(cfg.short)} trajectory from ${esc(cfg.formatScore(fc.currentScore))} to projected ${esc(cfg.formatScore(fc.projectedScore))}">
          ${gridLines}
          <polygon points="${areaPoints}" fill="rgba(43, 166, 118, 0.22)"/>
          <line x1="${padL}" y1="${targetY}" x2="${W - padR}" y2="${targetY}" stroke="#F3ACF0" stroke-width="2" stroke-dasharray="6 4"/>
          <text x="${W - padR}" y="${Math.max(14, targetY - 6)}" text-anchor="end" font-size="10" fill="#F3ACF0" font-weight="700">GOAL ${esc(cfg.formatShort(fc.target))}</text>
          <polyline points="${polyPoints}" fill="none" stroke="#22C98A" stroke-width="3"/>
          ${pts.map((p, idx) => `
            <rect x="${p.x - 5}" y="${p.y - 5}" width="10" height="10" fill="${idx === pts.length - 1 ? "#F3ACF0" : "#22C98A"}" stroke="#0A0A0A" stroke-width="1.5"/>
            <text x="${p.x}" y="${Math.max(14, p.y - 10)}" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">${esc(cfg.formatShort(p.val))}</text>
            <text x="${p.x}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#F3ACF0">${esc(p.label)}</text>
          `).join("")}
        </svg>
      `;
    }

    function draw() {
      const cloud = window.IEAFL_CLOUD;
      const scoring = window.IEAFL_EXAM_SCORING;
      const snap = cloud ? cloud.getState() : { authReady: false, user: null, isAdmin: false, profile: null, attempts: [], authError: null };

      if (!scoring) {
        main.innerHTML = `
          <section class="sub-sec" data-surface="paper" data-pager="Profile">
            <div class="grid">
              <p class="col-1-3 t-micro">(User Profile)</p>
              <div class="col-5-12"><h1 class="t-h1" tabindex="-1">Loading Profile…</h1></div>
            </div>
          </section>
        `;
        return;
      }

      if (!scoring.isValidExamId(activeFocusExam)) {
        activeFocusExam = "ielts";
      }

      const fc = scoring.computeExamForecast(
        activeFocusExam,
        snap.attempts || [],
        snap.profile || null,
        state.roadmap.completedSteps.length
      );
      const cfg = fc.config;

      if (!snap.user) {
        main.innerHTML = `
          <section class="sub-sec" data-surface="paper" data-pager="Profile">
            <div class="grid">
              <p class="col-1-3 t-micro">(User Profile)</p>
              <div class="col-5-12">
                <h1 class="t-h1" tabindex="-1">Sign in to ${inlineBrandLogo()} Profile</h1>
                <p class="t-body" style="margin-top:14px;">Sign in exclusively with Google (via Firebase Auth) to track each standardized exam on its own authentic scoring scale — IELTS Band (0–9), NEC (0–20.0), Digital SAT (400–1600), HSG (0–20.0), and Olympic 30/4 (0–100) — with isolated section readiness and separate exam targets.</p>
                <div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
                  <button type="button" class="btn-primary t-small" id="profile-google-signin" ${!snap.authReady ? "disabled" : ""}><span>${snap.authReady ? "Continue with Google" : "Connecting Firebase…"}</span></button>
                  <a class="btn-text t-small u-anim" href="#/workspace">(Practice as guest in Workspace)</a>
                </div>
                ${snap.authError ? `<p class="t-micro" style="margin-top:12px;color:#B00020;">${esc(snap.authError)}</p>` : ""}
              </div>

              <div class="col-full profile-grid">
                <div class="profile-card-dark">
                  <p class="t-micro">(Preview · ${esc(cfg.short)} Monthly Forecast · ${esc(fc.monthName)})</p>
                  <h2 class="t-h2" style="margin-top:8px;color:#FFFFFF;">Native scoring for every standardized exam.</h2>
                  <p class="t-small" style="margin-top:8px;color:#F3ACF0;">${inlineBrandLogo("#F3ACF0")} keeps each exam track completely separate—never translating an IELTS Band into a Digital SAT or NEC score. Each exam builds its own trajectory from its own real sections.</p>
                  <div class="profile-chart-wrap">${renderTrajectorySvg(fc)}</div>
                </div>
                <div class="profile-card">
                  <p class="t-micro">(Included in your Google Profile)</p>
                  <ul class="access-list" style="margin-top:12px;">
                    <li class="t-small"><strong>Authentic Per-Exam Scales</strong> — IELTS Band (0–9), Digital SAT (400–1600), NEC &amp; HSG (/20.0), Olympic 30/4 (/100).</li>
                    <li class="t-small"><strong>Isolated Section Readiness</strong> — Digital SAT tracks only R&amp;W + Math; Olympic 30/4 tracks only MCQ, Cloze, Reading &amp; Transforms; IELTS &amp; NEC track their own official parts.</li>
                    <li class="t-small"><strong>Per-Exam Targets &amp; Dates</strong> — set a separate target score and test date for every exam you prepare for.</li>
                    <li class="t-small"><strong>Cloud Attempt Archive</strong> — review and manage every scored session across devices.</li>
                  </ul>
                </div>
              </div>
            </div>
          </section>
        `;
        const loginBtn = document.getElementById("profile-google-signin");
        if (loginBtn) {
          loginBtn.addEventListener("click", async () => {
            if (!window.IEAFL_CLOUD) return;
            try {
              await window.IEAFL_CLOUD.signInWithGoogle();
            } catch (err) {
              statusMsg = err && err.message ? err.message : "Google Sign-In failed.";
              draw();
            }
          });
        }
        return;
      }

      const displayName = (snap.profile && snap.profile.displayName) || snap.user.displayName || "Learner";
      const initials = displayName.trim().slice(0, 2).toUpperCase();
      const photoUrl = snap.user.photoURL || "";

      const allClassified = (snap.attempts || []).map(a => scoring.classifyAttempt(a));
      const shownAttempts = showAllAttempts ? allClassified : fc.examAttempts;
      const bitmapText = fc.hasData && fc.projectedScore !== null ? cfg.formatShort(fc.projectedScore) : "--";
      const bitmapCell = bitmapText.length >= 4 ? 6 : 8;
      const forecastHeading = fc.hasData && fc.projectedScore !== null
        ? `Projected ${cfg.formatScore(fc.projectedScore)}`
        : `No ${cfg.short} Baseline Yet`;

      main.innerHTML = `
        <section class="sub-sec" data-surface="paper" data-pager="Profile">
          <div class="grid">
            <p class="col-1-3 t-micro">(User Profile)</p>
            <div class="col-5-12">
              <h1 class="t-h1" tabindex="-1">${inlineBrandLogo()} Learner Profile</h1>
              <p class="t-body" style="margin-top:10px;">Your Google-authenticated readiness hub — each standardized exam tracked strictly on its own native scoring scale and section structure.</p>
            </div>

            <div class="col-full" style="margin-top:var(--s4);">
              <div class="profile-identity">
                <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                  ${photoUrl
                    ? `<img class="profile-avatar" src="${esc(photoUrl)}" alt="${esc(displayName)}" referrerpolicy="no-referrer">`
                    : `<span class="profile-avatar" aria-hidden="true">${esc(initials)}</span>`}
                  <div>
                    <p class="t-h3">${esc(displayName)}</p>
                    <p class="t-micro">${esc(snap.user.email || "Google Account")} · Verified Google Sign-In${snap.isAdmin ? " · Verified Admin" : ""}</p>
                    <div class="profile-exam-pills" role="group" aria-label="Primary exam focus">
                      ${scoring.EXAM_ORDER.map(eid => {
                        const ex = scoring.EXAM_CONFIGS[eid];
                        return `<button type="button" class="chip-toggle t-micro" data-focus-exam="${esc(eid)}" aria-pressed="${activeFocusExam === eid ? "true" : "false"}">${esc(ex.short)}</button>`;
                      }).join("")}
                    </div>

  // Hash Router
  let currentRouteKey = null;

  function parseRoute(hash) {
    const clean = (hash || "#/").replace(/^#/, "");
    const qIdx = clean.indexOf("?");
    const pathPart = qIdx >= 0 ? clean.slice(0, qIdx) : clean;
    const qsPart = qIdx >= 0 ? clean.slice(qIdx + 1) : "";
    const query = {};
    if (qsPart) {
      try {
        new URLSearchParams(qsPart).forEach((v, k) => { query[k] = v; });
      } catch (e) {}
    }
    if (pathPart === "" || pathPart === "/") return { view: "home", key: "home", query };
    const parts = pathPart.split("/").filter(Boolean);
    if (parts[0] === "schedule" && parts.length === 1) return { view: "schedule", key: "schedule", query };
    if ((parts[0] === "modules" || parts[0] === "speakers") && parts.length === 1) return { view: "speakers", key: "speakers", query };
    if ((parts[0] === "modules" || parts[0] === "speakers") && parts.length === 2) return { view: "speaker", param: parts[1], key: "speaker:" + parts[1], query };
    if ((parts[0] === "formats" || parts[0] === "talks") && parts.length === 1) return { view: "talks", key: "talks", query };
    if ((parts[0] === "formats" || parts[0] === "talks") && parts.length === 2) return { view: "talks", param: parts[1], key: "talks:" + parts[1], query };
    if ((parts[0] === "workspace" || parts[0] === "venue") && parts.length === 1) return { view: "venue", param: "reading", key: "venue" + (qsPart ? "?" + qsPart : ""), query };
    if ((parts[0] === "workspace" || parts[0] === "venue") && parts.length === 2) return { view: "venue", param: parts[1], key: "venue:" + parts[1] + (qsPart ? "?" + qsPart : ""), query };
    if ((parts[0] === "access" || parts[0] === "tickets") && parts.length === 1) return { view: "venue", param: "reading", key: "venue", query };
    if (parts[0] === "badge" && parts.length === 1) return { view: "badge", key: "badge", query };
    if (parts[0] === "profile" && parts.length === 1) return { view: "profile", key: "profile", query };
    return { view: "404", key: "404", query };
  }

  function updateActiveNav(route) {
    const mapHref = {
      schedule: "#/schedule",
      speakers: "#/modules",
      speaker: "#/modules",
      talks: "#/formats",
      venue: "#/workspace",
      badge: "#/badge",
      profile: "#/profile"
    }[route.view] || "";
    document.querySelectorAll("#header-nav a, #menu-nav a").forEach(a => {
      if (a.getAttribute("href") === mapHref) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function mountRoute(route, skipWipe) {
    const main = document.getElementById("main");
    const doSwap = () => {
      while (state.routeCleanup.length > 0) {
        const fn = state.routeCleanup.pop();
        try { fn(); } catch (e) {}
      }
      hideTip();

      if (route.view === "home") renderHome(main);
      else if (route.view === "schedule") renderSchedule(main);
      else if (route.view === "speakers") renderSpeakers(main);
      else if (route.view === "speaker") renderSpeakerDetail(main, route.param);
      else if (route.view === "talks") renderTalks(main, route.param);
      else if (route.view === "venue") renderVenue(main, route.param, route.query);
      else if (route.view === "badge") renderBadge(main);
      else if (route.view === "profile") renderProfile(main);
      else renderNotFound(main);

      updateActiveNav(route);
      setupObservers();
      if (window.IEAFL_ENHANCE_SELECTS) window.IEAFL_ENHANCE_SELECTS(main);

      if (state.scrollAfterRoute) {
        const target = document.getElementById(state.scrollAfterRoute);
        state.scrollAfterRoute = null;
        if (target) target.scrollIntoView({ behavior: state.motionOn ? "smooth" : "auto" });
      } else if (!(route.view === "talks" && route.param)) {
        window.scrollTo(0, 0);
      }

      if (!skipWipe) {
        const h1 = main.querySelector("h1");
        if (h1) h1.focus({ preventScroll: true });
      }
    };

    if (skipWipe) doSwap();
    else playWipe(doSwap);
  }

  function init() {
    initChrome();
    initTrail();
    const initial = parseRoute(window.location.hash);
    currentRouteKey = initial.key;
    mountRoute(initial, true);

    window.addEventListener("hashchange", () => {
      const next = parseRoute(window.location.hash);
      if (next.key === currentRouteKey) return;
      currentRouteKey = next.key;
      mountRoute(next, false);
    });
  }

  return { init };
})();

document.addEventListener("DOMContentLoaded", () => APP.init());
</script>
<script type="module" src="/src/main.ts"></script>
</body>
