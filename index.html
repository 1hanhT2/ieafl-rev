<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ieafl — Computer-Delivered IELTS Practice Platform</title>
<meta name="description" content="Self-study computer-delivered IELTS practice platform for Reading, Listening, Writing, and voice-led Speaking with rubric scoring, goal tracking, and test bank admin tools.">
<meta property="og:title" content="ieafl — Computer-Delivered IELTS Practice Platform">
<meta property="og:description" content="Rehearse all four IELTS exam skills under realistic computer-delivered constraints, get actionable band scoring and feedback, and track exam readiness over time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --sodium: #F3ACF0;
  --ink: #0A0A0A;
  --paper: #FFFFFF;
  --blue: #2370E8;
  --pink: #D873B3;
  --green: #2BA676;
  --lavender: #A98BF7;
  --coral: #FF5A5A;
  --mint: #22C98A;

  --s1: 4px;
  --s2: 8px;
  --s3: 16px;
  --s4: 24px;
  --s5: 32px;
  --s6: 48px;
  --s7: 64px;
  --s8: 96px;
  --s9: 128px;
  --s10: 160px;

  --cols: 4;
  --gutter: 10px;
  --margin: 16px;
  --sec-pad: 64px;
  --header-h: 56px;

  --bg: var(--sodium);
  --fg: var(--ink);
  --focus: var(--ink);
  --rule-color: var(--ink);
  --rule: 1px solid var(--rule-color);
  --rule-strong: 2px solid var(--rule-color);
  --poster-u: 10px;
}

@media (min-width: 390px) {
  :root {
    --gutter: 12px;
  }
}

@media (min-width: 768px) {
  :root {
    --cols: 8;
    --gutter: 12px;
    --margin: 20px;
    --sec-pad: 80px;
    --header-h: 64px;
  }
}

@media (min-width: 1024px) {
  :root {
    --cols: 12;
    --gutter: 16px;
    --margin: 24px;
    --sec-pad: 96px;
  }
}

@media (min-width: 1440px) {
  :root {
    --margin: 28px;
    --sec-pad: 128px;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
  border-radius: 0;
}

html {
  font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  font-size: 16px;
  background-color: var(--sodium);
  color: var(--ink);
  scroll-padding-top: 80px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

@media (prefers-reduced-motion: no-preference) {
  html.motion-on {
    scroll-behavior: smooth;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

html.menu-open {
  overflow: hidden;
}

body {
  margin: 0;
  padding: 0;
  padding-top: var(--header-h);
  background-color: var(--bg);
  color: var(--fg);
  font-weight: 400;
  line-height: 1.45;
  overflow-wrap: break-word;
}

h1, h2, h3, h4, p, ul, ol, dl, dt, dd, figure, figcaption, blockquote {
  margin: 0;
  padding: 0;
}

ul, ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, select {
  font-family: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  border-radius: 0;
}

button {
  cursor: pointer;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

:focus:not(:focus-visible) {
  outline: none;
}

/* Surfaces */
[data-surface="sodium"] {
  --bg: var(--sodium);
  --fg: var(--ink);
  --focus: var(--ink);
  --rule-color: var(--ink);
  --rule: 1px solid var(--ink);
  --rule-strong: 2px solid var(--ink);
  background-color: var(--sodium);
  color: var(--ink);
}

[data-surface="paper"] {
  --bg: var(--paper);
  --fg: var(--ink);
  --focus: var(--ink);
  --rule-color: var(--ink);
  --rule: 1px solid var(--ink);
  --rule-strong: 2px solid var(--ink);
  background-color: var(--paper);
  color: var(--ink);
}

[data-surface="ink"] {
  --bg: var(--ink);
  --fg: var(--sodium);
  --focus: var(--sodium);
  --rule-color: var(--sodium);
  --rule: 1px solid var(--sodium);
  --rule-strong: 2px solid var(--sodium);
  background-color: var(--ink);
  color: var(--sodium);
}

/* Typography scale */
.t-micro {
  font-size: clamp(0.75rem, 0.72rem + 0.1vw, 0.8125rem);
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.t-small {
  font-size: clamp(0.875rem, 0.83rem + 0.2vw, 0.9375rem);
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -0.005em;
}

.t-body {
  font-size: clamp(1rem, 0.94rem + 0.25vw, 1.125rem);
  font-weight: 400;
  line-height: 1.45;
  letter-spacing: -0.005em;
  max-width: 62ch;
}

.t-lead {
  font-size: clamp(1.25rem, 0.95rem + 0.95vw, 1.625rem);
  font-weight: 500;
  line-height: 1.04;
  letter-spacing: -0.02em;
}

.t-h2 {
  font-size: clamp(1.625rem, 1rem + 2vw, 2.375rem);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.02em;
}

.t-h1 {
  font-size: clamp(2.5rem, 1.3rem + 3.8vw, 4.5rem);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.035em;
}

.tnum {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.t-paper {
  color: var(--paper);
}

.t-sodium {
  color: var(--sodium);
}

.t-ink {
  color: var(--ink);
}

.fw-600 {
  font-weight: 600;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Skip link */
.skip-link {
  position: fixed;
  top: 8px;
  left: var(--margin);
  z-index: 200;
  background-color: var(--ink);
  color: var(--sodium);
  padding: 0 var(--s3);
  height: 44px;
  display: inline-flex;
  align-items: center;
  font-size: 0.875rem;
  font-weight: 600;
  transform: translateY(-200%);
}

.skip-link:focus {
  transform: translateY(0);
  outline: 3px solid var(--sodium);
  outline-offset: 3px;
}

/* 12-col grid */
.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  column-gap: var(--gutter);
  padding-inline: var(--margin);
  width: 100%;
}

.sec {
  padding-block: var(--sec-pad);
}

.sub-sec {
  padding-top: var(--s6);
  padding-bottom: var(--sec-pad);
}

@media (min-width: 1024px) {
  .sub-sec {
    padding-top: var(--s7);
  }
}

.col-full { grid-column: 1 / -1; }
.col-1-3 { grid-column: 1 / -1; }
.col-1-4 { grid-column: 1 / -1; }
.col-1-5 { grid-column: 1 / -1; }
.col-1-6 { grid-column: 1 / -1; }
.col-1-8 { grid-column: 1 / -1; }
.col-5-8 { grid-column: 1 / -1; }
.col-5-12 { grid-column: 1 / -1; }
.col-7-12 { grid-column: 1 / -1; }
.col-8-12 { grid-column: 1 / -1; }
.col-9-12 { grid-column: 1 / -1; }

@media (min-width: 768px) {
  .col-1-3 { grid-column: 1 / 4; }
  .col-1-4 { grid-column: 1 / 5; }
  .col-1-5 { grid-column: 1 / 5; }
  .col-1-8 { grid-column: 1 / -1; }
  .col-5-8 { grid-column: 1 / 5; }
  .col-5-12 { grid-column: 1 / -1; }
  .col-7-12 { grid-column: 5 / 9; }
  .col-8-12 { grid-column: 1 / -1; }
  .col-9-12 { grid-column: 5 / 9; }
}

@media (min-width: 1024px) {
  .col-1-3 { grid-column: 1 / 4; }
  .col-1-4 { grid-column: 1 / 5; }
  .col-1-5 { grid-column: 1 / 6; }
  .col-1-6 { grid-column: 1 / 7; }
  .col-1-8 { grid-column: 1 / 9; }
  .col-5-8 { grid-column: 5 / 9; }
  .col-5-12 { grid-column: 5 / 13; }
  .col-7-12 { grid-column: 7 / 13; }
  .col-8-12 { grid-column: 8 / 13; }
  .col-9-12 { grid-column: 9 / 13; }
}

/* Header */
.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--header-h);
  z-index: 50;
  display: flex;
  align-items: center;
}

.header-grid {
  align-items: center;
}

.logo-link {
  grid-column: 1 / 4;
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  min-width: 24px;
  padding: 6px 0;
  justify-self: start;
}

.logo-svg {
  display: block;
  width: 117px;
  height: 21.6px;
}

@media (min-width: 768px) {
  .logo-svg {
    width: 146.25px;
    height: 27px;
  }
}

.main-nav {
  display: none;
}

.header-actions-desktop {
  display: none;
}

.menu-btn-wrap {
  grid-column: -2 / -1;
  justify-self: end;
  display: flex;
  align-items: center;
}

.menu-btn {
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--s2);
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
}

@media (min-width: 1200px) {
  .main-nav {
    display: flex;
    grid-column: 5 / 11;
    align-items: center;
    gap: var(--s3);
  }
  .header-actions-desktop {
    display: flex;
    grid-column: 11 / 13;
    justify-self: end;
    align-items: center;
    gap: var(--s3);
    white-space: nowrap;
  }
  .menu-btn-wrap {
    display: none;
  }
}

.nav-link {
  position: relative;
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 6px 4px;
  white-space: nowrap;
}

.nav-link[aria-current="page"] {
  background-color: var(--ink);
  color: var(--sodium);
  padding: 2px 4px;
}

[data-surface="ink"] .nav-link[aria-current="page"] {
  background-color: var(--sodium);
  color: var(--ink);
}

/* Text buttons and animated underline */
.btn-text {
  position: relative;
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  min-width: 24px;
  padding: 4px 0;
  text-align: left;
}

.u-anim::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 1px;
  height: 1px;
  background-color: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
}

html.motion-on .u-anim:hover::after,
html.motion-on .u-anim:focus-visible::after {
  transform: scaleX(1);
  transition: transform 180ms steps(6);
}

html:not(.motion-on) .u-anim:hover::after,
html:not(.motion-on) .u-anim:focus-visible::after {
  transform: scaleX(1);
}

.nav-link[aria-current="page"]::after {
  display: none;
}

/* Primary button */
.btn-primary {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  padding: 0 20px;
  background-color: var(--ink);
  color: var(--sodium);
  font-weight: 600;
  overflow: hidden;
  border: 0;
  white-space: nowrap;
}

.btn-primary.btn-sm {
  height: 40px;
  padding: 0 16px;
}

[data-surface="ink"] .btn-primary {
  background-color: var(--sodium);
  color: var(--ink);
}

.btn-primary::before {
  content: "";
  position: absolute;
  inset: 0;
  background-color: var(--blue);
  transform: scaleX(0);
  transform-origin: left center;
  z-index: 0;
}

html.motion-on .btn-primary:not([aria-disabled="true"]):hover::before {
  transform: scaleX(1);
  transition: transform 240ms steps(6);
}

html:not(.motion-on) .btn-primary:not([aria-disabled="true"]):hover::before {
  transform: scaleX(1);
}

.btn-primary:not([aria-disabled="true"]):hover {
  color: var(--paper);
}

.btn-primary > span {
  position: relative;
  z-index: 1;
}

.btn-primary:not([aria-disabled="true"]):active {
  transform: translateY(1px);
}

.btn-primary[aria-disabled="true"],
.btn-stepper[aria-disabled="true"] {
  background-color: transparent;
  color: var(--ink);
  border: 1px solid var(--ink);
  cursor: not-allowed;
}

[data-surface="ink"] .btn-primary[aria-disabled="true"] {
  color: var(--sodium);
  border-color: var(--sodium);
}

.btn-strike {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* Toggle chips */
.chip-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--ink);
  background-color: transparent;
  color: var(--ink);
  font-weight: 500;
  white-space: nowrap;
}

[data-surface="ink"] .chip-toggle {
  border-color: var(--sodium);
  color: var(--sodium);
}

@media (pointer: coarse) {
  .chip-toggle, .btn-text, .nav-link, .menu-btn, .pager-btn {
    min-height: 44px;
    min-width: 44px;
  }
  .chip-toggle {
    height: 44px;
  }
}

.chip-toggle[aria-pressed="true"] {
  background-color: var(--ink);
  color: var(--paper);
}

[data-surface="sodium"] .chip-toggle[aria-pressed="true"] {
  color: var(--sodium);
}

[data-surface="ink"] .chip-toggle[aria-pressed="true"] {
  background-color: var(--sodium);
  color: var(--ink);
}

.chip-toggle[data-track="reading"][aria-pressed="true"] {
  background-color: var(--pink);
  color: var(--ink);
  border-color: var(--ink);
}

.chip-toggle[data-track="listening"][aria-pressed="true"] {
  background-color: var(--green);
  color: var(--ink);
  border-color: var(--ink);
}

.chip-toggle[data-track="writing"][aria-pressed="true"] {
  background-color: var(--lavender);
  color: var(--ink);
  border-color: var(--ink);
}

.chip-toggle[data-track="speaking"][aria-pressed="true"] {
  background-color: var(--blue);
  color: var(--paper);
  border-color: var(--ink);
}

.seg-group {
  display: inline-flex;
}

.seg-group > .chip-toggle + .chip-toggle {
  margin-left: -1px;
}

/* Track chips (static badges) */
.track-chip {
  display: inline-block;
  padding: 1px 6px;
  font-weight: 600;
  vertical-align: baseline;
}

.track-chip-reading { background-color: var(--pink); color: var(--ink); }
.track-chip-listening { background-color: var(--green); color: var(--ink); }
.track-chip-writing { background-color: var(--lavender); color: var(--ink); }
.track-chip-speaking { background-color: var(--blue); color: var(--paper); }

.clash-chip {
  display: inline-block;
  padding: 2px 6px;
  background-color: var(--coral);
  color: var(--ink);
  font-weight: 600;
}

/* Mobile menu overlay */
.menu-overlay {
  position: fixed;
  inset: 0;
  z-index: 90;
  background-color: var(--sodium);
  color: var(--ink);
  display: none;
  flex-direction: column;
  padding-bottom: var(--s6);
  overflow-y: auto;
}

.menu-overlay.is-open {
  display: flex;
}

.menu-overlay-top {
  height: var(--header-h);
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.menu-overlay-links {
  margin-top: var(--s5);
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}

.menu-overlay-links a {
  display: inline-block;
  padding: var(--s1) 0;
  align-self: flex-start;
}

.menu-overlay-links a[aria-current="page"] {
  background-color: var(--ink);
  color: var(--sodium);
  padding: var(--s1) var(--s2);
}

.menu-overlay-footer {
  margin-top: auto;
  padding-top: var(--s6);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s4);
}

/* Global pixel overlays */
#trail-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 30;
}

#wipe-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 120;
  display: none;
}

#wipe-canvas.is-active {
  display: block;
}

/* Shared tooltip */
#tip {
  position: fixed;
  z-index: 100;
  background-color: var(--paper);
  color: var(--ink);
  border: 1px solid var(--ink);
  padding: 4px 8px;
  pointer-events: none;
  display: none;
  max-width: 260px;
}

#tip.is-visible {
  display: block;
}

/* Section pager & top button */
.pager-wrap {
  position: fixed;
  left: var(--margin);
  bottom: var(--s3);
  z-index: 40;
}

.pager-wrap.is-hidden {
  display: none;
}

.pager-btn {
  padding: 4px 6px;
  background-color: transparent;
  border: 1px solid transparent;
  min-height: 24px;
  min-width: 24px;
}

.pager-wrap[data-surface="ink"] {
  color: var(--sodium);
  --focus: var(--sodium);
}

.pager-wrap[data-surface="sodium"],
.pager-wrap[data-surface="paper"] {
  color: var(--ink);
  --focus: var(--ink);
}

.pager-popover {
  position: absolute;
  left: 0;
  bottom: calc(100% + 8px);
  background-color: var(--paper);
  color: var(--ink);
  border: 1px solid var(--ink);
  padding: var(--s2);
  min-width: 200px;
  display: none;
}

.pager-popover.is-open {
  display: block;
}

.pager-popover button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 6px 8px;
  min-height: 32px;
}

.pager-popover button:hover,
.pager-popover button[aria-current="true"] {
  background-color: var(--ink);
  color: var(--sodium);
}

.top-btn {
  position: fixed;
  right: var(--margin);
  bottom: var(--s3);
  z-index: 40;
  padding: 4px 6px;
  display: none;
  min-height: 24px;
  min-width: 24px;
}

.top-btn.is-visible {
  display: inline-flex;
  align-items: center;
}

.top-btn[data-surface="ink"] {
  color: var(--sodium);
  --focus: var(--sodium);
}

.top-btn[data-surface="sodium"],
.top-btn[data-surface="paper"] {
  color: var(--ink);
  --focus: var(--ink);
}

/* Reveal animations */
@keyframes revealTextClip {
  from { clip-path: inset(0 100% 0 0); }
  to { clip-path: inset(0 0 0 0); }
}

.reveal-text.is-pending {
  opacity: 0;
}

.reveal-text.is-shown {
  opacity: 1;
  animation: revealTextClip 320ms steps(8) both;
}

.reveal-block.is-pending {
  opacity: 0;
  transform: translateY(8px);
}

.reveal-block.is-shown {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 240ms steps(4), transform 240ms steps(4);
}

/* L1 Hero */
.hero-sec {
  padding-inline: var(--margin);
  padding-top: var(--s4);
  padding-bottom: var(--s6);
}

@media (min-width: 1024px) {
  .hero-sec {
    min-height: calc(100svh - var(--header-h));
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
}

.hero-top-address {
  grid-column: 1 / 4;
}

.hero-top-about {
  grid-column: 3 / 4;
  justify-self: start;
  align-self: start;
}

.hero-top-date {
  grid-column: 4 / 5;
  justify-self: end;
  align-self: start;
  text-align: right;
}

@media (max-width: 767px) {
  .hero-top-address { grid-column: 1 / 5; margin-bottom: var(--s3); }
  .hero-top-about { grid-column: 1 / 3; }
  .hero-top-date { grid-column: 3 / 5; }
}

@media (min-width: 768px) {
  .hero-top-address { grid-column: 1 / 4; }
  .hero-top-about { grid-column: 4 / 6; }
  .hero-top-date { grid-column: 7 / 9; }
}

@media (min-width: 1024px) {
  .hero-top-address { grid-column: 1 / 5; }
  .hero-top-about { grid-column: 6 / 7; }
  .hero-top-date { grid-column: 10 / 13; }
}

.hero-display-wrap {
  margin-top: var(--s6);
}

.hero-canvas {
  display: block;
  width: 100%;
  aspect-ratio: 31 / 16;
  cursor: pointer;
}

@media (min-width: 768px) {
  .hero-canvas {
    aspect-ratio: 39 / 7.2;
  }
}

.hero-sub-row {
  margin-top: var(--s3);
}

mark {

<script>
"use strict";

function buildModulePixelGrid(kind) {
  const g = Array.from({ length: 32 }, () => new Array(32).fill(0));
  const rect = (x, y, w, h, c) => {
    for (let yy = Math.max(0, y); yy < Math.min(32, y + h); yy++) {
      for (let xx = Math.max(0, x); xx < Math.min(32, x + w); xx++) {
        g[yy][xx] = c;
      }
    }
  };
  const frame = (x, y, w, h, c) => {
    rect(x, y, w, 1, c);
    rect(x, y + h - 1, w, 1, c);
    rect(x, y, 1, h, c);
    rect(x + w - 1, y, 1, h, c);
  };
  const disc = (cx, cy, r, c) => {
    for (let y = 0; y < 32; y++) {
      for (let x = 0; x < 32; x++) {
        if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= r * r) g[y][x] = c;
      }
    }
  };

  if (kind === "split-pane-reader") {
    rect(3, 4, 26, 24, 1);
    frame(3, 4, 26, 24, 2);
    rect(15, 4, 2, 24, 2);
    rect(5, 7, 8, 2, 3);
    rect(5, 11, 8, 1, 2);
    rect(5, 14, 7, 2, 3);
    rect(5, 18, 8, 1, 2);
    rect(5, 21, 6, 1, 2);
    rect(19, 7, 3, 3, 2);
    rect(20, 8, 1, 1, 3);
    rect(23, 8, 4, 1, 2);
    rect(19, 13, 3, 3, 2);
    rect(23, 14, 4, 1, 2);
    rect(19, 19, 3, 3, 2);
    rect(20, 20, 1, 1, 3);
    rect(23, 20, 4, 1, 2);
  } else if (kind === "highlighter-crossout") {
    rect(4, 5, 24, 22, 1);
    frame(4, 5, 24, 22, 2);
    rect(7, 9, 18, 3, 3);
    rect(8, 10, 14, 1, 2);
    rect(7, 15, 18, 1, 2);
    rect(7, 19, 12, 1, 2);
    for (let i = 0; i < 10; i++) {
      rect(16 + i, 24 - i, 2, 2, 2);
      rect(17 + i, 23 - i, 1, 1, 3);
    }
    rect(6, 22, 9, 2, 2);
  } else if (kind === "sectioned-audio") {
    disc(16, 13, 10, 2);
    disc(16, 13, 8, 0);
    rect(5, 13, 22, 16, 0);
    rect(6, 13, 4, 9, 1);
    frame(6, 13, 4, 9, 2);
    rect(22, 13, 4, 9, 1);
    frame(22, 13, 4, 9, 2);
    rect(11, 19, 2, 7, 1);
    rect(14, 15, 2, 11, 3);
    rect(17, 17, 2, 9, 1);
    rect(20, 20, 2, 6, 3);
    rect(11, 27, 11, 2, 2);
  } else if (kind === "question-palette") {
    rect(4, 4, 24, 24, 2);
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const idx = r * 4 + c;
        const fill = idx === 5 ? 3 : (idx < 10 ? 1 : 0);
        rect(6 + c * 5, 6 + r * 5, 4, 4, fill);
      }
    }
    rect(23, 5, 4, 4, 3);
    rect(24, 6, 2, 2, 2);
  } else if (kind === "writing-studio") {
    rect(3, 5, 26, 22, 1);
    frame(3, 5, 26, 22, 2);
    rect(6, 15, 3, 7, 2);
    rect(10, 11, 3, 11, 3);
    rect(14, 8, 3, 14, 2);
    rect(19, 8, 7, 1, 2);
    rect(19, 11, 7, 1, 2);
    rect(19, 14, 6, 1, 2);
    rect(19, 17, 7, 1, 2);
    rect(6, 24, 20, 2, 2);
    rect(7, 24, 12, 2, 3);
  } else if (kind === "rubric-scorer") {
    for (let i = 0; i < 6; i++) {
      const h = 4 + i * 3;
      rect(4 + i * 4, 28 - h, 3, h, i === 5 ? 3 : 1);
      frame(4 + i * 4, 28 - h, 3, h, 2);
    }
    rect(6, 5, 9, 9, 2);
    rect(7, 6, 7, 7, 3);
    rect(8, 9, 1, 2, 2);
    rect(9, 10, 1, 2, 2);
    rect(10, 9, 1, 2, 2);
    rect(11, 8, 1, 2, 2);
    rect(12, 7, 1, 2, 2);
  } else if (kind === "vrm-examiner") {
    disc(16, 13, 8, 2);
    disc(16, 14, 6, 1);
    rect(11, 8, 10, 3, 2);
    rect(12, 13, 2, 2, 2);
    rect(18, 13, 2, 2, 2);
    rect(12, 13, 1, 1, 3);
    rect(18, 13, 1, 1, 3);
    rect(14, 17, 4, 2, 2);
    rect(15, 18, 2, 1, 3);
    rect(8, 22, 16, 7, 1);
    frame(8, 22, 16, 7, 2);
    rect(14, 22, 4, 4, 3);
    rect(25, 11, 2, 2, 3);
    rect(27, 10, 2, 4, 2);
    rect(25, 16, 2, 2, 3);
  } else if (kind === "speech-fallback") {
    rect(7, 6, 6, 11, 1);
    frame(7, 6, 6, 11, 2);
    rect(9, 8, 2, 7, 3);
    rect(5, 15, 10, 2, 2);
    rect(9, 17, 2, 7, 2);
    rect(6, 24, 8, 2, 2);
    rect(16, 8, 12, 12, 3);
    frame(16, 8, 12, 12, 2);
    rect(18, 11, 8, 1, 2);
    rect(18, 14, 6, 1, 2);
    rect(18, 17, 7, 1, 2);
    rect(18, 20, 3, 3, 2);
  } else if (kind === "readiness-tracker") {
    rect(4, 4, 24, 24, 1);
    frame(4, 4, 24, 24, 2);
    for (let x = 6; x < 26; x += 3) rect(x, 10, 2, 1, 3);
    const pts = [[6, 23], [10, 20], [14, 18], [18, 14], [22, 11], [25, 8]];
    for (let i = 0; i < pts.length; i++) {
      rect(pts[i][0], pts[i][1], 3, 3, 2);
      if (i === pts.length - 1) rect(pts[i][0] + 1, pts[i][1] + 1, 1, 1, 3);
    }
    rect(6, 25, 20, 1, 2);
  } else {
    rect(5, 5, 22, 6, 1);
    frame(5, 5, 22, 6, 2);
    rect(8, 7, 4, 2, 3);
    rect(5, 13, 22, 6, 1);
    frame(5, 13, 22, 6, 2);
    rect(8, 15, 4, 2, 3);
    rect(5, 21, 22, 6, 1);
    frame(5, 21, 22, 6, 2);
    rect(8, 23, 4, 2, 3);
    rect(21, 7, 3, 2, 2);
    rect(21, 15, 3, 2, 2);
    rect(21, 23, 3, 2, 2);
  }

  return g.map(row => row.join(""));
}

  const TRACK_COLORS = [DATA.tokens.blue, DATA.tokens.pink, DATA.tokens.lavender, DATA.tokens.green];
  const TRAIL_COLORS = [
    DATA.tokens.blue, DATA.tokens.pink, DATA.tokens.green,
    DATA.tokens.lavender, DATA.tokens.coral, DATA.tokens.mint
  ];
  const BADGE_PALETTE = [
    { id: "0", name: "ink", hex: DATA.tokens.ink },
    { id: "1", name: "paper", hex: DATA.tokens.paper },
    { id: "2", name: "sodium", hex: DATA.tokens.sodium },
    { id: "3", name: "blue", hex: DATA.tokens.blue },
    { id: "4", name: "pink", hex: DATA.tokens.pink },
    { id: "5", name: "green", hex: DATA.tokens.green },
    { id: "6", name: "lavender", hex: DATA.tokens.lavender },
    { id: "7", name: "coral", hex: DATA.tokens.coral },
    { id: "8", name: "mint", hex: DATA.tokens.mint }
  ];

  // Helpers
  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function normText(str) {
    return String(str).normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
  }

  function fmtTime(hhmm) {
    return String(hhmm).replace(":", ".");
  }

  function timeToMin(hhmm) {
    const parts = hhmm.split(":");
    return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
  }

  function storageGet(key, fallback) {
    try {

  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function makeRng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function cubicBezier(x1, y1, x2, y2) {
    return function (t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      let lo = 0, hi = 1, u = t;
      for (let i = 0; i < 12; i++) {
        u = (lo + hi) * 0.5;
        const mu = 1 - u;
        const x = 3 * mu * mu * u * x1 + 3 * mu * u * u * x2 + u * u * u;
        if (x < t) lo = u;
        else hi = u;
      }
      const mu = 1 - u;
      return 3 * mu * mu * u * y1 + 3 * mu * u * u * y2 + u * u * u;
    };
  }

  function defaultBadgeGrid() {
    const g = new Array(256).fill("1");
    const heart = DATA.tracks[2].bitmap.slice(5, 14);
    for (let r = 0; r < heart.length; r++) {
      for (let c = 0; c < 9; c++) {

  // Procedural fallback portrait if rows empty
  function fallbackPortraitRows(speakerId) {
    const rng = makeRng(hashStr(speakerId));
    const hairSide = rng() > 0.5 ? 1 : 0;
    const rows = [];
    for (let y = 0; y < 32; y++) {
      let row = "";
      for (let x = 0; x < 32; x++) {
        if (x === 0 || x === 31 || y === 0 || y === 31) {
          row += "0";
          continue;
        }
        let ch = "0";
        const sh = ((x - 16) / 14) ** 2 + ((y - 34) / 9) ** 2;
        if (sh <= 1) ch = "1";
        const hd = (x - 16) ** 2 + (y - 14) ** 2;
        if (hd <= 49) {
          ch = "1";
          if (y <= 10 || (hairSide && (x <= 10 || x >= 22) && y <= 14)) {
            ch = "2";
          }
        }
        if ((x === 13 && y === 14) || (x === 19 && y === 14)) ch = "2";
        if ((x === 13 && y === 13) || (x === 19 && y === 13)) ch = "3";
        if (y === 18 && x >= 14 && x <= 18) ch = "2";
        row += ch;
      }
      rows.push(row);
    }

  const motion = (() => {
    const subs = new Set();
    let rafId = 0;

    function tick(now) {
      rafId = 0;
      if (document.visibilityState === "hidden" || subs.size === 0) return;
      for (const fn of Array.from(subs)) {
        try {
          fn(now);
        } catch (e) {
          subs.delete(fn);
        }
      }
      if (subs.size > 0 && document.visibilityState !== "hidden") {
        rafId = window.requestAnimationFrame(tick);
      }
    }

    function ensure() {
      if (!rafId && subs.size > 0 && document.visibilityState !== "hidden") {
        rafId = window.requestAnimationFrame(tick);
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        if (rafId) {
          window.cancelAnimationFrame(rafId);
          rafId = 0;
        }
      } else {
        ensure();
      }
    });

    return {
      add(fn) {
        subs.add(fn);
        ensure();
      },
      remove(fn) {
        subs.delete(fn);
        if (subs.size === 0 && rafId) {
          window.cancelAnimationFrame(rafId);
          rafId = 0;
        }

  // Bitmap glyph helpers
  function layoutGlyphLines(lines, gapRows, useBold) {
    const gap = gapRows || 2;
    const set = useBold ? DATA.glyphsBold : DATA.glyphs;
    let maxCols = 0;
    const cells = [];
    let rowOffset = 0;
    for (let l = 0; l < lines.length; l++) {
      const str = lines[l];
      let colOffset = 0;
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        const g = set[ch] || set[" "];
        const w = g[0].length;
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < w; c++) {
            if (g[r][c] === "#") {
              cells.push({ x: colOffset + c, y: rowOffset + r });
            }
          }
        }
        colOffset += w + (i < str.length - 1 ? 1 : 0);
      }
      if (colOffset > maxCols) maxCols = colOffset;
      rowOffset += 9 + (l < lines.length - 1 ? gap : 0);
    }
    return { cols: maxCols, rows: rowOffset, cells };
  }

  function svgBitmapText(str, cellH, fill, opts) {
    const o = opts || {};
    const layout = layoutGlyphLines(Array.isArray(str) ? str : [str], 2, Boolean(o.bold));
    const vbW = layout.cols * 5;
    const vbH = layout.rows * 4;
    const color = fill || "currentColor";
    let rects = "";
    if (o.perCell) {
      for (let i = 0; i < layout.cells.length; i++) {
        const cell = layout.cells[i];
        rects += `<rect x="${cell.x * 5}" y="${cell.y * 4}" width="5" height="4" data-gx="${cell.x}" data-gy="${cell.y}"/>`;
      }
    } else {
      // Merge horizontal runs per row
      const rowMap = new Map();
      for (let i = 0; i < layout.cells.length; i++) {
        const cell = layout.cells[i];
        if (!rowMap.has(cell.y)) rowMap.set(cell.y, []);
        rowMap.get(cell.y).push(cell.x);
      }
      rowMap.forEach((xs, y) => {
        xs.sort((a, b) => a - b);
        let start = xs[0], prev = xs[0];
        for (let k = 1; k <= xs.length; k++) {
          if (k < xs.length && xs[k] === prev + 1) {
            prev = xs[k];
          } else {
            const span = prev - start + 1;
            rects += `<rect x="${start * 5}" y="${y * 4}" width="${span * 5}" height="4.04"/>`;
            if (k < xs.length) {
              start = xs[k];
              prev = xs[k];
            }
          }
        }
      });
    }
    const wAttr = o.fluid ? `width="100%"` : `width="${layout.cols * cellH * 1.25}" height="${layout.rows * cellH}"`;
    const cls = o.className ? ` class="${esc(o.className)}"` : "";
    const aria = o.ariaHidden ? ` aria-hidden="true"` : "";
    return `<svg${cls} viewBox="0 0 ${vbW} ${vbH}" ${wAttr} shape-rendering="crispEdges" fill="${color}"${aria}>${rects}</svg>`;
  }

  // Pixel wipe overlay

  function playWipe(onFull) {
    if (!state.motionOn || wipeActive) {
      if (onFull) onFull();
      return;
    }
    const ctx = wipeCanvas.getContext("2d");
    if (!ctx) {
      if (onFull) onFull();
      return;
    }
    wipeActive = true;
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    wipeCanvas.width = Math.round(w * dpr);
    wipeCanvas.height = Math.round(h * dpr);
    wipeCanvas.classList.add("is-active");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cell = w >= 768 ? 48 : 32;
    const cols = Math.ceil(w / cell);
    const rows = Math.ceil(h / cell);
    const maxDiag = cols + rows - 2 || 1;
    const start = performance.now();
    let swapped = false;

    function step(now) {
      const elapsed = now - start;
      ctx.clearRect(0, 0, w, h);
      if (elapsed < 260) {
        const prog = elapsed / 260;
        const limit = prog * (maxDiag + 1);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (c + r <= limit) {
              ctx.fillStyle = TRACK_COLORS[(c + r) % 4];
              ctx.fillRect(c * cell, r * cell, cell, cell);
            }
          }
        }
      } else {
        if (!swapped) {
          swapped = true;
          if (onFull) onFull();
        }
        const prog = Math.min(1, (elapsed - 260) / 260);
        const limit = prog * (maxDiag + 1);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (c + r > limit) {
              ctx.fillStyle = TRACK_COLORS[(c + r) % 4];
              ctx.fillRect(c * cell, r * cell, cell, cell);
            }
          }
        }
        if (prog >= 1) {
          wipeCanvas.classList.remove("is-active");
          wipeActive = false;
          motion.remove(step);
          return;
        }
      }
    }

  function sizeTrailCanvas() {

    const ctx = trailCanvas.getContext("2d");
    if (!ctx) {
      trailRunning = false;
      motion.remove(tickTrail);
      return;
    }
    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    if (!state.motionOn) {
      trailCells = [];
      trailRunning = false;
      motion.remove(tickTrail);
      return;
    }
    const alive = [];
    for (let i = 0; i < trailCells.length; i++) {
      const c = trailCells[i];
      const age = now - c.born;
      if (age >= 420) continue;
      alive.push(c);
      ctx.fillStyle = c.color;
      if (age < 140) {
        ctx.fillRect(c.gx * 16, c.gy * 16, 16, 16);
      } else if (age < 280) {
        ctx.fillRect(c.gx * 16 + 4, c.gy * 16 + 4, 8, 8);
      } else {
        ctx.fillRect(c.gx * 16 + 6, c.gy * 16 + 6, 4, 4);
      }
    }
    trailCells = alive;
    if (trailCells.length === 0) {
      trailRunning = false;
      motion.remove(tickTrail);
    }
  }

      document.documentElement.classList.remove("menu-open");

      const reveal = () => {
        menuEl.classList.add("is-open");
        document.documentElement.classList.add("menu-open");
        openBtn.setAttribute("aria-expanded", "true");
        closeBtn.focus();
      };
      playWipe(reveal);
    }

    closeBtn.addEventListener("click", () => closeMenu(true));
    menuEl.addEventListener("click", e => {
      if (e.target.closest("a")) closeMenu(false);
    });
    menuEl.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        e.preventDefault();
        closeMenu(true);
        return;
      }
      if (e.key === "Tab") {
        const focusables = Array.from(menuEl.querySelectorAll("a, button")).filter(el => !el.hidden);
        if (focusables.length === 0) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();

  // Surface + reveal observers per route
  let surfaceHeaderIO = null;
  let surfaceBottomIO = null;
  let revealIO = null;

  function setupObservers() {
    if (surfaceHeaderIO) surfaceHeaderIO.disconnect();
    if (surfaceBottomIO) surfaceBottomIO.disconnect();
    if (revealIO) revealIO.disconnect();

    const header = document.getElementById("site-header");
    const topBtn = document.getElementById("top-btn");

    const surfaceEls = Array.from(document.querySelectorAll("[data-surface]")).filter(
      el => el.id !== "site-header" && el.id !== "menu" && el.id !== "top-btn"
    );

    const setHeaderSurface = surf => {
      if (surf) header.setAttribute("data-surface", surf);
    };
    const setBottomSurface = surf => {
      if (surf) {
        topBtn.setAttribute("data-surface", surf);
      }
    };

    const syncSurfacesAtScroll = () => {
      const hh = header.getBoundingClientRect().height || 64;
      const topY = hh + 4;
      const botY = window.innerHeight - 20;
      for (const el of surfaceEls) {
        const r = el.getBoundingClientRect();
        if (r.top <= topY && r.bottom >= topY) setHeaderSurface(el.getAttribute("data-surface"));
        if (r.top <= botY && r.bottom >= botY) setBottomSurface(el.getAttribute("data-surface"));
      }
      topBtn.classList.toggle("is-visible", window.scrollY >= window.innerHeight);
    };

    surfaceHeaderIO = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          setHeaderSurface(entry.target.getAttribute("data-surface"));
        }
      }
    }, { rootMargin: "-65px 0px -88% 0px" });

    surfaceBottomIO = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          setBottomSurface(entry.target.getAttribute("data-surface"));
        }
      }
    }, { rootMargin: "-95% 0px -1px 0px" });

    surfaceEls.forEach(el => {
      surfaceHeaderIO.observe(el);
      surfaceBottomIO.observe(el);
    });

    window.addEventListener("scroll", syncSurfacesAtScroll, { passive: true });
    state.routeCleanup.push(() => window.removeEventListener("scroll", syncSurfacesAtScroll));
    syncSurfacesAtScroll();

    // Stepped reveals
    const revealEls = Array.from(document.querySelectorAll(".reveal-text, .reveal-block"));
    if (!state.motionOn) {
      revealEls.forEach(el => {
        el.classList.remove("is-pending");
        el.classList.add("is-shown");
      });
    } else {
      revealEls.forEach(el => el.classList.add("is-pending"));
      revealIO = new IntersectionObserver(entries => {
        let batch = 0;
        for (const entry of entries) {
          if (entry.isIntersecting) {
            const el = entry.target;
            const delay = Math.min(batch, 7) * 40;
            batch++;
            window.setTimeout(() => {
              el.classList.remove("is-pending");
              el.classList.add("is-shown");
            }, delay);
            revealIO.unobserve(el);
          }
        }
      }, { threshold: 0.15 });
      revealEls.forEach(el => revealIO.observe(el));
    }
  }

  // Portrait Canvas Renderer (§3.R)
  function initPortraitCanvas(canvas, speaker, opts) {
    const o = opts || {};
    const rows = speaker.portrait.rows && speaker.portrait.rows.length === 32
      ? speaker.portrait.rows
      : fallbackPortraitRows(speaker.id);
    const pal = speaker.portrait.pal;

    let blockSize = o.blockSize || 1;
    let currentGrid = poolGrid(rows, blockSize);
    let assembled = !state.motionOn || Boolean(o.skipAssemble);
    let assembleStart = 0;
    let waveStart = 0;
    let waveDir = 0; // 0 = idle(0/1 normal), 1 = forward(swapping to 1/0), -1 = reversing
    let swapped = false;
    let animActive = false;
    let lastSize = 0;

    // Seeded shuffle of non-zero cells for assemble
    const rng = makeRng(hashStr(speaker.id));
    const fgIndices = [];
    for (let y = 0; y < 32; y++) {
      for (let x = 0; x < 32; x++) {
        if (currentGrid[y][x] !== "0") fgIndices.push(y * 32 + x);
      }
    }
    for (let i = fgIndices.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = fgIndices[i];
      fgIndices[i] = fgIndices[j];
      fgIndices[j] = tmp;
    }
    const orderRank = new Int16Array(1024).fill(-1);
    fgIndices.forEach((pos, idx) => {
      orderRank[pos] = idx;
    });

    function poolGrid(srcRows, bSize) {
      if (bSize <= 1) return srcRows;
      const out = [];
      for (let y = 0; y < 32; y += bSize) {
        const blockRows = [];
        for (let dy = 0; dy < bSize; dy++) blockRows.push("");
        for (let x = 0; x < 32; x += bSize) {
          const counts = [0, 0, 0, 0];
          for (let dy = 0; dy < bSize; dy++) {
            const r = srcRows[y + dy];
            for (let dx = 0; dx < bSize; dx++) {
              counts[Number(r[x + dx]) || 0]++;
            }
          }
          let bestIdx = 0;
          let bestCount = -1;
          for (let c = 0; c < 4; c++) {
            if (counts[c] > bestCount) {
              bestCount = counts[c];
              bestIdx = c;
            }
          }
          const ch = String(bestIdx);
          for (let dy = 0; dy < bSize; dy++) {
            blockRows[dy] += ch.repeat(bSize);
          }
        }
        for (let dy = 0; dy < bSize; dy++) out.push(blockRows[dy]);
      }
      return out;
    }

    function sizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const cssSize = Math.round(rect.width);
      if (cssSize <= 0 || cssSize === lastSize) return cssSize > 0;
      lastSize = cssSize;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(cssSize * dpr);
      canvas.height = Math.round(cssSize * dpr);
      const ctx = canvas.getContext("2d");
      if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return true;
    }

    function drawFrame(now) {
      const ctx = canvas.getContext("2d");
      if (!ctx || lastSize <= 0) return;
      const size = lastSize;
      const cell = Math.floor(size / 32);
      const gridPx = cell * 32;
      const ox = Math.floor((size - gridPx) / 2);
      const oy = Math.floor((size - gridPx) / 2);

      // Paint background including leftover margin
      ctx.fillStyle = pal[0];
      ctx.fillRect(0, 0, size, size);

      let assembleLimit = fgIndices.length;
      if (!assembled) {
        const elapsed = now - assembleStart;
        const p = Math.min(1, Math.max(0, elapsed / 640));
        assembleLimit = Math.floor(p * fgIndices.length);
        if (p >= 1) assembled = true;
      }

      let waveElapsed = -1;
      let waveDone = true;
      if (waveDir !== 0) {
        waveElapsed = now - waveStart;
        if (waveElapsed < 360) waveDone = false;
        else {
          swapped = waveDir === 1;
          waveDir = 0;
        }
      }

      let sweepElapsed = -1;
      let sweepDone = true;
      if (sweepActive) {
        sweepElapsed = now - sweepStart;
        if (sweepElapsed < 200) sweepDone = false;
        else sweepActive = false;
      }

      // Draw merged horizontal runs per row
      for (let y = 0; y < 32; y++) {
        let runStart = 0;
        let runIdx = -1;
        for (let x = 0; x <= 32; x++) {
          let idx = 0;
          if (x < 32) {
            const useOld = sweepActive && !sweepDone && ((x + y) / 62) * 200 > sweepElapsed;
            const srcGrid = useOld ? prevGrid : currentGrid;
            const raw = Number(srcGrid[y][x]) || 0;
            if (!assembled && raw !== 0) {
              const rank = orderRank[y * 32 + x];
              idx = rank < assembleLimit ? raw : 0;
            } else {
              idx = raw;
            }
            // Apply palette swap wave (0 <-> 1)
            let isSwapped = swapped;
            if (waveDir !== 0) {
              const threshold = ((x + y) / 62) * 360;
              if (waveDir === 1) isSwapped = waveElapsed >= threshold;
              else isSwapped = waveElapsed < threshold;
            }
            if (isSwapped && (idx === 0 || idx === 1)) {
              idx = idx === 0 ? 1 : 0;
            }
          }
          if (x === 0) {
            runIdx = idx;
            runStart = 0;
          } else if (x === 32 || idx !== runIdx) {
            if (runIdx !== 0 || swapped || waveDir !== 0) {
              ctx.fillStyle = pal[runIdx];
              ctx.fillRect(ox + runStart * cell, oy + y * cell, (x - runStart) * cell, cell);
            }
            runStart = x;
            runIdx = idx;
          }
        }
      }

      if (assembled && waveDone && sweepDone) {
        animActive = false;
        motion.remove(drawFrame);
      }
    }

    let prevGrid = currentGrid;
    let sweepActive = false;
    let sweepStart = 0;

    function startAnim() {
      if (!animActive) {
        animActive = true;
        motion.add(drawFrame);
      }
    }

    function renderImmediate() {
      if (sizeCanvas()) drawFrame(performance.now());
    }

    // Observe first view assemble
    const io = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          io.disconnect();
          sizeCanvas();
          if (!state.motionOn || o.skipAssemble) {
            assembled = true;
            drawFrame(performance.now());
          } else {
            assembled = false;
            assembleStart = performance.now();
            startAnim();
          }
        }
      }
    }, { threshold: 0.3 });
    io.observe(canvas);

    // ResizeObserver (debounced 150ms)
    let rTimer = 0;
    const ro = new ResizeObserver(() => {
      window.clearTimeout(rTimer);
      rTimer = window.setTimeout(() => {
        const prev = lastSize;
        sizeCanvas();
        if (lastSize !== prev) drawFrame(performance.now());
      }, 150);
    });
    ro.observe(canvas);

    // Hover / focus swap on (hover: hover)
    const hoverTarget = canvas.closest("a") || canvas;
    if (window.matchMedia && window.matchMedia("(hover: hover)").matches) {
      const triggerSwap = toSwapped => {
        if (!state.motionOn) {
          swapped = toSwapped;
          waveDir = 0;
          drawFrame(performance.now());
          return;
        }
        waveDir = toSwapped ? 1 : -1;
        waveStart = performance.now();
        startAnim();
      };
      hoverTarget.addEventListener("mouseenter", () => triggerSwap(true));
      hoverTarget.addEventListener("mouseleave", () => triggerSwap(false));
      hoverTarget.addEventListener("focusin", () => triggerSwap(true));
      hoverTarget.addEventListener("focusout", () => triggerSwap(false));
    }

    const onMotionChange = () => {
      if (!state.motionOn) {
        assembled = true;
        sweepActive = false;
        waveDir = 0;
        swapped = false;
        renderImmediate();
      }
    };
    window.addEventListener("ieafl:motionchange", onMotionChange);

    state.routeCleanup.push(() => {
      io.disconnect();
      ro.disconnect();
      window.clearTimeout(rTimer);
      motion.remove(drawFrame);
      window.removeEventListener("ieafl:motionchange", onMotionChange);
    });

    // Initial paint
    window.requestAnimationFrame(renderImmediate);

    return {
      setBlockSize(newSize) {
        if (newSize === blockSize) return;
        prevGrid = currentGrid;
        blockSize = newSize;
        currentGrid = poolGrid(rows, blockSize);
        if (!state.motionOn) {
          sweepActive = false;
          drawFrame(performance.now());
        } else {
          sweepActive = true;
          sweepStart = performance.now();
          startAnim();
        }
      }
    };
  }

  // Capacity Grid Component (L8 & Passes)
  function buildCapacityGrid(container, opts) {
    const o = opts || {};
    const three = DATA.tickets[0];
    const day = DATA.tickets[1];
    const comm = DATA.tickets[2];
    const total = DATA.meta.capacity;
    const isMobile = window.innerWidth < 768;
    const cols = isMobile ? 20 : 40;
    const rows = Math.ceil(total / cols);
    const gap = window.innerWidth >= 1024 ? 2 : 1;
    const cell = 10;
    const step = cell + gap;
    const vbW = cols * step - gap;
    const vbH = rows * step - gap;

    const cellsMeta = [];
    for (let i = 0; i < total; i++) {
      let tier = "open";
      let color = DATA.tokens.sodium;
      let label = `Item ${i + 1} of ${total} · open custom bank slot`;
      if (i < three.sold) {
        tier = "three-day";
        color = three.color;
        label = `Item ${i + 1} of ${total} · Reading & Listening bank, built-in`;
      } else if (i < three.sold + day.sold) {
        tier = "day";
        color = day.color;
        label = `Item ${i + 1} of ${total} · Writing Task 1 & 2 prompt, built-in`;
      } else if (i < three.sold + day.sold + comm.sold) {
        tier = "community";
        color = comm.color;
        label = `Item ${i + 1} of ${total} · Speaking Parts 1–3 bank, built-in`;
      }
      cellsMeta.push({ idx: i, tier, color, label });
    }

    const soldTotal = three.sold + day.sold + comm.sold;
    const openTotal = total - soldTotal;

    let rects = "";
    for (let i = 0; i < total; i++) {
      const c = i % cols;
      const r = Math.floor(i / cols);
      const x = c * step;
      const y = r * step;
      const m = cellsMeta[i];
      if (m.tier === "open") {
        rects += `<rect data-ci="${i}" x="${x + 0.5}" y="${y + 0.5}" width="${cell - 1}" height="${cell - 1}" fill="${DATA.tokens.sodium}" stroke="${DATA.tokens.ink}" stroke-width="1"/>`;
      } else {
        rects += `<rect data-ci="${i}" x="${x}" y="${y}" width="${cell}" height="${cell}" fill="${DATA.tokens.sodium}" stroke="${DATA.tokens.ink}" stroke-width="1"/>`;
      }
    }

    container.innerHTML = `
      <figure class="capacity-fig">
        <div class="capacity-svg-wrap" tabindex="0" role="img" aria-label="Practice bank grid: ${soldTotal} of ${total} Cambridge-style items ready, ${openTotal} custom admin slots open. Use arrow keys to inspect cells.">
          <svg class="capacity-svg" viewBox="0 0 ${vbW} ${vbH}" shape-rendering="crispEdges" aria-hidden="true">${rects}<rect id="cap-focus-ring" x="0" y="0" width="${cell}" height="${cell}" fill="none" stroke="${DATA.tokens.ink}" stroke-width="2" visibility="hidden"/></svg>
        </div>
        <figcaption class="t-micro" style="margin-top:8px;">(Fig. 1 — Practice bank: ${total} cells, one per test item or custom admin slot.)</figcaption>
        <ul class="capacity-legend t-micro">
          <li class="legend-item"><span class="legend-swatch" style="background:${three.color}"></span>Reading &amp; Listening bank, ${three.sold} built-in</li>
          <li class="legend-item"><span class="legend-swatch" style="background:${day.color}"></span>Writing Task 1 &amp; 2 prompts, ${day.sold} built-in</li>
          <li class="legend-item"><span class="legend-swatch" style="background:${comm.color}"></span>Speaking Parts 1–3 banks, ${comm.sold} built-in</li>
          <li class="legend-item"><span class="legend-swatch" style="background:${DATA.tokens.sodium}"></span>Custom admin slots, ${openTotal} open</li>
          ${o.withSelection ? `<li class="legend-item"><span class="legend-swatch" style="background:${DATA.tokens.ink}"></span>Selected</li>` : ""}
        </ul>
      </figure>
    `;

    const svg = container.querySelector(".capacity-svg");
    const wrap = container.querySelector(".capacity-svg-wrap");
    const focusRing = svg.querySelector("#cap-focus-ring");
    const rectEls = Array.from(svg.querySelectorAll("rect[data-ci]"));
    let filledCount = 0;
    let selectedOverlay = 0;

    function paintCell(i, isSelected) {
      const m = cellsMeta[i];
      const el = rectEls[i];
      if (!el) return;
      if (isSelected) {
        el.setAttribute("fill", DATA.tokens.ink);
        el.removeAttribute("stroke");
      } else if (m.tier === "open" || i >= filledCount) {
        el.setAttribute("fill", DATA.tokens.sodium);
        el.setAttribute("stroke", DATA.tokens.ink);
        el.setAttribute("stroke-width", "1");
      } else {
        el.setAttribute("fill", m.color);
        el.removeAttribute("stroke");
      }
    }

    function fillImmediate() {
      filledCount = soldTotal;
      for (let i = 0; i < soldTotal; i++) paintCell(i, false);
      for (let i = soldTotal; i < total; i++) {
        paintCell(i, i - soldTotal < selectedOverlay);
      }
    }

    // Fill animation when 30% visible
    let fillAnimRunning = false;
    function tickFill() {
      const nextEnd = Math.min(soldTotal, filledCount + 6);
      for (let i = filledCount; i < nextEnd; i++) {
        filledCount = i + 1;
        paintCell(i, false);
      }
      if (filledCount >= soldTotal) {
        fillAnimRunning = false;
        motion.remove(tickFill);
      }
    }

    if (!state.motionOn || o.instant) {
      fillImmediate();
    } else {
      const io = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            io.disconnect();
            if (!state.motionOn) {
              fillImmediate();
            } else if (!fillAnimRunning) {
              fillAnimRunning = true;
              motion.add(tickFill);
            }
          }
        }
      }, { threshold: 0.3 });
      io.observe(svg);
      state.routeCleanup.push(() => {
        io.disconnect();
        motion.remove(tickFill);
      });
    }

    // Mouse tooltip
    svg.addEventListener("pointermove", e => {
      const rectEl = e.target.closest("rect[data-ci]");
      if (!rectEl) {
        hideTip();
        return;
      }
      const idx = Number(rectEl.dataset.ci);
      const isSel = idx >= soldTotal && (idx - soldTotal) < selectedOverlay;
      const msg = isSel ? `Slot ${idx + 1} of ${total} · selected for workspace` : cellsMeta[idx].label;
      showTip(rectEl.getBoundingClientRect(), msg, false);
    });
    svg.addEventListener("pointerleave", hideTip);

    // Keyboard arrow cell focus
    let keyIdx = 0;
    const showKeyCell = () => {
      const c = keyIdx % cols;
      const r = Math.floor(keyIdx / cols);
      focusRing.setAttribute("x", String(c * step - 1));
      focusRing.setAttribute("y", String(r * step - 1));
      focusRing.setAttribute("width", String(cell + 2));
      focusRing.setAttribute("height", String(cell + 2));
      focusRing.setAttribute("visibility", "visible");
      const isSel = keyIdx >= soldTotal && (keyIdx - soldTotal) < selectedOverlay;
      const msg = isSel ? `Slot ${keyIdx + 1} of ${total} · selected for workspace` : cellsMeta[keyIdx].label;
      showTip(rectEls[keyIdx].getBoundingClientRect(), msg, true);
    };

    wrap.addEventListener("focus", showKeyCell);
    wrap.addEventListener("blur", () => {
      focusRing.setAttribute("visibility", "hidden");
      hideTip();
    });
    wrap.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") keyIdx = Math.min(total - 1, keyIdx + 1);
      else if (e.key === "ArrowLeft") keyIdx = Math.max(0, keyIdx - 1);
      else if (e.key === "ArrowDown") keyIdx = Math.min(total - 1, keyIdx + cols);
      else if (e.key === "ArrowUp") keyIdx = Math.max(0, keyIdx - cols);
      else return;
      e.preventDefault();
      showKeyCell();
    });

    let selTimer = 0;
    return {
      setSelected(count) {
        window.clearInterval(selTimer);
        if (!state.motionOn) {
          selectedOverlay = count;
          for (let i = soldTotal; i < total; i++) {
            paintCell(i, i - soldTotal < selectedOverlay);
          }
          return;
        }
        if (count === selectedOverlay) return;
        selTimer = window.setInterval(() => {
          if (selectedOverlay < count) {
            selectedOverlay++;
            paintCell(soldTotal + selectedOverlay - 1, true);
          } else if (selectedOverlay > count) {
            paintCell(soldTotal + selectedOverlay - 1, false);
            selectedOverlay--;
          }
          if (selectedOverlay === count) window.clearInterval(selTimer);
        }, 30);
      }
    };
  }

  // L1 Hero Particle Canvas
  function initHeroCanvas() {
    const canvas = document.getElementById("hero-canvas");
    const captionEl = document.getElementById("hero-cycle-caption");
    const ctx = canvas.getContext("2d");
    if (!ctx) return;

    let cssW = 0, cssH = 0, dpr = 1;
    let isMobile = window.innerWidth < 768;
    let cycleIdx = 0;
    let particles = [];
    let morphStart = 0;
    let morphDuration = 1200;
    let isAssembling = true;
    let holdTimer = 0;
    let inView = true;
    let running = false;
    let pointerX = -9999, pointerY = -9999;

    function getTargetLayout(idx) {
      const item = DATA.copy.heroCycle[idx];
      const lines = isMobile ? item.mobile : [item.desktop];
      const layout = layoutGlyphLines(lines, 2, true);
      return {
        totalCols: isMobile ? 31 : 39,
        totalRows: isMobile ? 20 : 9,
        cells: layout.cells
      };
    }

    function sizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      isMobile = window.innerWidth < 768;
      cssW = rect.width;
      cssH = rect.height;
      if (cssW <= 0 || cssH <= 0) return;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function buildParticlesForTarget(idx, assembleFromRandom) {
      const t = getTargetLayout(idx);
      const rng = makeRng(hashStr("hero-" + idx + "-" + Date.now()));
      const newParticles = [];
      const targetCells = t.cells;
      const oldParticles = particles;

      if (assembleFromRandom || oldParticles.length === 0) {
        for (let i = 0; i < targetCells.length; i++) {
          const tc = targetCells[i];
          newParticles.push({
            sx: assembleFromRandom ? rng() * t.totalCols : tc.x,
            sy: assembleFromRandom ? rng() * t.totalRows : tc.y,
            tx: tc.x,
            ty: tc.y,
            x: tc.x,
            y: tc.y,
            vx: 0,
            vy: 0,
            delay: assembleFromRandom ? rng() * 400 : 0,
            color: DATA.tokens.ink,
            sparkle: false
          });
        }
        isAssembling = assembleFromRandom;
        morphDuration = 1200;
      } else {
        const count = Math.max(oldParticles.length, targetCells.length);
        for (let i = 0; i < count; i++) {
          const src = oldParticles[i % oldParticles.length];
          const dst = targetCells[i % targetCells.length];
          const isSparkle = rng() < 0.12;
          newParticles.push({
            sx: src.x,
            sy: src.y,
            tx: dst.x,
            ty: dst.y,
            x: src.x,
            y: src.y,
            vx: 0,
            vy: 0,
            delay: (dst.x / t.totalCols) * 300,
            color: isSparkle ? TRACK_COLORS[Math.floor(rng() * 4)] : DATA.tokens.ink,
            sparkle: isSparkle
          });
        }
        isAssembling = false;
        morphDuration = 900;
      }
      particles = newParticles;
      morphStart = performance.now();
      captionEl.textContent = DATA.copy.heroCycle[idx].caption;
    }

    function drawStatic() {
      sizeCanvas();
      if (cssW <= 0) return;
      const t = getTargetLayout(0);
      const cellW = cssW / t.totalCols;
      const cellH = cellW / 1.25;
      ctx.fillStyle = DATA.tokens.sodium;
      ctx.fillRect(0, 0, cssW, cssH);
      ctx.fillStyle = DATA.tokens.ink;
      for (let i = 0; i < t.cells.length; i++) {
        const c = t.cells[i];
        const x0 = Math.round(c.x * cellW * dpr) / dpr;
        const y0 = Math.round(c.y * cellH * dpr) / dpr;
        const x1 = Math.round((c.x + 1) * cellW * dpr) / dpr;
        const y1 = Math.round((c.y + 1) * cellH * dpr) / dpr;
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
      captionEl.textContent = DATA.copy.heroCycle[0].caption;
    }

    function step(now) {
      if (!state.motionOn) {
        running = false;
        motion.remove(step);
        drawStatic();
        return;
      }
      if (cssW <= 0) sizeCanvas();
      if (cssW <= 0) return;

      const t = getTargetLayout(cycleIdx);
      const cellW = cssW / t.totalCols;
      const cellH = cellW / 1.25;
      const elapsed = now - morphStart;
      const easeFn = isAssembling ? easeAssemble : easeMorph;
      const repelRadius = cellW * 3;
      const maxDisp = 1.5;

      ctx.fillStyle = DATA.tokens.sodium;
      ctx.fillRect(0, 0, cssW, cssH);

      // Group draws by colour (ink vs sparkles)
      const buckets = new Map();
      buckets.set(DATA.tokens.ink, []);
      let allSettled = pointerX < -5000;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const localT = Math.min(1, Math.max(0, (elapsed - p.delay) / morphDuration));
        const e = easeFn(localT);
        const baseX = p.sx + (p.tx - p.sx) * e;
        const baseY = p.sy + (p.ty - p.sy) * e;

        // Cursor repel spring
        let targetDx = 0, targetDy = 0;
        if (pointerX > -5000) {
          const px = (baseX + 0.5) * cellW;
          const py = (baseY + 0.5) * cellH;
          const dx = px - pointerX;
          const dy = py - pointerY;
          const dist = Math.hypot(dx, dy);
          if (dist > 0.001 && dist < repelRadius) {
            const push = (1 - dist / repelRadius) * maxDisp;
            targetDx = (dx / dist) * push;
            targetDy = (dy / dist) * push;
          }
        }
        if (localT >= 1 && pointerX < -5000) {
          p.vx = 0;
          p.vy = 0;
          p.x = p.tx;
          p.y = p.ty;
        } else {
          allSettled = false;
          p.vx = (p.vx + (targetDx - (p.x - baseX)) * 0.12) * 0.8;
          p.vy = (p.vy + (targetDy - (p.y - baseY)) * 0.12) * 0.8;
          p.x = baseX + (p.x - baseX) + p.vx;
          p.y = baseY + (p.y - baseY) + p.vy;
        }

        const col = (p.sparkle && elapsed < 400) ? p.color : DATA.tokens.ink;
        if (!buckets.has(col)) buckets.set(col, []);
        buckets.get(col).push(p);
      }

      if (allSettled && elapsed >= 400) {
        // Draw merged horizontal runs per row for zero-seam rendering at any DPR
        ctx.fillStyle = DATA.tokens.ink;
        const rowMap = new Map();
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          if (!rowMap.has(p.ty)) rowMap.set(p.ty, []);
          rowMap.get(p.ty).push(p.tx);
        }
        rowMap.forEach((xs, y) => {
          xs.sort((a, b) => a - b);
          let start = xs[0], prev = xs[0];
          const y0 = Math.round(y * cellH * dpr) / dpr;
          const y1 = Math.round((y + 1) * cellH * dpr) / dpr;
          for (let k = 1; k <= xs.length; k++) {
            if (k < xs.length && (xs[k] === prev + 1 || xs[k] === prev)) {
              prev = xs[k];
            } else {
              const x0 = Math.round(start * cellW * dpr) / dpr;
              const x1 = Math.round((prev + 1) * cellW * dpr) / dpr;
              ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
              if (k < xs.length) {
                start = xs[k];
                prev = xs[k];
              }
            }
          }
        });
      } else {
        buckets.forEach((list, col) => {
          ctx.fillStyle = col;
          for (let i = 0; i < list.length; i++) {
            const p = list[i];
            const x0 = Math.round(p.x * cellW * dpr) / dpr;
            const y0 = Math.round(p.y * cellH * dpr) / dpr;
            const x1 = Math.round((p.x + 1) * cellW * dpr) / dpr;
            const y1 = Math.round((p.y + 1) * cellH * dpr) / dpr;
            ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
          }
        });
      }
    }

    function scheduleNext() {
      window.clearTimeout(holdTimer);
      if (!state.motionOn || !inView) return;
      holdTimer = window.setTimeout(() => {
        if (!state.motionOn || !inView || document.hidden) return;
        cycleIdx = (cycleIdx + 1) % DATA.copy.heroCycle.length;
        buildParticlesForTarget(cycleIdx, false);
        scheduleNext();
      }, 3200 + morphDuration);
    }

    function startLoop() {
      if (!state.motionOn) {
        drawStatic();
        return;
      }
      if (!running) {
        running = true;
        motion.add(step);
      }
      scheduleNext();
    }

    function stopLoop() {
      window.clearTimeout(holdTimer);
      if (running) {
        running = false;
        motion.remove(step);
      }
    }

    sizeCanvas();
    if (state.motionOn) {
      buildParticlesForTarget(0, true);
      startLoop();
    } else {
      drawStatic();
    }

    canvas.addEventListener("click", () => {
      if (!state.motionOn) return;
      cycleIdx = (cycleIdx + 1) % DATA.copy.heroCycle.length;
      buildParticlesForTarget(cycleIdx, false);
      scheduleNext();
    });

    if (window.matchMedia && window.matchMedia("(pointer: fine)").matches) {
      canvas.addEventListener("pointermove", e => {
        const r = canvas.getBoundingClientRect();
        pointerX = e.clientX - r.left;
        pointerY = e.clientY - r.top;
      }, { passive: true });
      canvas.addEventListener("pointerleave", () => {
        pointerX = -9999;
        pointerY = -9999;
      });
    }

    const io = new IntersectionObserver(entries => {
      for (const entry of entries) {
        inView = entry.intersectionRatio >= 0.1;
        if (inView && state.motionOn) startLoop();
        else stopLoop();
      }
    }, { threshold: [0, 0.1] });
    io.observe(canvas);

    let rTimer = 0;
    const ro = new ResizeObserver(() => {
      window.clearTimeout(rTimer);
      rTimer = window.setTimeout(() => {
        const wasMob = isMobile;
        sizeCanvas();
        if (!state.motionOn) drawStatic();
        else if (wasMob !== isMobile) buildParticlesForTarget(cycleIdx, false);
      }, 150);
    });
    ro.observe(canvas);

    const onMotionChange = () => {
      if (state.motionOn) {
        cycleIdx = 0;
        buildParticlesForTarget(0, true);
        startLoop();
      } else {
        stopLoop();
        drawStatic();
      }
    };
    window.addEventListener("ieafl:motionchange", onMotionChange);

    state.routeCleanup.push(() => {
      stopLoop();
      io.disconnect();
      ro.disconnect();
      window.clearTimeout(rTimer);
      window.removeEventListener("ieafl:motionchange", onMotionChange);
    });
  }

  // L3a Stats + Countdown
  function initStatsAndCountdown() {
    const statsWrap = document.getElementById("stats-items");
    const statsData = [
      { val: DATA.tracks.length, label: "exam skills" },
      { val: DATA.meta.rooms, label: "app routes" },
      { val: DATA.speakers.length, label: "core engines" },
      { val: DATA.examFormats.length, label: "official task types" },
      { val: DATA.meta.bandMax, label: "band ceiling" }
    ];

    statsWrap.innerHTML = statsData.map((s, idx) => `
      <div class="stat-item" data-sidx="${idx}">
        <div class="stat-glyph">${svgBitmapText(String(s.val).padStart(2, "0"), 10, DATA.tokens.sodium, { className: "stat-svg", ariaHidden: true, bold: true })}</div>
        <p class="t-small t-sodium stat-label">${esc(s.label)}</p>
      </div>
    `).join("");

    // Count up once when 50% visible
    if (state.motionOn) {
      const io = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            io.disconnect();
            statsData.forEach((s, idx) => {
              const box = statsWrap.querySelector(`[data-sidx="${idx}"] .stat-glyph`);
              if (!box) return;
              window.setTimeout(() => {
                let step = 0;
                const timer = window.setInterval(() => {
                  step++;
                  const cur = step >= 12 ? s.val : Math.round((s.val * step) / 12);
                  box.innerHTML = svgBitmapText(String(cur).padStart(2, "0"), 10, DATA.tokens.sodium, { className: "stat-svg", ariaHidden: true, bold: true });
                  if (step >= 12) window.clearInterval(timer);
                }, 100);
              }, idx * 80);
            });
          }
        }
      }, { threshold: 0.5 });
      io.observe(statsWrap);
      state.routeCleanup.push(() => io.disconnect());
    }

    // Countdown (45-day study cycle target)
    const cdWrap = document.getElementById("countdown-wrap");
    const srEl = document.getElementById("countdown-sr");
    const targetMs = Date.now() + (DATA.meta.examCycleDays * 86400 + 6 * 3600 + 42 * 60 + 18) * 1000;
    let cdTimer = 0;
    let lastMinuteText = "";

    function cdCellH() {
      const w = window.innerWidth;
      const avail = cdWrap.clientWidth || (w - 48);
      let target = 5;
      if (w >= 1440) target = 12;
      else if (w >= 1024) target = 10;
      else if (w >= 768) target = 8;
      else if (w >= 390) target = 6;
      if (w >= 768) {
        const maxFit = Math.floor((avail / (81 * 1.25)) * 2) / 2;
        return Math.max(4, Math.min(target, maxFit));
      }
      return target;
    }

    function renderCountdown() {
      const diff = Math.max(0, targetMs - Date.now());
      const totalSec = Math.floor(diff / 1000);
      const d = Math.floor(totalSec / 86400);
      const h = Math.floor((totalSec % 86400) / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const ch = cdCellH();
      const parts = [
        { val: String(d).padStart(3, "0"), label: "days", sep: ":" },
        { val: String(h).padStart(2, "0"), label: "hours", sep: window.innerWidth < 768 ? "" : ":" },
        { val: String(m).padStart(2, "0"), label: "minutes", sep: ":" },
        { val: String(s).padStart(2, "0"), label: "seconds", sep: "" }
      ];

      if (window.innerWidth < 768) {
        cdWrap.innerHTML = `
          <div class="countdown-row">
            <div class="cd-pair">
              <div class="cd-group">${svgBitmapText(parts[0].val, ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}<span class="t-micro cd-group-label">${parts[0].label}</span></div>
              <div style="margin:0 4px;">${svgBitmapText(":", ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}</div>
              <div class="cd-group">${svgBitmapText(parts[1].val, ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}<span class="t-micro cd-group-label">${parts[1].label}</span></div>
            </div>
            <div class="cd-pair" style="width:100%;">
              <div class="cd-group">${svgBitmapText(parts[2].val, ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}<span class="t-micro cd-group-label">${parts[2].label}</span></div>
              <div style="margin:0 4px;">${svgBitmapText(":", ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}</div>
              <div class="cd-group">${svgBitmapText(parts[3].val, ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}<span class="t-micro cd-group-label">${parts[3].label}</span></div>
            </div>
          </div>
          ${diff === 0 ? `<p class="t-small t-sodium" style="margin-top:16px;">${esc(DATA.copy.countdownOver)}</p>` : ""}
        `;
      } else {
        cdWrap.innerHTML = `
          <div class="countdown-row">
            ${parts.map((pt, i) => `
              <div class="cd-pair">
                <div class="cd-group">
                  ${svgBitmapText(pt.val, ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}
                  <span class="t-micro cd-group-label">${pt.label}</span>
                </div>
                ${i < 3 ? `<div style="margin:0 ${Math.floor(ch * 0.8)}px;">${svgBitmapText(":", ch, DATA.tokens.sodium, { ariaHidden: true, bold: true })}</div>` : ""}
              </div>
            `).join("")}
          </div>
          ${diff === 0 ? `<p class="t-small t-sodium" style="margin-top:16px;">${esc(DATA.copy.countdownOver)}</p>` : ""}
        `;
      }

      const minText = `${d} days, ${h} hours, ${m} minutes until target exam date`;
      if (minText !== lastMinuteText) {
        lastMinuteText = minText;
        srEl.textContent = minText;
      }

      const msToNext = 1000 - (Date.now() % 1000) + 10;
      cdTimer = window.setTimeout(renderCountdown, msToNext);
    }

    renderCountdown();
    const onResize = () => {
      window.clearTimeout(cdTimer);
      renderCountdown();
    };
    window.addEventListener("resize", onResize, { passive: true });
    state.routeCleanup.push(() => {
      window.clearTimeout(cdTimer);
      window.removeEventListener("resize", onResize);
    });
  }

  // L4 Track Panels (Ref B)
  function initTrackPanels() {
    const grid = document.getElementById("tracks-grid");

    const weavePlus = (x, y, phase) => {
      const px = (x + phase) % 6;
      const py = (y + phase) % 6;
      const inA = (px === 1 && py <= 2) || (py === 1 && px <= 2);
      const inB = (px === 4 && py >= 3) || (py === 4 && px >= 3);
      return (inA || inB) ? 1 : 0;
    };

    const weaveCross = (x, y, phase) => {
      const px = (x + phase) % 4;
      const py = (y + phase) % 4;
      return (px === 1 || py === 1) ? 1 : 0;
    };

    const weaveTartan = (x, y, phase) => {
      const px = (x + phase) % 4;
      const py = (y + phase) % 4;
      return ((px < 2) !== (py < 2) || (px === 1 && py === 1)) ? 1 : 0;
    };

    const weaveBasket = (x, y, phase) => {
      const px = (x + phase) % 4;
      const py = (y + phase) % 4;
      const block = ((Math.floor((x + phase) / 4) + Math.floor((y + phase) / 4)) % 2) === 0;
      return block ? (py % 2 === 0 ? 1 : 0) : (px % 2 === 0 ? 1 : 0);
    };

    const PANEL_STYLES = {
      reading: {
        colA: "#F3ACF0",
        colB: "#FF5A36",
        band: "#F3ACF0",
        weave: weavePlus
      },
      listening: {
        colA: "#18B47E",
        colB: "#2370E8",
        band: "#18B47E",
        weave: weaveCross
      },
      writing: {
        colA: "#F5B700",
        colB: "#FF5A36",
        band: "#F5B700",
        weave: weaveBasket
      },
      speaking: {
        colA: "#A98BF7",
        colB: "#2370E8",
        band: "#A98BF7",
        weave: weaveTartan
      }
    };

    grid.innerHTML = DATA.tracks.map(t => {
      const count = examFormatsByTrack(t.id).length;
      const unit = t.id === "speaking" ? "exam parts" : t.id === "writing" ? "official tasks" : "official task types";
      const aria = `${t.label} skill: ${count} ${unit}. Open official IELTS exam format filtered by ${t.label}.`;
      const style = PANEL_STYLES[t.id];
      return `
        <div class="track-fig">
          <button type="button" class="track-panel-btn" data-track="${esc(t.id)}" style="--track-band:${style.band}" aria-label="${esc(aria)}">
            <svg class="track-panel-svg" viewBox="0 0 80 72" shape-rendering="crispEdges" aria-hidden="true"></svg>
            <div class="track-card-body">
              <div>
                <p class="track-card-title">${esc(t.label)}</p>
                <p class="t-small track-card-desc">${esc(t.desc)}</p>
              </div>
              <div class="track-card-foot">
                <span class="t-micro">${count} ${unit}</span>
                <svg class="track-card-arrow" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                  <path d="M2 12L12 2M12 2H4M12 2V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/>
                </svg>
              </div>
            </div>
          </button>
        </div>
      `;
    }).join("");

    const controllers = [];
    DATA.tracks.forEach(t => {
      const btn = grid.querySelector(`.track-panel-btn[data-track="${t.id}"]`);
      const svg = btn.querySelector(".track-panel-svg");
      const panel = PANEL_STYLES[t.id];
      const cell = 4;
      const cols = 20;
      const rows = 18;
      let busy = false;
      let animTimer = 0;

      function drawGrid(phase) {
        let out = `<rect x="0" y="0" width="${cols * cell}" height="${rows * cell}" fill="${panel.colA}"/>`;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            if (panel.weave(x, y, phase) === 1) {
              out += `<rect x="${x * cell}" y="${y * cell}" width="${cell}" height="${cell}" fill="${panel.colB}"/>`;
            }
          }
        }
        svg.innerHTML = out;
      }

      drawGrid(0);

      function play() {
        if (!state.motionOn || busy) return;
        busy = true;
        let step = 0;
        animTimer = window.setInterval(() => {
          step++;
          drawGrid(step % 6);
          if (step >= 6) {
            window.clearInterval(animTimer);
            drawGrid(0);
            busy = false;
          }
        }, 90);
      }

      btn.addEventListener("mouseenter", play);
      btn.addEventListener("focus", play);
      btn.addEventListener("click", () => {
        state.talksFilter.tracks = [t.id];
        state.talksFilter.types = [];
        state.talksFilter.query = "";
        state.talksFilter.openId = null;
        window.location.hash = "#/formats";
      });

      const io = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            io.disconnect();
            play();
          }
        }
      }, { threshold: 0.4 });
      io.observe(btn);

      state.routeCleanup.push(() => {
        io.disconnect();
        window.clearInterval(animTimer);
        window.clearTimeout(animTimer);
      });

      controllers.push(play);
    });

    const idleTimer = window.setInterval(() => {
      if (!state.motionOn || document.hidden) return;
      const fn = controllers[Math.floor(Math.random() * controllers.length)];
      if (fn) fn();
    }, 6000);
    state.routeCleanup.push(() => window.clearInterval(idleTimer));
  }

                }
                const s = it.rec;
                const r = roomById(s.room);
