                return `<tr>
                  <td data-label="Time" class="t-small tnum">${fmtTime(s.start)}–${fmtTime(s.end)}</td>
                  <td data-label="Workspace" class="t-small">${esc(r.name)}</td>
                  <td data-label="Category" class="t-small">${esc(s.type)}</td>
                  <td data-label="Format" class="t-small fw-600"><a class="u-anim" href="#/formats/${esc(s.id)}">${esc(s.title)}</a>${clash ? ` <span class="clash-chip t-micro">Overlap</span>` : ""}</td>
                  <td data-label="Engines" class="t-small">${spks}</td>
                  <td data-label="Skill" class="t-small"><span class="track-chip track-chip-${esc(s.track)}">${esc(tr.label)}</span></td>
                  <td data-label="Plan" class="t-small">
                    <button type="button" class="tl-agenda-btn" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}" aria-label="${added ? "Remove" : "Add"} ${esc(s.title)} ${added ? "from" : "to"} my study plan">${svgPixelIcon(added ? "check" : "plus", 14)}</button>
                  </td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        `;
      } else if (window.innerWidth < 768) {
        // Mobile chronological list
        const items = [];
        filtered.forEach(s => items.push({ kind: "session", start: s.start, rec: s }));
        breaks.forEach(b => items.push({ kind: "break", start: b.start, rec: b }));
        items.sort((a, b) => timeToMin(a.start) - timeToMin(b.start));

        bodyEl.innerHTML = `<div class="schedule-mobile-list">
          ${items.map((it, idx) => {
            if (it.kind === "break") {
              const b = it.rec;
              const r = roomById(b.room);
              return `<div class="tl-break t-micro"><span>${fmtTime(b.start)}–${fmtTime(b.end)} · ${esc(b.title)}</span><span>${esc(r.name)}</span></div>`;
            }
            const s = it.rec;
            const r = roomById(s.room);
            const added = state.agenda.includes(s.id);
            const clash = hasClash(s);
            const spks = s.speakers.map(id => speakerById(id).name).join(", ");
            const stagger = animateEntrance && state.motionOn ? ` style="transition-delay:${Math.min(idx, 7) * 40}ms"` : "";
            return `<article class="tl-session${added ? " is-added" : ""}${clash ? " is-clash" : ""}" data-track="${esc(s.track)}" data-sid="${esc(s.id)}"${stagger}>
              <div class="tl-session-top">
                <div>
                  <div class="t-micro tnum">${fmtTime(s.start)}–${fmtTime(s.end)} · ${esc(s.type)} · ${esc(r.name)}</div>
                  <h2 class="t-small fw-600" style="margin-top:4px;">${esc(s.title)}</h2>
                  <div class="t-micro" style="margin-top:4px;">${esc(spks)}</div>
                  ${clash ? `<div style="margin-top:6px;"><span class="clash-chip t-micro">Overlap</span></div>` : ""}
                </div>
                <button type="button" class="tl-agenda-btn" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}" aria-label="${added ? "Remove" : "Add"} ${esc(s.title)} ${added ? "from" : "to"} my study plan">${svgPixelIcon(added ? "check" : "plus", 14)}</button>
              </div>
            </article>`;
          }).join("")}
        </div>`;
      } else {
        // Desktop / Tablet 15-min CSS grid timeline (09:00 to 21:00 = 48 rows)
        let hourMarks = "";
        for (let h = 9; h <= 21; h++) {
          const row = (h - 9) * 4 + 2;
          hourMarks += `<div class="tl-hour-line" style="grid-row:${row};"></div>`;
          hourMarks += `<div class="tl-hour-label t-micro tnum" style="grid-row:${row} / ${row + 2};">${String(h).padStart(2, "0")}.00</div>`;
        }
        const breakBlocks = breaks.map(b => {
          const rStart = Math.round((timeToMin(b.start) - 540) / 15) + 2;
          const rEnd = Math.round((timeToMin(b.end) - 540) / 15) + 2;
          const rm = roomById(b.room);
          return `<div class="tl-break t-micro" style="grid-row:${rStart} / ${rEnd};">
            <span>${fmtTime(b.start)}–${fmtTime(b.end)} · ${esc(b.title)}</span>
            <span>${esc(rm.name)}</span>
          </div>`;
        }).join("");

        const sessBlocks = filtered.map((s) => {
          const rStart = Math.round((timeToMin(s.start) - 540) / 15) + 2;
          const rEnd = Math.round((timeToMin(s.end) - 540) / 15) + 2;
          const col = ["listening", "speaking", "admin"].includes(s.room) || s.id === "f14" ? 3 : 2;
          const added = state.agenda.includes(s.id);
          const clash = hasClash(s);
          const spks = s.speakers.map(id => speakerById(id).name).join(", ");
          return `<article class="tl-session${added ? " is-added" : ""}${clash ? " is-clash" : ""}" data-track="${esc(s.track)}" data-sid="${esc(s.id)}" style="grid-column:${col};grid-row:${rStart} / ${rEnd};">
            <div class="tl-session-top">
              <div>
                <div class="t-micro tnum">${fmtTime(s.start)}–${fmtTime(s.end)} · ${esc(s.type)}</div>
                <h2 class="t-small fw-600" style="margin-top:2px;">${esc(s.title)}</h2>
                <div class="t-micro" style="margin-top:2px;">${esc(spks)}</div>
              </div>
              <button type="button" class="tl-agenda-btn" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}" aria-label="${added ? "Remove" : "Add"} ${esc(s.title)} ${added ? "from" : "to"} my study plan">${svgPixelIcon(added ? "check" : "plus", 14)}</button>
            </div>
            ${clash ? `<div><span class="clash-chip t-micro">Overlap</span></div>` : ""}
          </article>`;
        }).join("");

        bodyEl.innerHTML = `
          <div class="timeline-grid">
            <div class="tl-room-head t-micro" style="grid-column:1;">Time</div>
            <div class="tl-room-head t-micro" style="grid-column:2;">Core Players (Reading · Writing · Progress)</div>
            <div class="tl-room-head t-micro" style="grid-column:3;">Audio, Speaking & Admin Lab</div>
            ${hourMarks}
            ${breakBlocks}
            ${sessBlocks}
          </div>
        `;
      }

      // Wire study plan toggles and block navigation
      bodyEl.querySelectorAll("[data-ag]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          toggleAgenda(btn.dataset.ag);
          renderScheduleBody(false);
        });
      });
      bodyEl.querySelectorAll(".tl-session[data-sid]").forEach(card => {
        card.addEventListener("click", e => {
          if (e.target.closest("[data-ag]")) return;
          window.location.hash = `#/formats/${card.dataset.sid}`;
        });
        card.addEventListener("pointerenter", () => {
          if (card.scrollHeight > card.clientHeight + 2) {
            const s = sessionById(card.dataset.sid);
            if (s) showTip(card.getBoundingClientRect(), `${fmtTime(s.start)}–${fmtTime(s.end)} · ${s.title}`, false);
          }
        });
        card.addEventListener("pointerleave", hideTip);
      });
    }

    // Tab switching (click + keyboard roving tabindex)
    function selectDay(dayId, moveFocus) {
      state.filters.day = dayId;
      storageSet("ieafl.filters", state.filters);
      dayTabs.forEach(t => {
        const active = t.dataset.day === dayId;
        t.setAttribute("aria-selected", active ? "true" : "false");
        t.setAttribute("tabindex", active ? "0" : "-1");
        if (active && moveFocus) t.focus();
      });
      renderScheduleBody(true);
    }

    dayTabs.forEach((tab, idx) => {
      tab.addEventListener("click", () => selectDay(tab.dataset.day, false));
      tab.addEventListener("keydown", e => {
        let nextIdx = -1;
        if (e.key === "ArrowRight") nextIdx = (idx + 1) % dayTabs.length;
        else if (e.key === "ArrowLeft") nextIdx = (idx - 1 + dayTabs.length) % dayTabs.length;
        else if (e.key === "Home") nextIdx = 0;
        else if (e.key === "End") nextIdx = dayTabs.length - 1;
        if (nextIdx >= 0) {
          e.preventDefault();
          selectDay(dayTabs[nextIdx].dataset.day, true);
        }
      });
    });

    trackBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tid = btn.dataset.track;
        const i = state.filters.tracks.indexOf(tid);
        if (i === -1) state.filters.tracks.push(tid);
        else state.filters.tracks.splice(i, 1);
        btn.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        storageSet("ieafl.filters", state.filters);
        renderScheduleBody(false);
      });
    });

    agendaBtn.addEventListener("click", () => {
      state.filters.agendaOnly = !state.filters.agendaOnly;
      agendaBtn.setAttribute("aria-pressed", state.filters.agendaOnly ? "true" : "false");
      storageSet("ieafl.filters", state.filters);
      renderScheduleBody(false);
    });

    const setView = v => {
      state.filters.view = v;
      tlBtn.setAttribute("aria-pressed", v === "timeline" ? "true" : "false");
      tblBtn.setAttribute("aria-pressed", v === "table" ? "true" : "false");
      storageSet("ieafl.filters", state.filters);
      renderScheduleBody(false);
    };
    tlBtn.addEventListener("click", () => setView("timeline"));
    tblBtn.addEventListener("click", () => setView("table"));

    icsBtn.addEventListener("click", () => {
      const exportSessions = state.agenda.length > 0
        ? state.agenda.map(id => sessionById(id)).filter(Boolean)
        : getFilteredSessions().filtered;
      const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//ieafl//StudyPlan//EN"
      ];
      exportSessions.forEach(s => {
        const d = dayById(s.day);
        const rm = roomById(s.room);
        const ymd = d.date.replace(/-/g, "");
        const toUtc = hhmm => {
          const [hh, mm] = hhmm.split(":").map(Number);
          return String(hh).padStart(2, "0") + String(mm).padStart(2, "0") + "00Z";
        };
        lines.push("BEGIN:VEVENT");
        lines.push(`UID:${s.id}@ieafl.app`);
        lines.push(`DTSTAMP:20261121T000000Z`);
        lines.push(`DTSTART:${ymd}T${toUtc(s.start)}`);
        lines.push(`DTEND:${ymd}T${toUtc(s.end)}`);
        lines.push(`SUMMARY:ieafl — ${s.title}`);
        lines.push(`LOCATION:${rm.name} (${rm.nickname})`);
        lines.push(`DESCRIPTION:${s.abstract}`);
        lines.push("END:VEVENT");
      });
      lines.push("END:VCALENDAR");
      const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = "ieafl-study-plan.ics";
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    });

    const onResize = () => renderScheduleBody(false);
    window.addEventListener("resize", onResize, { passive: true });
    state.routeCleanup.push(() => window.removeEventListener("resize", onResize));

    renderScheduleBody(true);
  }

  // Route 3: Modules Index (#/modules)
  function renderSpeakers(main) {
    document.title = "Modules" + DATA.copy.siteTitleSuffix;
    main.innerHTML = `
      <section class="sub-sec" data-surface="sodium" data-pager="Modules">
        <div class="grid">
          <p class="col-1-3 t-micro">(Modules)</p>
          <div class="col-5-12">
            <h1 class="t-h1" tabindex="-1">${esc(DATA.copy.speakersTitle)}</h1>
            <p class="t-body" style="margin-top:16px;">${esc(DATA.copy.speakersLeadPage)}</p>
            <div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
              <div class="track-toggles-wrap" id="spk-track-toggles">
                ${DATA.tracks.map(t => {
                  const pressed = state.speakersFilter.tracks.includes(t.id);
                  return `<button type="button" class="chip-toggle t-small" data-track="${esc(t.id)}" aria-pressed="${pressed ? "true" : "false"}">
                    <svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="10" height="10" fill="${DATA.tokens.ink}"/><rect x="1" y="1" width="8" height="8" fill="${t.chipBg}"/></svg>
                    (${esc(t.label)})
                  </button>`;
                }).join("")}
              </div>
              <div class="seg-group" role="group" aria-label="Sort modules">
                <button type="button" class="chip-toggle t-small" id="spk-sort-az" aria-pressed="${state.speakersFilter.sort === "az" ? "true" : "false"}">(A–Z)</button>
                <button type="button" class="chip-toggle t-small" id="spk-sort-day" aria-pressed="${state.speakersFilter.sort === "day" ? "true" : "false"}">(By stage)</button>
              </div>
            </div>
          </div>
          <div class="col-full" id="spk-grid-wrap"></div>
        </div>
      </section>
    `;

    const gridWrap = document.getElementById("spk-grid-wrap");
    const trackBtns = Array.from(document.querySelectorAll("#spk-track-toggles .chip-toggle"));
    const azBtn = document.getElementById("spk-sort-az");
    const dayBtn = document.getElementById("spk-sort-day");

    function firstSessionOrder(sp) {
      const list = sessionsBySpeaker(sp.id).slice().sort((a, b) => {
        if (a.day !== b.day) return a.day.localeCompare(b.day);
        return timeToMin(a.start) - timeToMin(b.start);
      });
      const first = list[0];
      if (!first) return 999999;
      return Number(first.day[1]) * 10000 + timeToMin(first.start);
    }

    function drawList(skipFade) {
      let list = DATA.speakers.filter(sp =>
        state.speakersFilter.tracks.length === 0 || state.speakersFilter.tracks.includes(sp.track)
      );
      if (state.speakersFilter.sort === "az") {
        list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
      } else {
        list = list.slice().sort((a, b) => firstSessionOrder(a) - firstSessionOrder(b));
      }

      if (list.length === 0) {
        gridWrap.innerHTML = `<p class="t-lead" style="margin-top:48px;">No modules in this skill.</p>`;
        return;
      }

      const doRender = () => {
        gridWrap.innerHTML = `<div class="speakers-index-grid">
          ${list.map(sp => {
            const tr = trackById(sp.track);
            const sess = sessionsBySpeaker(sp.id);
            return `<figure class="speaker-card" data-spcard="${esc(sp.id)}">
              <a class="speaker-card-link" href="#/modules/${esc(sp.id)}">
                <canvas class="portrait-canvas" data-spid="${esc(sp.id)}" role="img" aria-label="Pixel emblem for ${esc(sp.name)}"></canvas>
              </a>
              <figcaption class="speaker-card-figcap">
                <h2 class="t-lead speaker-card-name"><a class="u-anim" href="#/modules/${esc(sp.id)}">${esc(sp.name)}</a></h2>
                <p class="t-small speaker-card-role">${esc(sp.role)}, ${esc(sp.org)}</p>
                <p class="t-micro" style="margin-top:4px;">${esc(sp.city)} · <span class="track-chip track-chip-${esc(sp.track)}">${esc(tr.label)}</span></p>
                <ul style="margin-top:8px;display:flex;flex-direction:column;gap:4px;">
                  ${sess.map(s => `<li class="t-micro"><a class="u-anim" href="#/formats/${esc(s.id)}">${esc(s.title)}</a></li>`).join("")}
                </ul>
              </figcaption>
            </figure>`;
          }).join("")}
        </div>`;

        list.forEach(sp => {
          const canvas = gridWrap.querySelector(`canvas[data-spid="${sp.id}"]`);
          if (canvas) initPortraitCanvas(canvas, sp, { skipAssemble: !skipFade });
        });
      };

      const existing = Array.from(gridWrap.querySelectorAll(".speaker-card"));
      if (!skipFade && state.motionOn && existing.length > 0) {
        const keepIds = new Set(list.map(s => s.id));
        const leaving = existing.filter(el => !keepIds.has(el.dataset.spcard));
        if (leaving.length > 0) {
          leaving.forEach(el => el.classList.add("is-leaving"));
          window.setTimeout(doRender, 160);
          return;
        }
      }
      doRender();
    }

    trackBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tid = btn.dataset.track;
        const i = state.speakersFilter.tracks.indexOf(tid);
        if (i === -1) state.speakersFilter.tracks.push(tid);
        else state.speakersFilter.tracks.splice(i, 1);
        btn.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        drawList(false);
      });
    });

    azBtn.addEventListener("click", () => {
      state.speakersFilter.sort = "az";
      azBtn.setAttribute("aria-pressed", "true");
      dayBtn.setAttribute("aria-pressed", "false");
      drawList(false);
    });
    dayBtn.addEventListener("click", () => {
      state.speakersFilter.sort = "day";
      azBtn.setAttribute("aria-pressed", "false");
      dayBtn.setAttribute("aria-pressed", "true");
      drawList(false);
    });

    drawList(true);
  }

  // Route 4: Module Detail (#/modules/<id>)

    if (idx === -1) {
      renderNotFound(main);
      return;
    }
    const sp = DATA.speakers[idx];
    const prevSp = DATA.speakers[(idx - 1 + DATA.speakers.length) % DATA.speakers.length];
    const nextSp = DATA.speakers[(idx + 1) % DATA.speakers.length];
    const tr = trackById(sp.track);
    const spSessions = sessionsBySpeaker(sp.id);
    const resLabels = ["4 × 4", "8 × 8", "16 × 16", "32 × 32"];

          <div class="col-1-5">
            <figure>
              <canvas class="portrait-canvas" id="detail-portrait" role="img" aria-label="Pixel emblem for ${esc(sp.name)}"></canvas>

            <p class="t-small" style="margin-top:8px;">${esc(sp.org)} · ${esc(sp.city)} · <span class="track-chip track-chip-${esc(sp.track)}">${esc(tr.label)}</span></p>
            <p class="t-body" style="margin-top:24px;">${esc(sp.bio)}</p>

            <h2 class="t-micro" style="margin-top:48px;">Supported Exam Formats</h2>
            <div class="speaker-sessions-list" id="sp-sessions-list">
              ${spSessions.map(s => {
                const d = dayById(s.day);
                const r = roomById(s.room);
                const added = state.agenda.includes(s.id);
                return `<div class="speaker-session-item">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
                    <div>
                      <p class="t-micro tnum">${esc(d.label)} · ${fmtTime(s.start)}–${fmtTime(s.end)} · ${esc(r.name)} · ${esc(s.type)}</p>
                      <h3 class="t-small fw-600" style="margin-top:4px;"><a class="u-anim" href="#/formats/${esc(s.id)}">${esc(s.title)}</a></h3>
                    </div>
                    <button type="button" class="chip-toggle t-micro" data-ag="${esc(s.id)}" aria-pressed="${added ? "true" : "false"}">${added ? "(In study plan)" : "(Add to study plan)"}</button>

      const btn = e.target.closest("[data-ag]");
      if (!btn) return;

      btn.setAttribute("aria-pressed", added ? "true" : "false");

  // Route 5: Official IELTS Exam Format (#/formats and #/formats/<id>)
  function renderTalks(main, formatId) {
    document.title = "Official IELTS Exam Format" + DATA.copy.siteTitleSuffix;

    // Graceful mapping if a Study Plan session ID (f01..f18) links here
    const SESSION_TO_FORMAT = {
      f01: "r02", f02: "r05", f03: "l04", f04: "r01", f05: "w01", f06: "s02",
      f07: "r08", f08: "l03", f09: "w03", f10: "w03", f11: "s01", f12: "s03",

                  <div>
                    <div class="exam-overview-head">
                      <span class="exam-overview-title-row">
                        ${svgSectionPixelIcon(sec.track, sec.color, "exam-overview-icon")}

                      </span>
                      <span class="track-chip track-chip-${esc(sec.track)} t-micro tnum">${count} ${unit}</span>
                    </div>
                    <div class="exam-overview-meta" style="margin-top:12px;">
                      <span class="t-small fw-600 tnum">${esc(sec.timing)}</span>
                      <span class="t-micro">${esc(sec.structure)}</span>
                      <span class="t-micro">${esc(sec.moduleNote)}</span>
                    </div>
                    <ul class="exam-overview-parts t-micro" style="margin-top:12px;">
                      ${sec.parts.map(p => `<li>${esc(p)}</li>`).join("")}

          <div class="col-full talks-controls">

    const searchInput = document.getElementById("talks-search");

    function syncOverviewCards() {
      ovCards.forEach(c => {
        const active = state.talksFilter.tracks.length === 1 && state.talksFilter.tracks[0] === c.dataset.ovTrack;
        c.setAttribute("aria-pressed", active ? "true" : "false");
      });
      trackBtns.forEach(b => {
        b.setAttribute("aria-pressed", state.talksFilter.tracks.includes(b.dataset.track) ? "true" : "false");
      });
    }

    function highlightText(text, query) {
      if (!query) return esc(text);
      const normQ = normText(query.trim());
      if (!normQ) return esc(text);
      let out = "";
      let pos = 0;
      const rawChars = Array.from(text);
      const normChars = rawChars.map(c => normText(c));
      const flatNorm = normChars.join("");
      let idx = flatNorm.indexOf(normQ);
      if (idx === -1) return esc(text);
      const mapStart = [];
      for (let i = 0; i < rawChars.length; i++) {
        for (let k = 0; k < normChars[i].length; k++) mapStart.push(i);
      }
      mapStart.push(rawChars.length);
      while (idx !== -1) {
        const rawS = mapStart[idx];
        const rawE = mapStart[idx + normQ.length];
        out += esc(rawChars.slice(pos, rawS).join(""));
        out += `<mark>${esc(rawChars.slice(rawS, rawE).join(""))}</mark>`;
        pos = rawE;
        idx = flatNorm.indexOf(normQ, idx + normQ.length);
      }
      out += esc(rawChars.slice(pos).join(""));
      return out;
    }

    function renderTable() {
      syncOverviewCards();
      const q = normText(state.talksFilter.query.trim());
      let list = DATA.examFormats.filter(item => {
        if (state.talksFilter.types.length > 0 && !state.talksFilter.types.includes(item.module)) return false;
        if (state.talksFilter.tracks.length > 0 && !state.talksFilter.tracks.includes(item.track)) return false;
        if (q) {
          const hay = normText(`${item.code} ${item.title} ${item.description} ${item.tests} ${item.rules} ${item.section} ${item.module}`);
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const dir = state.talksFilter.sortDir === "asc" ? 1 : -1;
      const col = state.talksFilter.sortCol;
      const skillOrder = { listening: 1, reading: 2, writing: 3, speaking: 4 };
      list.sort((a, b) => {
        if (col === "title") return a.title.localeCompare(b.title) * dir;
        if (col === "day") {
          const diff = (skillOrder[a.track] || 9) - (skillOrder[b.track] || 9);
          return (diff !== 0 ? diff : a.code.localeCompare(b.code)) * dir;
        }
        return a.code.localeCompare(b.code) * dir;
      });

      countEl.textContent = `${list.length} of ${DATA.examFormats.length} official IELTS task types`;

      if (list.length === 0) {
        wrapEl.innerHTML = `
          <div class="schedule-empty">
            <p class="t-lead">No official IELTS task type matches “${esc(state.talksFilter.query)}”.</p>
            <button type="button" class="btn-text t-small u-anim" id="talks-clear-btn">(Clear filters)</button>
          </div>

        document.getElementById("talks-clear-btn").addEventListener("click", () => {
          state.talksFilter.query = "";
          state.talksFilter.types = [];
          state.talksFilter.tracks = [];
          searchInput.value = "";
          typeBtns.forEach(b => b.setAttribute("aria-pressed", "false"));
          renderTable();
        });
        return;
      }

      const sortCap = col === "id" ? "code" : col === "title" ? "task type" : "exam order";
      const triSvg = activeCol => {
        if (state.talksFilter.sortCol !== activeCol) return "";
        const icon = state.talksFilter.sortDir === "asc" ? "tri-up" : "tri-down";
        return `<svg width="10" height="6" viewBox="0 0 5 3" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${
          icon === "tri-up"
            ? `<rect x="2" y="0" width="1" height="1"/><rect x="1" y="1" width="3" height="1"/><rect x="0" y="2" width="5" height="1"/>`
            : `<rect x="0" y="0" width="5" height="1"/><rect x="1" y="1" width="3" height="1"/><rect x="2" y="2" width="1" height="1"/>`
        }</svg>`;
      };
      const ariaSort = activeCol => state.talksFilter.sortCol !== activeCol ? "none" : (state.talksFilter.sortDir === "asc" ? "ascending" : "descending");

      wrapEl.innerHTML = `
        <table class="data-table responsive-table talks-table">
          <caption class="t-micro">Official IELTS task types, sorted by ${sortCap}</caption>
          <thead>
            <tr>
              <th class="t-micro" aria-sort="${ariaSort("id")}"><button type="button" class="sort-btn t-micro" data-sort="id">Code ${triSvg("id")}</button></th>
              <th class="t-micro" aria-sort="${ariaSort("title")}"><button type="button" class="sort-btn t-micro" data-sort="title">Official Task Type ${triSvg("title")}</button></th>
              <th class="t-micro" aria-sort="${ariaSort("day")}"><button type="button" class="sort-btn t-micro" data-sort="day">Skill ${triSvg("day")}</button></th>
              <th class="t-micro">Module</th>
              <th class="t-micro">Section &amp; Timing</th>
              <th class="t-micro">Scoring</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(item => {
              const tr = trackById(item.track);
              const isOpen = state.talksFilter.openId === item.id;
              return `
                <tr class="talk-row" id="talk-row-${esc(item.id)}" data-track="${esc(item.track)}">
                  <td data-label="Code" class="t-small tnum">${esc(item.code)}</td>
                  <td data-label="Official Task Type" class="t-small fw-600">
                    <button type="button" class="btn-text t-small fw-600 u-anim" data-disc="${esc(item.id)}" aria-expanded="${isOpen ? "true" : "false"}" aria-controls="expand-${esc(item.id)}">${highlightText(item.title, state.talksFilter.query)}</button>
                  </td>
                  <td data-label="Skill" class="t-small"><span class="track-chip track-chip-${esc(item.track)}">${esc(tr.label)}</span></td>
                  <td data-label="Module" class="t-small">${esc(item.module)}</td>
                  <td data-label="Section &amp; Timing" class="t-small tnum">${esc(item.section)}</td>
                  <td data-label="Scoring" class="t-small tnum">${esc(item.scoring)}</td>
                </tr>
                ${isOpen ? `
                  <tr class="talk-expand-row" id="expand-${esc(item.id)}">
                    <td colspan="6">
                      <p class="t-body">${highlightText(item.description, state.talksFilter.query)}</p>
                      <div class="exam-format-detail-grid">
                        <div>
                          <p class="t-micro">(What it tests)</p>
                          <p class="t-small" style="margin-top:6px;">${highlightText(item.tests, state.talksFilter.query)}</p>
                        </div>
                        <div>
                          <p class="t-micro">(Official exam rules &amp; traps)</p>
                          <p class="t-small" style="margin-top:6px;">${highlightText(item.rules, state.talksFilter.query)}</p>
                        </div>
                      </div>
                      <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;">
                        <a class="btn-text t-micro u-anim" href="#/schedule">(Rehearse in Study Plan)</a>
                        <a class="btn-text t-micro u-anim" href="#/workspace">(Inspect ${esc(tr.label)} workspace)</a>
                      </div>
                    </td>
                  </tr>
                ` : ""}
              `;
            }).join("")}
          </tbody>
        </table>
      `;

      wrapEl.querySelectorAll("[data-sort]").forEach(btn => {
        btn.addEventListener("click", () => {
          const c = btn.dataset.sort;
          if (state.talksFilter.sortCol === c) {
            state.talksFilter.sortDir = state.talksFilter.sortDir === "asc" ? "desc" : "asc";
          } else {
            state.talksFilter.sortCol = c;
            state.talksFilter.sortDir = "asc";
          }
          renderTable();
        });
      });

      wrapEl.querySelectorAll("[data-disc]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.disc;
          state.talksFilter.openId = state.talksFilter.openId === id ? null : id;
          renderTable();
          const newBtn = wrapEl.querySelector(`[data-disc="${id}"]`);
          if (newBtn) newBtn.focus();
        });
      });
    }

    ovCards.forEach(card => {
      card.addEventListener("click", () => {
        const tid = card.dataset.ovTrack;
        if (state.talksFilter.tracks.length === 1 && state.talksFilter.tracks[0] === tid) {
          state.talksFilter.tracks = [];
        } else {
          state.talksFilter.tracks = [tid];
        }
        renderTable();
      });
    });

    searchInput.addEventListener("input", () => {
      state.talksFilter.query = searchInput.value;
      renderTable();
    });

    typeBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tp = btn.dataset.type;
        const i = state.talksFilter.types.indexOf(tp);
        if (i === -1) state.talksFilter.types.push(tp);
        else state.talksFilter.types.splice(i, 1);
        btn.setAttribute("aria-pressed", i === -1 ? "true" : "false");
        renderTable();
      });
    });

    trackBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const tid = btn.dataset.track;
        const i = state.talksFilter.tracks.indexOf(tid);
        if (i === -1) state.talksFilter.tracks.push(tid);
        else state.talksFilter.tracks.splice(i, 1);
        renderTable();
      });
    });

    renderTable();

    if (resolvedId) {
      const targetRow = document.getElementById(`talk-row-${resolvedId}`);
      if (targetRow) {
        window.requestAnimationFrame(() => {
          const top = targetRow.getBoundingClientRect().top + window.scrollY - 120;
          window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
        });
      }
    }
  }

        <line x1="39.5" y1="0.5" x2="39.5" y2="23.5" stroke="${DATA.tokens.ink}" stroke-width="0.4"/>

    const capCtrl = buildCapacityGrid(document.getElementById("tickets-capacity-wrap"), { withSelection: true, instant: true });
    const totalEl = document.getElementById("tickets-total");
    const reserveBtn = document.getElementById("reserve-btn");
    const daySelect = document.getElementById("day-pass-select");
    const dayErr = document.getElementById("day-pass-error");
    const dialog = document.getElementById("reserve-dialog");
    const dlgBody = document.getElementById("dlg-body");
    const dlgClose = document.getElementById("dlg-close");

    function refreshTotals() {
      let totalCost = 0;
      let totalQty = 0;
      DATA.tickets.forEach(t => {
        const q = state.ticketQty[t.id] || 0;
        totalQty += q;
        totalCost += q * t.price;
        const row = document.querySelector(`.tier-row[data-tier="${t.id}"]`);
        if (row) {
          const out = row.querySelector(".stepper-val");
          if (out) out.textContent = String(q);
          const dec = row.querySelector('[data-step="-1"]');
          const inc = row.querySelector('[data-step="1"]');
          const maxQ = Math.min(4, t.left);
          const setDis = (btn, dis) => {
            if (!btn) return;
            btn.setAttribute("aria-disabled", dis ? "true" : "false");
            const existing = btn.querySelector(".btn-strike");
            if (dis && !existing) btn.insertAdjacentHTML("afterbegin", svgStrike());
            if (!dis && existing) existing.remove();
          };
          setDis(dec, q <= 0);
          setDis(inc, q >= maxQ);
        }
      });

      totalEl.textContent = `$${totalCost}/mo`;
      capCtrl.setSelected(totalQty);
      const isDisabled = totalQty === 0;
      reserveBtn.setAttribute("aria-disabled", isDisabled ? "true" : "false");
      const rStrike = reserveBtn.querySelector(".btn-strike");
      if (isDisabled && !rStrike) reserveBtn.insertAdjacentHTML("afterbegin", svgStrike());
      if (!isDisabled && rStrike) rStrike.remove();
    }

    document.getElementById("tickets-tier-list").addEventListener("click", e => {
      const btn = e.target.closest(".btn-stepper");
      if (!btn || btn.getAttribute("aria-disabled") === "true") return;
      const tid = btn.dataset.tid;
      const delta = Number(btn.dataset.step);
      const tier = DATA.tickets.find(t => t.id === tid);
      const maxQ = Math.min(4, tier.left);
      const cur = state.ticketQty[tid] || 0;
      const next = Math.max(0, Math.min(maxQ, cur + delta));
      state.ticketQty[tid] = next;
      if (tid === "day" && next === 0) {
        state.ticketError = false;
        dayErr.hidden = true;
        daySelect.removeAttribute("aria-invalid");
        daySelect.removeAttribute("aria-describedby");
      }
      refreshTotals();
    });

    daySelect.addEventListener("change", () => {
      state.ticketDay = daySelect.value;
      if (state.ticketDay) {
        state.ticketError = false;
        dayErr.hidden = true;
        daySelect.removeAttribute("aria-invalid");
        daySelect.removeAttribute("aria-describedby");
      }
    });

    reserveBtn.addEventListener("click", () => {
      if (reserveBtn.getAttribute("aria-disabled") === "true") return;
      if ((state.ticketQty.day || 0) > 0 && !state.ticketDay) {
        state.ticketError = true;
        dayErr.hidden = false;
        daySelect.setAttribute("aria-invalid", "true");
        daySelect.setAttribute("aria-describedby", "day-pass-error");
        daySelect.focus();
        return;
      }
      const parts = [];
      DATA.tickets.forEach(t => {
        const q = state.ticketQty[t.id] || 0;
        if (q > 0) {
          let s = `${q} × ${t.name}`;
          if (t.id === "day" && state.ticketDay) {
            s += ` (${TRACK_LABELS[state.ticketDay] || state.ticketDay})`;
          }
          parts.push(s);
        }
      });
      dlgBody.textContent = `This is an interactive showcase of ieafl, so no subscription was billed and no payment was taken. Your selection: ${parts.join(", ")}.`;
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
      dlgClose.focus();
    });

    dlgClose.addEventListener("click", () => {
      if (typeof dialog.close === "function") dialog.close();
      else dialog.removeAttribute("open");
      reserveBtn.focus();
    });
    dialog.addEventListener("close", () => {
      reserveBtn.focus();
    });

    refreshTotals();
  }

  // Route 8: Goal Card maker (#/badge)
  function renderBadge(main) {
    document.title = "Goal Card Maker" + DATA.copy.siteTitleSuffix;
    main.innerHTML = `
      <section class="sub-sec" data-surface="ink" data-pager="Goal card">

            <p class="t-body" style="margin-top:16px;">${esc(DATA.copy.badgeLead)}</p>
          </div>
        </div>
        <div class="grid badge-layout">
          <div class="col-1-6">
            <canvas class="badge-editor-canvas" id="badge-canvas" tabindex="0" role="img" aria-label="Goal card drawing grid, 16 by 16. Use arrow keys to move, Space to paint."></canvas>
            <p class="t-micro badge-status" id="badge-status" aria-live="polite">Row 1, column 1, paper.</p>
            <div class="palette-group" role="radiogroup" aria-label="Card colour palette" id="badge-palette">
              ${BADGE_PALETTE.map((c, idx) => `
                <button type="button" class="palette-swatch" role="radio" aria-checked="${idx === 3 ? "true" : "false"}" aria-label="${idx + 1}: ${esc(c.name)}" data-col="${esc(c.id)}" style="background-color:${c.hex};"></button>
              `).join("")}
            </div>
            <div class="badge-tools" id="badge-tools">
              <button type="button" class="chip-toggle t-small" data-tool="pen" aria-pressed="true">(Pen)</button>
              <button type="button" class="chip-toggle t-small" data-tool="erase" aria-pressed="false">(Erase)</button>
              <button type="button" class="chip-toggle t-small" data-tool="fill" aria-pressed="false">(Fill)</button>
              <button type="button" class="chip-toggle t-small" data-tool="mirror" aria-pressed="false">(Mirror)</button>
              <button type="button" class="chip-toggle t-small" id="badge-random">(Random)</button>
              <button type="button" class="chip-toggle t-small" id="badge-clear">(Clear)</button>
              <button type="button" class="chip-toggle t-small" id="badge-undo">(Undo)</button>
            </div>
          </div>
          <div class="col-8-12">
            <figure>
              <svg class="badge-preview-svg" id="badge-preview" viewBox="0 0 320 480" shape-rendering="crispEdges" role="img" aria-label="Goal card for ${esc(state.badge.name)}"></svg>
              <figcaption class="t-micro" style="margin-top:8px;">(Preview: 320 × 480 printable SVG goal card.)</figcaption>
            </figure>
            <div class="field-group badge-name-field">
              <label class="t-micro" for="badge-name-input">Name &amp; target band</label>
              <input class="text-input" type="text" id="badge-name-input" maxlength="18" value="${esc(state.badge.name)}">
            </div>
            <div class="badge-dl-wrap">
              <button type="button" class="btn-primary t-small" id="badge-dl-btn"><span>(Download SVG)</span></button>
            </div>
          </div>
        </div>
      </section>
    `;

    const canvas = document.getElementById("badge-canvas");
    const statusEl = document.getElementById("badge-status");
    const previewSvg = document.getElementById("badge-preview");
    const nameInput = document.getElementById("badge-name-input");
    const paletteBtns = Array.from(document.querySelectorAll("#badge-palette .palette-swatch"));
    const toolBtns = Array.from(document.querySelectorAll("#badge-tools [data-tool]"));

    let grid = state.badge.grid.split("");
    const history = [];
    let currentColor = "3"; // blue
    let mode = "pen"; // pen | erase | fill
    let mirror = false;
    let keyR = 0, keyC = 0;
    let canvasFocused = false;
    let painting = false;
    let paintModeOverride = null;

    function pushHistory() {
      history.push(grid.join(""));
      if (history.length > 20) history.shift();
    }

    function saveGrid() {
      state.badge.grid = grid.join("");
      storageSet("ieafl.badge", state.badge);
    }

    function drawEditor() {
      const rect = canvas.getBoundingClientRect();
      const maxPx = Math.min(rect.width || 320, 640);
      const cell = Math.max(12, Math.floor(maxPx / 16));
      const size = cell * 16;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(size * dpr)) {
        canvas.width = Math.round(size * dpr);
        canvas.height = Math.round(size * dpr);
      }
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = DATA.tokens.ink;
      ctx.fillRect(0, 0, size, size);

      for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 16; c++) {
          const palId = grid[r * 16 + c];
          const palObj = BADGE_PALETTE[Number(palId)] || BADGE_PALETTE[1];
          ctx.fillStyle = palObj.hex;
          ctx.fillRect(c * cell + 1, r * cell + 1, cell - 1, cell - 1);
        }
      }

      if (canvasFocused) {
        ctx.strokeStyle = DATA.tokens.sodium;
        ctx.lineWidth = 2;
        ctx.strokeRect(keyC * cell + 2, keyR * cell + 2, cell - 4, cell - 4);
      }
    }

    function updateStatus() {
      const palId = grid[keyR * 16 + keyC];
      const palObj = BADGE_PALETTE[Number(palId)] || BADGE_PALETTE[1];
      statusEl.textContent = `Row ${keyR + 1}, column ${keyC + 1}, ${palObj.name}.`;
    }

    function drawPreview() {
      const logoLayout = layoutGlyphLines([DATA.meta.name], 2);
      let logoRects = "";
      const lCellH = 2.4;
      const lCellW = lCellH * 1.25;
      const lx0 = 16;
      const ly0 = Math.round((48 - 9 * lCellH) / 2);
      for (let i = 0; i < logoLayout.cells.length; i++) {
        const cell = logoLayout.cells[i];
        logoRects += `<rect x="${(lx0 + cell.x * lCellW).toFixed(2)}" y="${(ly0 + cell.y * lCellH).toFixed(2)}" width="${lCellW}" height="${lCellH}" fill="${DATA.tokens.sodium}"/>`;
      }

      const spriteSize = 16 * 15;
      const sx0 = (320 - spriteSize) / 2;
      const sy0 = 68;
      let spriteRects = "";
      for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 16; c++) {
          const palId = grid[r * 16 + c];
          const palObj = BADGE_PALETTE[Number(palId)] || BADGE_PALETTE[1];
          spriteRects += `<rect x="${sx0 + c * 15}" y="${sy0 + r * 15}" width="15" height="15" fill="${palObj.hex}"/>`;
        }
      }

      let stripRects = "";
      for (let row = 0; row < 2; row++) {
        for (let i = 0; i < 16; i++) {
          stripRects += `<rect x="${i * 20}" y="${432 + row * 24}" width="20" height="24" fill="${TRAIL_COLORS[(i + row * 3) % TRAIL_COLORS.length]}"/>`;
        }
      }

      const badgeName = state.badge.name || "Band 8.0 Goal";
      previewSvg.setAttribute("aria-label", `Goal card for ${badgeName}`);
      previewSvg.innerHTML = `
        <rect x="0" y="0" width="320" height="480" fill="${DATA.tokens.sodium}"/>
        <rect x="0" y="0" width="320" height="48" fill="${DATA.tokens.ink}"/>
        ${logoRects}
        ${spriteRects}
        <text x="16" y="356" font-family="Inter Tight, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="${DATA.tokens.ink}">${esc(badgeName)}</text>
        <text x="16" y="388" font-family="Inter Tight, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="${DATA.tokens.ink}">4 SKILLS · CD-IELTS · ieafl</text>
        ${stripRects}
      `;
    }

    function paintAt(r, c, colorId) {
      if (r < 0 || r >= 16 || c < 0 || c >= 16) return;
      grid[r * 16 + c] = colorId;
      if (mirror) {
        grid[r * 16 + (15 - c)] = colorId;
      }
    }

    function floodFill(r, c, newCol) {
      const target = grid[r * 16 + c];
      if (target === newCol) return;
      const queue = [[r, c]];
      const seen = new Set();
      while (queue.length > 0) {
        const [cr, cc] = queue.shift();
        const k = cr * 16 + cc;
        if (cr < 0 || cr >= 16 || cc < 0 || cc >= 16 || seen.has(k) || grid[k] !== target) continue;
        seen.add(k);
        grid[k] = newCol;
        queue.push([cr - 1, cc], [cr + 1, cc], [cr, cc - 1], [cr, cc + 1]);
      }
    }

    function coordsFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const c = Math.min(15, Math.max(0, Math.floor(((e.clientX - rect.left) / rect.width) * 16)));
      const r = Math.min(15, Math.max(0, Math.floor(((e.clientY - rect.top) / rect.height) * 16)));
      return { r, c };
    }

    canvas.addEventListener("contextmenu", e => e.preventDefault());
    canvas.addEventListener("pointerdown", e => {
      e.preventDefault();
      canvas.focus();
      const { r, c } = coordsFromEvent(e);
      keyR = r; keyC = c;
      pushHistory();
      if (e.button === 2) {
        painting = true;
        paintModeOverride = "1";
        paintAt(r, c, "1");
      } else if (mode === "fill") {
        floodFill(r, c, currentColor);
      } else {
        painting = true;
        paintModeOverride = mode === "erase" ? "1" : currentColor;
        paintAt(r, c, paintModeOverride);
      }
      if (canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    canvas.addEventListener("pointermove", e => {
      if (!painting) return;
      const { r, c } = coordsFromEvent(e);
      keyR = r; keyC = c;
      paintAt(r, c, paintModeOverride);
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    const stopPaint = () => {
      painting = false;
      paintModeOverride = null;
    };
    canvas.addEventListener("pointerup", stopPaint);
    canvas.addEventListener("pointercancel", stopPaint);

    canvas.addEventListener("focus", () => {
      canvasFocused = true;
      drawEditor();
      updateStatus();
    });
    canvas.addEventListener("blur", () => {
      canvasFocused = false;
      drawEditor();
    });

    canvas.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") { keyC = Math.min(15, keyC + 1); }
      else if (e.key === "ArrowLeft") { keyC = Math.max(0, keyC - 1); }
      else if (e.key === "ArrowDown") { keyR = Math.min(15, keyR + 1); }
      else if (e.key === "ArrowUp") { keyR = Math.max(0, keyR - 1); }
      else if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        pushHistory();
        if (mode === "fill") floodFill(keyR, keyC, currentColor);
        else paintAt(keyR, keyC, mode === "erase" ? "1" : currentColor);
        saveGrid();
        drawPreview();
      } else if (e.key === "Delete" || e.key === "Backspace") {
        e.preventDefault();
        pushHistory();
        paintAt(keyR, keyC, "1");
        saveGrid();
        drawPreview();
      } else if (e.key >= "1" && e.key <= "9") {
        selectColor(String(Number(e.key) - 1));
      } else {
        return;
      }
      e.preventDefault();
      drawEditor();
      updateStatus();
    });

    function selectColor(colId) {
      currentColor = colId;
      paletteBtns.forEach(b => b.setAttribute("aria-checked", b.dataset.col === colId ? "true" : "false"));
    }

    paletteBtns.forEach((btn, idx) => {
      btn.addEventListener("click", () => selectColor(btn.dataset.col));
      btn.addEventListener("keydown", e => {
        let next = -1;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (idx + 1) % paletteBtns.length;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (idx - 1 + paletteBtns.length) % paletteBtns.length;
        if (next >= 0) {
          e.preventDefault();
          selectColor(paletteBtns[next].dataset.col);
          paletteBtns[next].focus();
        }
      });
    });

    toolBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const t = btn.dataset.tool;
        if (t === "mirror") {
          mirror = !mirror;
          btn.setAttribute("aria-pressed", mirror ? "true" : "false");
          return;
        }
        mode = t;
        toolBtns.forEach(b => {
          if (b.dataset.tool !== "mirror") {
            b.setAttribute("aria-pressed", b.dataset.tool === mode ? "true" : "false");
          }
        });
      });
    });

    document.getElementById("badge-random").addEventListener("click", () => {
      pushHistory();
      const rng = makeRng(Date.now());
      const accent = String(3 + Math.floor(rng() * 6));
      const g = new Array(256).fill("1");
      for (let r = 2; r <= 13; r++) {
        for (let c = 0; c < 8; c++) {
          if (rng() < 0.42) {
            g[r * 16 + c] = accent;
            g[r * 16 + (15 - c)] = accent;
          }
        }
      }
      const eyeC = 3 + Math.floor(rng() * 4);
      g[6 * 16 + eyeC] = "0";
      g[6 * 16 + (15 - eyeC)] = "0";
      grid = g;
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    document.getElementById("badge-clear").addEventListener("click", () => {
      pushHistory();
      grid = new Array(256).fill("1");
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    });

    const doUndo = () => {
      if (history.length === 0) return;
      grid = history.pop().split("");
      saveGrid();
      drawEditor();
      drawPreview();
      updateStatus();
    };
    document.getElementById("badge-undo").addEventListener("click", doUndo);

    const onKeyUndo = e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        doUndo();
      }
    };
    document.addEventListener("keydown", onKeyUndo);

    nameInput.addEventListener("input", () => {
      state.badge.name = nameInput.value.slice(0, 18);
      storageSet("ieafl.badge", state.badge);
      drawPreview();
    });

    document.getElementById("badge-dl-btn").addEventListener("click", () => {
      const ser = new XMLSerializer();
      const clone = previewSvg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", "320");
      clone.setAttribute("height", "480");
      const svgText = `<?xml version="1.0" encoding="UTF-8"?>\n` + ser.serializeToString(clone);
      const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = blobUrl;
      a.download = "ieafl-goal-card.svg";
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    });

    const ro = new ResizeObserver(drawEditor);
    ro.observe(canvas);
    state.routeCleanup.push(() => {
      ro.disconnect();
      document.removeEventListener("keydown", onKeyUndo);
    });

    drawEditor();
    drawPreview();
    updateStatus();
  }

  // Hash Router
  let currentRouteKey = null;

  function parseRoute(hash) {
    const clean = (hash || "#/").replace(/^#/, "");
    if (clean === "" || clean === "/") return { view: "home", key: "home" };
    const parts = clean.split("/").filter(Boolean);
    if (parts[0] === "schedule" && parts.length === 1) return { view: "schedule", key: "schedule" };
    if ((parts[0] === "modules" || parts[0] === "speakers") && parts.length === 1) return { view: "speakers", key: "speakers" };
    if ((parts[0] === "modules" || parts[0] === "speakers") && parts.length === 2) return { view: "speaker", param: parts[1], key: "speaker:" + parts[1] };
    if ((parts[0] === "formats" || parts[0] === "talks") && parts.length === 1) return { view: "talks", key: "talks" };
    if ((parts[0] === "formats" || parts[0] === "talks") && parts.length === 2) return { view: "talks", param: parts[1], key: "talks:" + parts[1] };
    if ((parts[0] === "workspace" || parts[0] === "venue") && parts.length === 1) return { view: "venue", key: "venue" };
    if ((parts[0] === "access" || parts[0] === "tickets") && parts.length === 1) return { view: "tickets", key: "tickets" };
    if (parts[0] === "badge" && parts.length === 1) return { view: "badge", key: "badge" };
    return { view: "404", key: "404" };
  }

  function updateActiveNav(route) {
    const mapHref = {
      schedule: "#/schedule",
      speakers: "#/modules",
      speaker: "#/modules",
      talks: "#/formats",
      venue: "#/workspace",
      tickets: "#/access",
      badge: "#/badge"
    }[route.view] || "";
    document.querySelectorAll("#header-nav a, #menu-nav a").forEach(a => {
      if (a.getAttribute("href") === mapHref) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function mountRoute(route, skipWipe) {
    const main = document.getElementById("main");
    const doSwap = () => {
      while (state.routeCleanup.length > 0) {
        const fn = state.routeCleanup.pop();
        try { fn(); } catch (e) {}
      }
      hideTip();

      if (route.view === "home") renderHome(main);
      else if (route.view === "schedule") renderSchedule(main);
      else if (route.view === "speakers") renderSpeakers(main);
      else if (route.view === "speaker") renderSpeakerDetail(main, route.param);
      else if (route.view === "talks") renderTalks(main, route.param);
      else if (route.view === "venue") renderVenue(main);
      else if (route.view === "tickets") renderTickets(main);
      else if (route.view === "badge") renderBadge(main);
      else renderNotFound(main);

      updateActiveNav(route);
      setupObservers();

      if (state.scrollAfterRoute) {
        const target = document.getElementById(state.scrollAfterRoute);
        state.scrollAfterRoute = null;
        if (target) target.scrollIntoView({ behavior: state.motionOn ? "smooth" : "auto" });
      } else if (!(route.view === "talks" && route.param)) {
        window.scrollTo(0, 0);
      }

      if (!skipWipe) {
        const h1 = main.querySelector("h1");
        if (h1) h1.focus({ preventScroll: true });
      }
    };

    if (skipWipe) doSwap();
    else playWipe(doSwap);
  }

  function init() {
    initChrome();
    initTrail();
    const initial = parseRoute(window.location.hash);
    currentRouteKey = initial.key;
    mountRoute(initial, true);

    window.addEventListener("hashchange", () => {
      const next = parseRoute(window.location.hash);
      if (next.key === currentRouteKey) return;
      currentRouteKey = next.key;
      mountRoute(next, false);
    });
  }

  return { init };
})();

document.addEventListener("DOMContentLoaded", () => APP.init());
</script>
</body>
</html>
